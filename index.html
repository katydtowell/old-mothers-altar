              {/* Custom option */}
              <button title="Custom color" onClick={() => { setColorMode('custom'); setColor(''); }} style={{
                width: 32, height: 32, borderRadius: 50, cursor: 'pointer', flexShrink: 0,
                background: 'var(--bg-page)',
                border: colorMode === 'custom' ? '2px solid var(--fg-1)' : '1.5px dashed var(--line-medium)',
                outline: 0, fontSize: 15,

            </div>
            {/* Selected preset name or custom input */}
            {colorMode === 'preset' && color && (
              <div style={{ color: 'var(--fg-2)', fontSize: 12 }}>{color}</div>

            {colorMode === 'custom' && (
              <input value={color} onChange={e => setColor(e.target.value)} autoComplete="off"
                placeholder="Custom color name…" style={{ ...field }} />

            {(colorMode === 'preset' && color) || colorMode === 'custom' ? (
              <button onClick={() => { setColor(''); setColorMode('preset'); }} style={{

              if (window.confirm(`Remove "${item.name}" from the cabinet?`)) { onDelete(item.id); onClose(); }

}

// ── Cabinet main view ───────────────────────────────────────────────────────
function Cabinet({ cabinet, onSave, onDelete, addRef }) {
  const [search,     setSearch]    = React.useState('');
  const [typeFilter, setTypeFilter] = React.useState([]);
  const [filterOpen, setFilterOpen] = React.useState(false);
  const [formOpen,   setFormOpen]  = React.useState(false);
  const [editItem,   setEditItem]  = React.useState(null);
  const filterRef = React.useRef(null);

  const field = {
    background: 'var(--bg-surface)', border: '1px solid var(--line-soft)',
    borderRadius: 'var(--r-pill)', padding: '9px 16px',
    color: 'var(--fg-1)', fontFamily: 'var(--font-body)',
    fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box',
  };

  // Close filter on click outside
  React.useEffect(() => {
    if (!filterOpen) return;
    function handleDown(e) {
      if (filterRef.current && !filterRef.current.contains(e.target)) setFilterOpen(false);
    }
    document.addEventListener('mousedown', handleDown);
    return () => document.removeEventListener('mousedown', handleDown);
  }, [filterOpen]);

  // Derive present types as SearchSelect items
  const presentTypes = [...new Set(cabinet.map(c => c.type))];
  const typeItems = presentTypes.map(t => ({ key: t, label: typeEmoji(t) + ' ' + typeLabel(t) }));

  const filtered = cabinet.filter(c => {
    const matchSearch = !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.note?.toLowerCase().includes(search.toLowerCase());
    const matchFilter = typeFilter.length === 0 || typeFilter.includes(c.type);
    return matchSearch && matchFilter;
  });

  // Group by type for display
  const grouped = {};
  filtered.forEach(c => {
    if (!grouped[c.type]) grouped[c.type] = [];
    grouped[c.type].push(c);
  });

  function openAdd() { setEditItem(null); setFormOpen(true); }
  function openEdit(item) { setEditItem(item); setFormOpen(true); }

  if (addRef) addRef.current = openAdd;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>
      {/* Search + filter */}
      <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--line-soft)' }}>
        <div ref={filterRef} style={{ position: 'relative' }}>
          <div style={{ display: 'flex', gap: 8 }}>
            {/* Search */}
            <input value={search} onChange={e => setSearch(e.target.value)} autoComplete="off"
              placeholder="Search stores…" style={{ ...field, flex: 1 }} />
            {/* Filter button */}
            {typeItems.length > 0 && (
              <button onClick={() => setFilterOpen(o => !o)} style={{
                width: 40, height: 40, borderRadius: 'var(--r-md)', cursor: 'pointer', flexShrink: 0,
                background: filterOpen || typeFilter.length > 0 ? 'var(--chrome-active-bg)' : 'var(--bg-surface)',
                border: '1px solid ' + (filterOpen || typeFilter.length > 0 ? 'var(--chrome-active-line)' : 'var(--line-soft)'),
                color: filterOpen || typeFilter.length > 0 ? 'var(--chrome-active-fg)' : 'var(--fg-2)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                position: 'relative',
              }}>
                {React.cloneElement(Ico.filter, { size: 17 })}
                {typeFilter.length > 0 && (
                  <span style={{
                    position: 'absolute', top: 5, right: 5,
                    width: 14, height: 14, borderRadius: 50,
                    background: 'var(--ember)', color: '#fff',
                    fontSize: 8, fontFamily: 'var(--font-mono)', fontWeight: 700,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>{typeFilter.length}</span>
                )}
              </button>
            )}
          </div>
          {/* Filter dropdown */}
          {filterOpen && typeItems.length > 0 && (
            <div style={{
              position: 'absolute', top: 'calc(100% + 6px)', left: 0, right: 0, zIndex: 200,
              background: 'var(--bg-surface)', border: '1px solid var(--line-medium)',
              borderRadius: 'var(--r-lg)', boxShadow: 'var(--shadow-3)',
              padding: '12px 12px 10px',
            }}>
              <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em', marginBottom: 8 }}>
                SUPPLY TYPE
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 10 }}>
                {typeItems.map(item => {
                  const active = typeFilter.includes(item.key);
                  return (
                    <button key={item.key} onClick={() => setTypeFilter(prev =>
                      prev.includes(item.key) ? prev.filter(t => t !== item.key) : [...prev, item.key]
                    )} style={{
                      padding: '5px 10px', borderRadius: 999, cursor: 'pointer',
                      background: active ? 'var(--chrome-active-bg)' : 'var(--bg-page)',
                      border: '1px solid ' + (active ? 'var(--chrome-active-line)' : 'var(--line-soft)'),
                      color: active ? 'var(--chrome-active-fg)' : 'var(--fg-2)',
                      fontFamily: 'var(--font-body)', fontSize: 12,
                    }}>{item.label}</button>
                  );
                })}
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: 8, borderTop: '1px solid var(--line-soft)' }}>
                <button onClick={() => setTypeFilter([])} style={{
                  background: 'none', border: 0, cursor: 'pointer',
                  color: typeFilter.length > 0 ? 'var(--ember)' : 'var(--fg-3)',
                  fontFamily: 'var(--font-body)', fontSize: 12, padding: '4px 0',
                }}>
                  {typeFilter.length > 0 ? `Clear (${typeFilter.length})` : 'Clear'}
                </button>
                <Btn variant="primary" size="sm" onClick={() => setFilterOpen(false)}>Done</Btn>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* List */}
      <div style={{ flex: 1, padding: '14px 16px 22px' }}>
        {filtered.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '48px 24px', color: 'var(--fg-3)' }}>
            <div style={{ fontSize: 32, marginBottom: 12 }}>🗄️</div>
            <div style={{ fontSize: 16, fontWeight: 600, color: 'var(--fg-2)', marginBottom: 6 }}>
              {cabinet.length === 0 ? 'Cabinet is empty' : 'No matches'}
            </div>
            <div style={{ fontSize: 13, marginBottom: 16 }}>
              {cabinet.length === 0 ? 'Add your ritual supplies and ingredients.' : 'Try a different search or filter.'}
            </div>
            {cabinet.length === 0 && (
              <Btn variant="primary" size="md" icon={Ico.plus} onClick={openAdd}>Add an Item</Btn>
            )}
          </div>
        ) : (
          Object.entries(grouped).map(([type, items]) => (
            <div key={type} style={{ marginBottom: 20 }}>
              <div className="oma-eyebrow" style={{ marginBottom: 8 }}>
                {typeEmoji(type)} {typeLabel(type)}
              </div>
              <div style={{ borderRadius: 'var(--r-lg)', border: '1px solid var(--line-soft)', overflow: 'hidden', background: 'var(--bg-surface)' }}>
                {items.map((item, i) => (
                  <button key={item.id} onClick={() => openEdit(item)} style={{
                    width: '100%', background: 'none', border: 0, cursor: 'pointer',
                    display: 'flex', alignItems: 'center', gap: 12,
                    padding: '12px 14px',
                    borderTop: i === 0 ? 0 : '1px solid var(--line-soft)',
                    textAlign: 'left',
                  }}>
                    <div style={{ fontSize: 20, flexShrink: 0 }}>{typeEmoji(item.type)}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600 }}>{item.name}</div>
                      {item.color && <div style={{ color: 'var(--fg-3)', fontSize: 12, marginTop: 2 }}>{item.color}</div>}
                      {!item.color && item.note && <div style={{ color: 'var(--fg-3)', fontSize: 12, marginTop: 2 }}>{item.note}</div>}
                      {item.color && item.note && <div style={{ color: 'var(--fg-3)', fontSize: 11, marginTop: 1, fontStyle: 'italic' }}>{item.note}</div>}
                    </div>
                    <div style={{ flexShrink: 0, textAlign: 'right' }}>
                      {item.inv != null ? (
                        <div>
                          <div style={{
                            color: item.inv === 0 ? 'var(--crimson-300)' : item.inv <= 1 ? 'var(--warning)' : 'var(--success)',
                            fontSize: 16, fontWeight: 700, fontFamily: 'var(--font-mono)',
                          }}>{item.inv}</div>
                          <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)' }}>ON HAND</div>
                        </div>
                      ) : (
                        <div style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)' }}>—</div>
                      )}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          ))
        )}
      </div>

      <CabinetForm open={formOpen} item={editItem}
        onClose={() => { setFormOpen(false); setEditItem(null); }}
        onSave={onSave} onDelete={onDelete} />
    </div>
  );
}

window.Cabinet = Cabinet;

  </script>

  <!-- ── NewWorking.jsx ── -->
  <script type="text/babel">
// NewWorking.jsx — full-page form for composing or editing a spell

const MOON_PHASES_NW = [
  {key:'new',label:'New Moon'},
  {key:'waxing-crescent',label:'Waxing Crescent'},
  {key:'first-quarter',label:'First Quarter'},
  {key:'waxing-gibbous',label:'Waxing Gibbous'},
  {key:'full',label:'Full Moon'},
  {key:'waning-gibbous',label:'Waning Gibbous'},
  {key:'last-quarter',label:'Last Quarter'},
  {key:'waning-crescent',label:'Waning Crescent'},
];

const MAGIC_TYPES_NW  = ['Candle','Knot','Herbal','Crystal','Sigil','Moon','Ritual','Sachet','Bath','Fire','Other'];
const CATEGORIES_NW   = ['Protection','Love','Prosperity','Clarity','Banishing','Healing','Divination','Grounding','Communication','Luck','Other'];
const SEASONS_NW      = ['Spring','Summer','Autumn','Winter'];
const TIMES_NW        = ['Dawn','Morning','Afternoon','Evening','Midnight'];
const DAYS_NW         = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DURATION_UNITS  = ['minutes','hours','days','weeks','months'];

const TIMING_TABS_NW = [
  { id: 'moon',   label: 'Moon',   icoKey: 'moonIcon' },
  { id: 'season', label: 'Season', icoKey: 'sun'      },
  { id: 'time',   label: 'Time',   icoKey: 'candle'   },
  { id: 'day',    label: 'Day',    icoKey: 'calendar' },
];

function StarRating({ value, onChange }) {
  return (
    <div style={{ display: 'flex', gap: 4 }}>
      {[1,2,3,4,5].map(n => (
        <button key={n} onClick={() => onChange(value === n ? 0 : n)} style={{
          background: 'none', border: 0, cursor: 'pointer', padding: '2px',
          color: n <= value ? 'var(--amber)' : 'var(--fg-3)',
          fontSize: 22,
        }}>★</button>
      ))}
    </div>
  );
}

// Section header — must be defined OUTSIDE NewWorking to keep stable identity across re-renders
function NWSection({ title, children }) {
  return (
    <div>
      <div style={{
        color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)',
        letterSpacing: '0.12em', textTransform: 'uppercase',
        borderBottom: '1px solid var(--line-soft)', paddingBottom: 6, marginBottom: 12,
      }}>{title}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>{children}</div>
    </div>
  );
}

function NewWorking({ editData, onCreate, onSave, submitRef }) {
  const [name,         setName]        = React.useState('');
  const [summary,      setSummary]     = React.useState('');
  const [authorSelf,   setAuthorSelf]  = React.useState(true);
  const [author,       setAuthor]      = React.useState('');
  const [source,       setSource]      = React.useState('');
  const [rating,       setRating]      = React.useState(0);
  const [moonPhase,    setMoonPhase]   = React.useState('');
  const [season,       setSeason]      = React.useState([]);
  const [tod,          setTod]         = React.useState([]);
  const [dow,          setDow]         = React.useState([]);
  const [timingCustom, setTimingCustom] = React.useState('');
  const [magicType,    setMagicType]   = React.useState([]);
  const [category,     setCategory]    = React.useState([]);
  const [chant,        setChant]       = React.useState('');
  const [deityInput,   setDeityInput]  = React.useState('');
  const [deities,      setDeities]     = React.useState([]);
  const [ingName,      setIngName]     = React.useState('');
  const [ingAmt,       setIngAmt]      = React.useState('');
  const [ingNote,      setIngNote]     = React.useState('');
  const [ingredients,  setIngredients] = React.useState([]);
  const [taskText,     setTaskText]    = React.useState('');
  const [tasks,        setTasks]       = React.useState([]);
  const [editingTaskId,   setEditingTaskId]   = React.useState(null);
  const [editingTaskText, setEditingTaskText] = React.useState('');
  const [durVal,       setDurVal]      = React.useState('');
  const [durUnit,      setDurUnit]     = React.useState('days');
  const [timingTab,    setTimingTab]   = React.useState('moon');

  // On mount: load editData if present, otherwise state is already at defaults
  React.useEffect(() => {
    if (editData) {
      setName(editData.name || '');
      setSummary(editData.summary || '');
      setAuthorSelf(editData.authorSelf !== false);
      setAuthor(editData.author || '');
      setSource(editData.source || '');
      setRating(editData.rating || 0);
      setMoonPhase(editData.moonPhase || '');
      setSeason(editData.season || []);
      setTod(editData.tod || []);
      setDow(editData.dow || []);
      setTimingCustom(editData.timingCustom || '');
      setMagicType(editData.magicType || []);
      setCategory(editData.category || []);
      setChant(editData.chant || '');
      setDeities(editData.deities || []);
      setIngredients((editData.ingredients || []).map((ing, i) => ({ ...ing, id: ing.id || String(i) })));
      setTasks((editData.tasks || []).map((t, i) => ({ ...t, id: t.id || String(i) })));
      setDurVal(editData.duration ? String(editData.duration.val) : '');
      setDurUnit(editData.duration ? editData.duration.unit : 'days');
    }
  }, []); // Run once on mount — component is re-keyed by App.jsx each open

  const field = {
    background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
    borderRadius: 'var(--r-xs)', padding: '11px 14px',
    color: 'var(--fg-1)', fontFamily: 'var(--font-body)',
    fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box',
  };
  const selectStyle = { ...field, appearance: 'none', cursor: 'pointer' };

  function addDeity() {
    const d = deityInput.trim();
    if (d && !deities.includes(d)) { setDeities([...deities, d]); setDeityInput(''); }
  }

  function addIngredient() {
    if (!ingName.trim()) return;
    setIngredients([...ingredients, { id: Date.now().toString(), name: ingName.trim(), amount: ingAmt.trim(), note: ingNote.trim() }]);
    setIngName(''); setIngAmt(''); setIngNote('');
  }

  function addTask() {
    if (!taskText.trim()) return;
    setTasks([...tasks, { id: Date.now().toString(), text: taskText.trim() }]);
    setTaskText('');
  }

  function iconForCategory(cats) {
    if (cats.includes('Healing') || cats.includes('Love')) return 'flame';
    if (cats.includes('Divination')) return 'moon';
    return 'sparkle';
  }

  function handleCreate() {
    if (!name.trim()) return;
    const ik = iconForCategory(category);
    const spellData = {
      name: name.trim(),
      summary: summary.trim(),
      sealed: editData ? editData.sealed : false,
      castCount: editData ? (editData.castCount || 0) : 0,
      tags: [...category.slice(0, 2), ...magicType.slice(0, 1)],
      color: editData?.color || '#96A560',
      iconKey: ik,
      moonPhase: moonPhase || 'full',
      season, tod, dow, timingCustom,
      magicType, category,
      chant: chant.trim(),
      deities, ingredients, tasks,
      rating,
      author: authorSelf ? 'Self' : (author.trim() || 'Unknown'),
      authorSelf,
      source: source.trim(),
      duration: durVal ? { val: parseInt(durVal), unit: durUnit } : null,
    };
    if (editData && onSave) {
      onSave({ ...editData, ...spellData });
    } else {
      onCreate({ id: Date.now().toString(), casts: [], ...spellData });
    }
  }

  // Expose submit to App.jsx bottom bar button
  if (submitRef) submitRef.current = handleCreate;

  return (
    <div style={{ padding: '14px 18px 22px', display: 'flex', flexDirection: 'column', gap: 20 }}>

      {/* ── Identity ── */}
      <NWSection title="Identity">
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="oma-eyebrow" style={{ fontSize: 10 }}>Name *</span>
          <input value={name} onChange={e => setName(e.target.value)} autoComplete="off"
            placeholder="Name this spell…"
            style={{ ...field, fontFamily: '"Ohno Blazeface 18", var(--font-display)', fontStyle: 'normal', fontWeight: 400, textTransform: 'uppercase', letterSpacing: '0.02em', fontSize: 18 }} />
        </label>

        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="oma-eyebrow" style={{ fontSize: 10 }}>Summary</span>
          <textarea value={summary} onChange={e => setSummary(e.target.value)} rows={3} autoComplete="off"
            placeholder="What this spell is for…"
            style={{ ...field, resize: 'none', lineHeight: 1.55 }} />
        </label>

        <div>
          <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Author</span>
          <div style={{ display: 'flex', gap: 6, marginBottom: authorSelf ? 0 : 8 }}>
            {['Self','Other'].map(opt => (
              <button key={opt} onClick={() => setAuthorSelf(opt === 'Self')} style={{
                padding: '6px 14px', borderRadius: 999, cursor: 'pointer',
                background: (opt === 'Self') === authorSelf ? 'var(--chrome-active-bg)' : 'var(--bg-page)',
                border: '1px solid ' + ((opt === 'Self') === authorSelf ? 'var(--chrome-active-line)' : 'var(--line-soft)'),
                color: (opt === 'Self') === authorSelf ? 'var(--chrome-active-fg)' : 'var(--fg-2)',
                fontFamily: 'var(--font-body)', fontSize: 13,
              }}>{opt}</button>
            ))}
          </div>
          {!authorSelf && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 8 }}>
              <input value={author} onChange={e => setAuthor(e.target.value)} autoComplete="off"
                placeholder="Author name…" style={{ ...field }} />
              <input value={source} onChange={e => setSource(e.target.value)} autoComplete="off"
                placeholder="Source URL (optional)" style={{ ...field }} />
            </div>
          )}
        </div>

        <div>
          <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Rating</span>
          <StarRating value={rating} onChange={setRating} />
        </div>
      </NWSection>

      {/* ── Classification ── */}
      <NWSection title="Classification">
        <div>
          <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Category</span>
          <SearchSelect items={CATEGORIES_NW} value={category} onChange={setCategory} multi placeholder="Select categories…" />
        </div>
        <div>
          <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Magic Type</span>
          <SearchSelect items={MAGIC_TYPES_NW} value={magicType} onChange={setMagicType} multi placeholder="Select magic types…" />
        </div>
      </NWSection>

      {/* ── Ideal Timing (tabbed) ── */}
      <NWSection title="Ideal Timing">
        <div>
          {/* Tab strip */}
          <div style={{ display: 'flex', borderBottom: '1px solid var(--line-soft)', marginBottom: 14 }}>
            {TIMING_TABS_NW.map(t => (
              <button key={t.id} onClick={() => setTimingTab(t.id)} style={{
                flex: 1, padding: '8px 4px 9px', background: 'none', border: 0,
                borderBottom: '2px solid ' + (timingTab === t.id ? 'var(--amber)' : 'transparent'),
                marginBottom: -1, cursor: 'pointer',
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                color: timingTab === t.id ? 'var(--fg-1)' : 'var(--fg-3)',
                fontSize: 9, fontFamily: 'var(--font-mono)', letterSpacing: '0.06em',
                textTransform: 'uppercase', transition: 'color 0.15s',
              }}>
                {React.cloneElement(Ico[t.icoKey] || Ico.sparkle, { size: 15 })}
                {t.label}
              </button>
            ))}
          </div>

          {timingTab === 'moon' && (
            <SearchSelect items={MOON_PHASES_NW} value={moonPhase} onChange={setMoonPhase} multi={false} placeholder="Any phase…" />
          )}
          {timingTab === 'season' && (
            <SearchSelect items={SEASONS_NW} value={season} onChange={setSeason} multi placeholder="Select seasons…" />
          )}
          {timingTab === 'time' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <SearchSelect items={TIMES_NW} value={tod} onChange={setTod} multi placeholder="Select times of day…" />
              <input value={timingCustom} onChange={e => setTimingCustom(e.target.value)} autoComplete="off"
                placeholder="Custom note (e.g. Mercury retrograde)…" style={{ ...field }} />
            </div>
          )}
          {timingTab === 'day' && (
            <SearchSelect items={DAYS_NW} value={dow} onChange={setDow} multi placeholder="Select days of the week…" />
          )}
        </div>
      </NWSection>

      {/* ── Duration ── */}
      <NWSection title="Duration (optional)">
        <div>
          <div style={{ color: 'var(--fg-2)', fontSize: 12, marginBottom: 10, lineHeight: 1.5 }}>
            How long does this spell take to work or need to be kept active?
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <input type="number" min="1" value={durVal} onChange={e => setDurVal(e.target.value)}
              placeholder="Amount" style={{ ...field, flex: 1 }} />
            <select value={durUnit} onChange={e => setDurUnit(e.target.value)} style={{ ...selectStyle, flex: 1 }}>
              {DURATION_UNITS.map(u => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>
        </div>
      </NWSection>

      {/* ── Supplies & Ingredients ── */}
      <NWSection title="Supplies & Ingredients">
        {ingredients.length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {ingredients.map(ing => (
              <div key={ing.id} style={{
                display: 'flex', alignItems: 'center', gap: 10,
                padding: '9px 12px', borderRadius: 'var(--r-xs)',
                background: 'var(--bg-page)', border: '1px solid var(--line-soft)',
              }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ color: 'var(--fg-1)', fontSize: 13, fontWeight: 600 }}>{ing.name}</div>
                  {(ing.amount || ing.note) && (
                    <div style={{ color: 'var(--fg-3)', fontSize: 11, marginTop: 2 }}>
                      {[ing.amount, ing.note].filter(Boolean).join(' · ')}
                    </div>
                  )}
                </div>
                <button onClick={() => setIngredients(ingredients.filter(x => x.id !== ing.id))} style={{
                  background: 'none', border: 0, cursor: 'pointer', color: 'var(--fg-3)', padding: 4,
                }}>{React.cloneElement(Ico.close, { size: 14 })}</button>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <input value={ingName} onChange={e => setIngName(e.target.value)} autoComplete="off"
              placeholder="Supply name…" style={{ ...field, flex: 2 }}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addIngredient(); } }} />
            <input value={ingAmt} onChange={e => setIngAmt(e.target.value)} autoComplete="off"
              placeholder="Amount" style={{ ...field, flex: 1 }} />
          </div>
          <input value={ingNote} onChange={e => setIngNote(e.target.value)} autoComplete="off"
            placeholder="Note (optional)" style={{ ...field }} />
          <Btn variant="secondary" size="sm" icon={Ico.plus} onClick={addIngredient}
            style={{ alignSelf: 'flex-start' }}>Add Supply</Btn>
        </div>
      </NWSection>

      {/* ── Spellwork ── */}
      <NWSection title="Spellwork">
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="oma-eyebrow" style={{ fontSize: 10 }}>Chant or Meditation</span>
          <textarea value={chant} onChange={e => setChant(e.target.value)}
            rows={4} autoComplete="off" placeholder="Words to speak or hold in mind…"
            style={{ ...field, resize: 'none', lineHeight: 1.55 }} />
        </label>
        <div>
          <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Deities</span>
          {deities.length > 0 && (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 8 }}>
              {deities.map(d => (
                <span key={d} style={{
                  padding: '5px 10px', borderRadius: 999,
                  background: 'var(--bg-page)', border: '1px solid var(--line-soft)',
                  color: 'var(--fg-2)', fontSize: 13,
                  display: 'flex', alignItems: 'center', gap: 6,
                }}>
                  {d}
                  <button onClick={() => setDeities(deities.filter(x => x !== d))} style={{
                    background: 'none', border: 0, cursor: 'pointer', color: 'var(--fg-3)', padding: 0, lineHeight: 1,
                  }}>×</button>
                </span>
              ))}
            </div>
          )}
          <div style={{ display: 'flex', gap: 8 }}>
            <input value={deityInput} onChange={e => setDeityInput(e.target.value)} autoComplete="off"
              placeholder="Add a deity…" style={{ ...field, flex: 1 }}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addDeity(); } }} />
            <Btn variant="secondary" size="sm" onClick={addDeity}>Add</Btn>
          </div>
        </div>
      </NWSection>

      {/* ── Tasks ── */}
      <NWSection title="Tasks">
        {tasks.length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {tasks.map((t, i) => (
              <div key={t.id} style={{
                display: 'flex', alignItems: 'center', gap: 8,
                padding: '9px 12px', borderRadius: 'var(--r-xs)',
                background: 'var(--bg-page)', border: '1px solid var(--line-soft)',
              }}>
                <span style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)', flexShrink: 0, width: 16 }}>{i + 1}.</span>
                {editingTaskId === t.id ? (
                  <>
                    <input
                      value={editingTaskText}
                      onChange={e => setEditingTaskText(e.target.value)}
                      autoComplete="off"
                      style={{ ...field, flex: 1, padding: '5px 8px', fontSize: 13 }}
                      onKeyDown={e => {
                        if (e.key === 'Enter') { e.preventDefault(); setTasks(tasks.map(x => x.id === t.id ? { ...x, text: editingTaskText.trim() || x.text } : x)); setEditingTaskId(null); }
                        if (e.key === 'Escape') { setEditingTaskId(null); }
                      }}
                    />
                    <button onClick={() => { setTasks(tasks.map(x => x.id === t.id ? { ...x, text: editingTaskText.trim() || x.text } : x)); setEditingTaskId(null); }} style={{
                      background: 'none', border: 0, cursor: 'pointer', color: 'var(--success)', padding: 4, flexShrink: 0,
                    }}>{React.cloneElement(Ico.check, { size: 14 })}</button>
                    <button onClick={() => setEditingTaskId(null)} style={{
                      background: 'none', border: 0, cursor: 'pointer', color: 'var(--fg-3)', padding: 4, flexShrink: 0,
                    }}>{React.cloneElement(Ico.close, { size: 14 })}</button>
                  </>
                ) : (
                  <>
                    <div style={{ flex: 1, color: 'var(--fg-1)', fontSize: 13, lineHeight: 1.4 }}>{t.text}</div>
                    <button onClick={() => { setEditingTaskId(t.id); setEditingTaskText(t.text); }} style={{
                      background: 'none', border: 0, cursor: 'pointer', color: 'var(--fg-3)', padding: 4, flexShrink: 0,
                    }}>{React.cloneElement(Ico.edit, { size: 13 })}</button>
                    <button onClick={() => { setTasks(tasks.filter(x => x.id !== t.id)); if (editingTaskId === t.id) setEditingTaskId(null); }} style={{
                      background: 'none', border: 0, cursor: 'pointer', color: 'var(--fg-3)', padding: 4, flexShrink: 0,
                    }}>{React.cloneElement(Ico.close, { size: 14 })}</button>
                  </>
                )}
              </div>
            ))}
          </div>
        )}
        <div style={{ display: 'flex', gap: 8 }}>
          <input value={taskText} onChange={e => setTaskText(e.target.value)} autoComplete="off"
            placeholder="Add a step or task…" style={{ ...field, flex: 1 }}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addTask(); } }} />
          <Btn variant="secondary" size="sm" onClick={addTask}>Add</Btn>
        </div>
      </NWSection>


    </div>
  );
}

window.NewWorking = NewWorking;

  </script>

  <!-- ── NewEntry.jsx ── -->
  <script type="text/babel">
// NewEntry.jsx — full journal entry form (JournalEntry)

const MONTHS_JE = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const ROMAN_JE  = n => {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r=''; for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];} return r;
};

const ENTRY_STATUSES = ['Pending', 'Ongoing', 'Completed'];

function JournalEntry({ editId, onClose, onSave, onDelete, workings, entries, submitRef }) {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const defaultDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const defaultTime = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const [title,       setTitle]       = React.useState('');
  const [date,        setDate]        = React.useState(defaultDate);
  const [time,        setTime]        = React.useState(defaultTime);
  const [status,      setStatus]      = React.useState('Pending');
  const [workingId,   setWorkingId]   = React.useState('');
  const [noteText,    setNoteText]    = React.useState('');
  const [notes,       setNotes]       = React.useState([]);
  const [result,      setResult]      = React.useState('');
  const [tasksDone,   setTasksDone]   = React.useState({});
  const [imgSrc,      setImgSrc]      = React.useState(null);
  const [spellError,  setSpellError]  = React.useState(false);
  const fileRef = React.useRef(null);

  React.useEffect(() => {
    if (editId && entries) {
      const e = entries.find(x => x.id === editId);
      if (e) {
        setTitle(e.title || '');
        setDate(e.date || defaultDate);
        setTime(e.time || defaultTime);
        setStatus(e.status || 'Pending');
        setWorkingId(e.workingId || '');
        setNotes(e.notes ? e.notes.map(n => ({...n})) : []);
        setResult(e.result || '');
        setTasksDone(e.tasksDone ? {...e.tasksDone} : {});
        setImgSrc(e.img || null);
        setNoteText('');
      }
    }
  }, []);

  const field = {
    background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
    borderRadius: 'var(--r-xs)', padding: '11px 14px',
    color: 'var(--fg-1)', fontFamily: 'var(--font-body)',
    fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box',
  };

  const linkedWorking = workingId ? (workings || []).find(w => w.id === workingId) : null;

  function addNote() {
    const text = noteText.trim();
    if (!text) return;
    setNotes(prev => [...prev, { id: Date.now().toString(), text, ts: new Date().toISOString() }]);
    setNoteText('');
  }

  function removeNote(id) { setNotes(prev => prev.filter(n => n.id !== id)); }

  function toggleTask(taskId) {
    setTasksDone(prev => ({ ...prev, [taskId]: !prev[taskId] }));
  }

  function onFileChange(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => setImgSrc(ev.target.result);
    reader.readAsDataURL(f);
    e.target.value = '';
  }

  function handleSave() {
    if (!workingId) { setSpellError(true); return; }
    setSpellError(false);
    const allNotes = [...notes];
    if (noteText.trim()) {
      allNotes.push({ id: Date.now().toString(), text: noteText.trim(), ts: new Date().toISOString() });
    }
    const d = new Date(`${date}T${time}`);
    onSave({
      id: editId || Date.now().toString(),
      workingId: workingId,
      workingName: linkedWorking ? linkedWorking.name.toUpperCase() : null,
      title: title.trim() || (linkedWorking?.name || 'Journal Entry'),
      date,
      romanDay: ROMAN_JE(d.getDate()),
      month: MONTHS_JE[d.getMonth()],
      time,
      kind: 'cast',
      status,
      notes: allNotes,
      result: result.trim(),
      tasksDone: { ...tasksDone },
      img: imgSrc,
    });
    setNoteText('');
  }

  if (submitRef) submitRef.current = handleSave;

  const fmtTs = iso => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
      d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };

  const phaseLabel = p => p ? p.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '';

  return (
    <div style={{ padding: '14px 18px 22px', display: 'flex', flexDirection: 'column', gap: 16 }}>

      {/* ── Spell selector — required, first ── */}
      <div>
        <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>
          Spell <span style={{ color: 'var(--ember)', fontStyle: 'normal' }}>*</span>
        </span>
        <SearchSelect
          items={(workings || []).map(w => ({ key: w.id, label: w.name }))}
          value={workingId}
          onChange={id => { setWorkingId(id); setTasksDone({}); setSpellError(false); if (!title) setTitle(''); }}
          multi={false}
          placeholder="Select a spell to begin…"
        />
        {spellError && (
          <div style={{ color: 'var(--ember)', fontSize: 12, marginTop: 6 }}>
            A spell is required before saving.
          </div>
        )}
        {!workingId && !spellError && (
          <div style={{ color: 'var(--fg-3)', fontSize: 12, marginTop: 6 }}>
            Choose a spell to unlock the rest of this entry.
          </div>
        )}
      </div>

      {/* ── Spell details — visible once spell is selected ── */}
      {linkedWorking && (
        <div style={{
          borderRadius: 'var(--r-lg)', overflow: 'hidden',
          border: '1px solid var(--line-soft)', background: 'var(--bg-surface)',
        }}>
          {/* Spell header */}
          <div style={{
            padding: '12px 14px',
            background: linkedWorking.color + '18',
            borderBottom: '1px solid var(--line-soft)',
            display: 'flex', alignItems: 'center', gap: 10,
          }}>
            <div style={{
              width: 32, height: 32, borderRadius: 'var(--r-sm)',
              background: linkedWorking.color + '30', color: linkedWorking.color,
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
            }}>
              {React.cloneElement(linkedWorking.icon, { size: 16 })}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ color: 'var(--fg-1)', fontSize: 13, fontWeight: 600 }}>{linkedWorking.name}</div>
              {linkedWorking.summary && (
                <div style={{ color: 'var(--fg-3)', fontSize: 11, marginTop: 2, lineHeight: 1.4 }}>{linkedWorking.summary}</div>
              )}
            </div>
          </div>

          {/* Timing */}
          {(linkedWorking.moonPhase || (linkedWorking.season||[]).length > 0 || (linkedWorking.tod||[]).length > 0 || (linkedWorking.dow||[]).length > 0) && (
            <div style={{
              padding: '8px 14px',
              borderBottom: '1px solid var(--line-soft)',
              display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center',
            }}>
              {linkedWorking.moonPhase && (
                <span style={{ display: 'flex', alignItems: 'center', gap: 4, color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)' }}>
                  <MoonGlyph phase={linkedWorking.moonPhase} size={12} color="var(--fg-3)" />
                  {phaseLabel(linkedWorking.moonPhase).toUpperCase()}
                </span>
              )}
              {(linkedWorking.tod||[]).map(t => (
                <span key={t} style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)' }}>{t.toUpperCase()}</span>
              ))}
              {(linkedWorking.dow||[]).map(d => (
                <span key={d} style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)' }}>{d.toUpperCase()}</span>
              ))}
              {(linkedWorking.season||[]).map(s => (
                <span key={s} style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)' }}>{s.toUpperCase()}</span>
              ))}
            </div>
          )}

          {/* Ingredients */}
          {linkedWorking.ingredients && linkedWorking.ingredients.length > 0 && (
            <div style={{ borderBottom: (linkedWorking.tasks && linkedWorking.tasks.length > 0) ? '1px solid var(--line-soft)' : 'none' }}>
              <div style={{ padding: '8px 14px 4px', color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>
                INGREDIENTS
              </div>
              {linkedWorking.ingredients.map((ing, i) => (
                <div key={ing.name} style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  padding: '8px 14px',
                  borderTop: i === 0 ? 'none' : '1px solid var(--line-soft)',
                }}>
                  <div style={{ flex: 1 }}>
                    <span style={{ color: 'var(--fg-1)', fontSize: 13 }}>{ing.name}</span>
                    {ing.note && <span style={{ color: 'var(--fg-3)', fontSize: 11, marginLeft: 6 }}>{ing.note}</span>}
                  </div>
                  <span style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)', flexShrink: 0 }}>{ing.amount}</span>
                </div>
              ))}
            </div>
          )}

          {/* Tasks — checkable */}
          {linkedWorking.tasks && linkedWorking.tasks.length > 0 && (
            <div>
              <div style={{ padding: '8px 14px 4px', color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>
                TASKS
              </div>
              {linkedWorking.tasks.map((t, i) => (
                <label key={t.id} style={{
                  display: 'flex', alignItems: 'center', gap: 12,
                  padding: '9px 14px',
                  borderTop: i === 0 ? 'none' : '1px solid var(--line-soft)',
                  cursor: 'pointer',
                }}>
                  <div style={{
                    width: 18, height: 18, borderRadius: 4, flexShrink: 0,
                    border: '1.5px solid ' + (tasksDone[t.id] ? 'var(--success)' : 'var(--line-medium)'),
                    background: tasksDone[t.id] ? 'var(--success)' : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    transition: 'background 150ms, border-color 150ms',
                  }}>
                    {tasksDone[t.id] && <span style={{ color: 'var(--bg-page)', fontSize: 11, fontWeight: 700 }}>✓</span>}
                  </div>
                  <input type="checkbox" checked={!!tasksDone[t.id]} onChange={() => toggleTask(t.id)} style={{ display: 'none' }} />
                  <span style={{
                    color: tasksDone[t.id] ? 'var(--fg-3)' : 'var(--fg-1)',
                    fontSize: 13, lineHeight: 1.4,
                    textDecoration: tasksDone[t.id] ? 'line-through' : 'none',
                  }}>{t.text}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ── Rest of form — only shown when spell is selected ── */}
      {workingId && (
        <>
          {/* Status */}
          <div>
            <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Status</span>
            <div style={{ display: 'flex', gap: 6 }}>
              {ENTRY_STATUSES.map(s => (
                <button key={s} onClick={() => setStatus(s)} style={{
                  padding: '7px 12px', borderRadius: 999, cursor: 'pointer',
                  background: status === s ? 'var(--chrome-active-bg)' : 'var(--bg-page)',
                  border: '1px solid ' + (status === s ? 'var(--chrome-active-line)' : 'var(--line-soft)'),
                  color: status === s ? 'var(--chrome-active-fg)' : 'var(--fg-2)',
                  fontFamily: 'var(--font-body)', fontSize: 13,
                }}>{s}</button>
              ))}
            </div>
          </div>

          {/* Date + Time */}
          <div style={{ display: 'flex', gap: 10 }}>
            <label style={{ display: 'flex', flexDirection: 'column', gap: 6, flex: 1 }}>
              <span className="oma-eyebrow" style={{ fontSize: 10 }}>Date</span>
              <input type="date" value={date} onChange={e => setDate(e.target.value)}
                style={{ ...field, colorScheme: 'dark' }} />
            </label>
            <label style={{ display: 'flex', flexDirection: 'column', gap: 6, flex: 1 }}>
              <span className="oma-eyebrow" style={{ fontSize: 10 }}>Time</span>
              <input type="time" value={time} onChange={e => setTime(e.target.value)}
                style={{ ...field, colorScheme: 'dark' }} />
            </label>
          </div>

          {/* Title */}
          <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <span className="oma-eyebrow" style={{ fontSize: 10 }}>Title</span>
            <input value={title} onChange={e => setTitle(e.target.value)} autoComplete="off"
              placeholder={linkedWorking ? linkedWorking.name : 'Name this entry'}
              style={{ ...field, fontFamily: '"Ohno Blazeface 18", var(--font-display)', fontStyle: 'normal',
                fontWeight: 400, textTransform: 'uppercase', letterSpacing: '0.02em', fontSize: 18 }} />
          </label>

          {/* Notes */}
          <div>
            <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Notes</span>
            {notes.length > 0 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
                {notes.map(n => (
                  <div key={n.id} style={{
                    padding: '10px 12px', borderRadius: 'var(--r-xs)',
                    background: 'var(--bg-page)', border: '1px solid var(--line-soft)',
                  }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                      <div style={{ flex: 1, color: 'var(--fg-1)', fontSize: 13, lineHeight: 1.55 }}>{n.text}</div>
                      <button onClick={() => removeNote(n.id)} style={{
                        background: 'none', border: 0, cursor: 'pointer', color: 'var(--fg-3)', padding: '2px 4px', flexShrink: 0,
                      }}>{React.cloneElement(Ico.close, { size: 13 })}</button>
                    </div>
                    <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', marginTop: 5 }}>
                      {fmtTs(n.ts)}
                    </div>
                  </div>
                ))}
              </div>
            )}
            <textarea value={noteText} onChange={e => setNoteText(e.target.value)}
              rows={5} autoComplete="off"
              placeholder={notes.length === 0 ? 'Write what happened…' : 'Add another note…'}
              style={{ ...field, resize: 'none', lineHeight: 1.55 }} />
            {noteText.trim() && (
              <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 6 }}>
                <Btn variant="secondary" size="sm" onClick={addNote}>Add Note</Btn>
              </div>
            )}
          </div>

          {/* Result */}
          {status === 'Completed' && (
            <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <span className="oma-eyebrow" style={{ fontSize: 10 }}>Result</span>
              <textarea value={result} onChange={e => setResult(e.target.value)}
                rows={3} autoComplete="off" placeholder="What came of this spell…"
                style={{ ...field, resize: 'none', lineHeight: 1.55 }} />
            </label>
          )}

          {/* Photo */}
          <div>
            <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Photo (optional)</span>
            {imgSrc ? (
              <div style={{ position: 'relative' }}>
                <img src={imgSrc} alt="" style={{
                  width: '100%', maxHeight: 180, objectFit: 'cover',
                  borderRadius: 'var(--r-md)', display: 'block', border: '1px solid var(--line-soft)',
                }} />
                <button onClick={() => setImgSrc(null)} style={{
                  position: 'absolute', top: 6, right: 6, width: 24, height: 24, borderRadius: 50,
                  background: 'rgba(0,0,0,0.55)', border: 0, cursor: 'pointer', color: 'var(--bone)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>{React.cloneElement(Ico.close, { size: 12 })}</button>
              </div>
            ) : (
              <>
                <input ref={fileRef} type="file" accept="image/*" onChange={onFileChange} style={{ display: 'none' }} />
                <Btn variant="secondary" size="sm" icon={Ico.photo}
                  onClick={() => fileRef.current && fileRef.current.click()}>
                  Add Photo
                </Btn>
              </>
            )}
          </div>

          {/* Delete (edit mode only) */}
          {editId && onDelete && (
            <div style={{ paddingTop: 4 }}>
              <Btn variant="ghost" size="sm" fullWidth onClick={() => {
                if (window.confirm('Delete this entry? This cannot be undone.')) onDelete(editId);
              }} style={{ color: 'var(--crimson-300)', fontSize: 12 }}>
                Delete this entry
              </Btn>
            </div>
          )}
        </>
      )}

    </div>
  );
}

window.JournalEntry = JournalEntry;
window.NewEntry = JournalEntry;

// ── EntryDetail — read-only single-entry view ─────────────────────────────────
function EntryDetail({ entryId, entries, workings }) {
  const e = entries.find(x => x.id === entryId);
  if (!e) return null;

  const statusTone = { Pending: 'amber', Ongoing: 'pending', Completed: 'sealed' };
  const linkedWorking = (workings || []).find(w => w.id === e.workingId);

  const fmtTs = iso => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' +
      d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column' }}>

      {/* Hero band */}
      <div style={{
        padding: '18px 18px 22px',
        borderBottom: '1px solid var(--line-soft)',
      }}>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 12, flexWrap: 'wrap' }}>
          {e.status && (
            <Badge tone={statusTone[e.status] || 'pending'} dot={false}>{e.status}</Badge>
          )}
          <span style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)' }}>
            {e.romanDay} {e.month} · {e.time}
          </span>
        </div>
        <div style={{
          fontFamily: '"Ohno Blazeface 36", var(--font-display)', fontStyle: 'normal',
          fontWeight: 400, textTransform: 'uppercase', letterSpacing: '0.02em',
          fontSize: 28, lineHeight: 1.05, color: 'var(--fg-1)',
        }}>{e.title}</div>
        {e.workingName && (
          <div style={{
            color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)',
            marginTop: 8, letterSpacing: '0.04em',
          }}>— {e.workingName}</div>
        )}
      </div>

      {/* Body */}
      <div style={{ padding: '18px 18px 28px', display: 'flex', flexDirection: 'column', gap: 20 }}>

        {/* Photo */}
        {e.img && (
          <img src={e.img} alt="" style={{
            width: '100%', maxHeight: 220, objectFit: 'cover',
            borderRadius: 'var(--r-md)', border: '1px solid var(--line-soft)', display: 'block',
          }} />
        )}

        {/* Legacy body fallback for old-format entries */}
        {(!e.notes || e.notes.length === 0) && e.body && (
          <div style={{
            padding: '14px 16px', borderRadius: 'var(--r-md)',
            background: 'var(--bg-surface)', border: '1px solid var(--line-soft)',
          }}>
            <div style={{ color: 'var(--fg-1)', fontSize: 14, lineHeight: 1.65, whiteSpace: 'pre-wrap' }}>{e.body}</div>
          </div>
        )}

        {/* Notes */}
        {e.notes && e.notes.length > 0 && (
          <div>
            <div className="oma-eyebrow" style={{ marginBottom: 12 }}>
              {e.notes.length === 1 ? 'Note' : `${e.notes.length} Notes`}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {e.notes.map(n => (
                <div key={n.id} style={{
                  padding: '14px 16px', borderRadius: 'var(--r-md)',
                  background: 'var(--bg-surface)', border: '1px solid var(--line-soft)',
                }}>
                  <div style={{
                    color: 'var(--fg-1)', fontSize: 14, lineHeight: 1.65,
                    whiteSpace: 'pre-wrap',
                  }}>{n.text}</div>
                  {n.ts && (
                    <div style={{
                      color: 'var(--fg-3)', fontSize: 10,
                      fontFamily: 'var(--font-mono)', marginTop: 10,
                    }}>{fmtTs(n.ts)}</div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Tasks */}
        {linkedWorking && linkedWorking.tasks && linkedWorking.tasks.length > 0 && (
          <div>
            <div className="oma-eyebrow" style={{ marginBottom: 10 }}>Tasks</div>
            <div style={{
              borderRadius: 'var(--r-md)', border: '1px solid var(--line-soft)',
              overflow: 'hidden', background: 'var(--bg-surface)',
            }}>
              {linkedWorking.tasks.map((t, i) => {
                const done = !!(e.tasksDone && e.tasksDone[t.id]);
                return (
                  <div key={t.id} style={{
                    display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px',
                    borderTop: i === 0 ? 'none' : '1px solid var(--line-soft)',
                  }}>
                    <div style={{
                      width: 18, height: 18, borderRadius: 4, flexShrink: 0,
                      border: '1.5px solid ' + (done ? 'var(--success)' : 'var(--line-medium)'),
                      background: done ? 'var(--success)' : 'transparent',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      {done && <span style={{ color: 'var(--bg-page)', fontSize: 11, fontWeight: 700 }}>✓</span>}
                    </div>
                    <span style={{
                      color: done ? 'var(--fg-3)' : 'var(--fg-1)', fontSize: 13,
                      textDecoration: done ? 'line-through' : 'none',
                    }}>{t.text}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Result */}
        {e.result && (
          <div style={{
            padding: '14px 16px', borderRadius: 'var(--r-md)',
            background: 'rgba(0,194,138,0.08)', border: '1px solid rgba(0,194,138,0.20)',
          }}>
            <div className="oma-eyebrow" style={{ color: 'var(--success)', marginBottom: 8 }}>Result</div>
            <div style={{ color: 'var(--fg-1)', fontSize: 14, lineHeight: 1.65 }}>{e.result}</div>
          </div>
        )}

      </div>
    </div>
  );
}

  <script type="text/babel">
// Profile.jsx — profile, preferences, and settings

function Profile({ profile, onUpdateProfile, workings, entries, cabinet, theme, setTheme, onLogOut }) {
  const [editingName, setEditingName] = React.useState(false);
  const [nameVal,     setNameVal]     = React.useState(profile.name || '');
  const [editingNote, setEditingNote] = React.useState(false);
  const [noteVal,     setNoteVal]     = React.useState(profile.practiceNote || '');
  const [newDeity,    setNewDeity]    = React.useState('');

  function saveName() {
    onUpdateProfile({ ...profile, name: nameVal.trim() || 'Witch' });
    setEditingName(false);
  }
  function saveNote() {
    onUpdateProfile({ ...profile, practiceNote: noteVal.trim() });
    setEditingNote(false);
  }
  function addDeity() {
    const d = newDeity.trim();
    if (!d) return;
    const existing = profile.deities || [];
    if (existing.includes(d)) { setNewDeity(''); return; }
    onUpdateProfile({ ...profile, deities: [...existing, d] });
    setNewDeity('');
  }
  function removeDeity(name) {
    onUpdateProfile({ ...profile, deities: (profile.deities || []).filter(d => d !== name) });
  }

  const field = {
    background: 'var(--bg-page)',
    border: '1px solid var(--line-medium)',
    borderRadius: 'var(--r-xs)',
    padding: '11px 14px',
    color: 'var(--fg-1)',
    fontFamily: 'var(--font-body)',
    fontSize: 14,
    outline: 'none',
    width: '100%',
    boxSizing: 'border-box',
  };

  const row = (label, value, onEdit) => (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '13px 14px',
      borderBottom: '1px solid var(--line-soft)',
    }}>
      <div>
        <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>
          {label}
        </div>
        <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600, marginTop: 3 }}>{value}</div>
      </div>
      {onEdit && (
        <button onClick={onEdit} style={{
          background: 'none', border: 0, cursor: 'pointer',
          color: 'var(--fg-3)', padding: '4px',
          display: 'flex', alignItems: 'center',
        }}>{React.cloneElement(Ico.edit, { size: 15 })}</button>
      )}
    </div>
  );

  const deities = profile.deities || [];

  return (
    <div style={{ padding: '14px 16px 32px', display: 'flex', flexDirection: 'column', gap: 20 }}>

      {/* ── Profile ── */}
      <div>
        <div className="oma-eyebrow" style={{ marginBottom: 10 }}>Your Practice</div>
        <div style={{ borderRadius: 'var(--r-lg)', border: '1px solid var(--line-soft)', overflow: 'hidden', background: 'var(--bg-surface)' }}>

          {/* Name */}
          {editingName ? (
            <div style={{ padding: '13px 14px', borderBottom: '1px solid var(--line-soft)' }}>
              <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em', marginBottom: 8 }}>
                YOUR NAME
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <input value={nameVal} onChange={e => setNameVal(e.target.value)}
                  autoComplete="off" style={{ ...field, flex: 1 }}
                  onKeyDown={e => { if (e.key === 'Enter') saveName(); if (e.key === 'Escape') setEditingName(false); }} />
                <Btn variant="primary" size="sm" onClick={saveName}>Save</Btn>
                <Btn variant="ghost" size="sm" onClick={() => setEditingName(false)}>Cancel</Btn>
              </div>
            </div>
          ) : (
            row('YOUR NAME', profile.name || 'Witch', () => { setNameVal(profile.name || ''); setEditingName(true); })
          )}

          {/* Practice note */}
          {editingNote ? (
            <div style={{ padding: '13px 14px', borderBottom: '1px solid var(--line-soft)' }}>
              <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em', marginBottom: 8 }}>
                PRACTICE NOTE
              </div>
              <textarea value={noteVal} onChange={e => setNoteVal(e.target.value)}
                rows={4} autoComplete="off" placeholder="A few words about your practice…"
                style={{ ...field, resize: 'none', lineHeight: 1.55 }} />
              <div style={{ display: 'flex', gap: 8, marginTop: 8, justifyContent: 'flex-end' }}>
                <Btn variant="ghost" size="sm" onClick={() => setEditingNote(false)}>Cancel</Btn>
                <Btn variant="primary" size="sm" onClick={saveNote}>Save</Btn>
              </div>
            </div>
          ) : (
            row(
              'PRACTICE NOTE',
              profile.practiceNote || <span style={{ color: 'var(--fg-3)', fontStyle: 'italic', fontWeight: 400 }}>None yet</span>,
              () => { setNoteVal(profile.practiceNote || ''); setEditingNote(true); }
            )
          )}

          {/* Spell count */}
          <div style={{ padding: '13px 14px', borderBottom: 0 }}>
            <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>
              SPELLS IN THE GRIMOIRE
            </div>
            <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600, marginTop: 3 }}>
              {(workings || []).length} {(workings || []).length === 1 ? 'spell' : 'spells'}
            </div>
          </div>
        </div>
      </div>

      {/* ── Practice Stats ── */}
      <div>
        <div className="oma-eyebrow" style={{ marginBottom: 10 }}>Practice Stats</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
          {[
            { label: 'SPELLS',   value: (workings || []).length, color: 'var(--indigo-300)' },
            { label: 'SUPPLIES', value: (cabinet || []).length,  color: 'var(--moss)' },
            { label: 'ENTRIES',  value: (entries || []).length,  color: 'var(--fg-3)' },
          ].map(stat => (
            <div key={stat.label} style={{
              padding: '14px 8px', borderRadius: 'var(--r-lg)',
              border: '1px solid var(--line-soft)', background: 'var(--bg-surface)',
              textAlign: 'center',
            }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: stat.color, fontFamily: 'var(--font-mono)' }}>
                {stat.value}
              </div>
              <div style={{ color: 'var(--fg-3)', fontSize: 9, fontFamily: 'var(--font-mono)', letterSpacing: '0.1em', marginTop: 4 }}>
                {stat.label}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Deities ── */}
      <div>
        <div className="oma-eyebrow" style={{ marginBottom: 10 }}>Deities</div>
        <div style={{ borderRadius: 'var(--r-lg)', border: '1px solid var(--line-soft)', overflow: 'hidden', background: 'var(--bg-surface)' }}>
          {deities.length > 0 ? (
            <div style={{ padding: '10px 14px 6px', display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {deities.map(d => (
                <div key={d} style={{
                  display: 'flex', alignItems: 'center', gap: 6,
                  padding: '6px 10px 6px 12px', borderRadius: 999,
                  background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
                  color: 'var(--fg-2)', fontSize: 13,
                }}>
                  <span>{d}</span>
                  <button onClick={() => removeDeity(d)} style={{
                    background: 'none', border: 0, cursor: 'pointer', padding: 0,
                    color: 'var(--fg-3)', display: 'flex', alignItems: 'center',
                    lineHeight: 1,
                  }} title={`Remove ${d}`}>
                    ✕
                  </button>
                </div>
              ))}
            </div>
          ) : (
            <div style={{ padding: '13px 14px 6px', color: 'var(--fg-3)', fontSize: 13, fontStyle: 'italic' }}>
              No deities added yet.
            </div>
          )}
          {/* Add deity input */}
          <div style={{ padding: '10px 14px 12px', display: 'flex', gap: 8 }}>
            <input
              value={newDeity}
              onChange={e => setNewDeity(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addDeity(); }}
              placeholder="Add a deity…"
              autoComplete="off"
              style={{
                flex: 1, background: 'var(--bg-page)',
                border: '1px solid var(--line-soft)',
                borderRadius: 'var(--r-xs)', padding: '8px 12px',
                color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 13,
                outline: 'none',
              }}
            />
            <Btn variant="secondary" size="sm" onClick={addDeity}>Add</Btn>
          </div>
        </div>
      </div>

      {/* ── Preferences ── */}
      <div>
        <div className="oma-eyebrow" style={{ marginBottom: 10 }}>Preferences</div>
        <div style={{ borderRadius: 'var(--r-lg)', border: '1px solid var(--line-soft)', overflow: 'hidden', background: 'var(--bg-surface)' }}>
          {/* Theme */}
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '13px 14px',
          }}>
            <div>
              <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>APPEARANCE</div>
              <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600, marginTop: 3 }}>
                {theme === 'dark' ? 'Dark' : 'Light'}
              </div>
            </div>
            <ThemeToggle theme={theme} onChange={setTheme} />
          </div>
        </div>
      </div>

      {/* ── Reset demo data ── */}
      <div style={{ marginBottom: 8 }}>
        <Btn variant="secondary" size="lg" fullWidth onClick={() => {
          if (window.confirm('Reset all data to demo defaults? This cannot be undone.')) {
            ['oma_workings','oma_entries','oma_cabinet','oma_profile'].forEach(k => localStorage.removeItem(k));
            window.location.reload();
          }
        }}>
          Reset to Demo Data
        </Btn>
      </div>

      {/* ── Sign out ── */}
      <Btn variant="secondary" size="lg" fullWidth onClick={onLogOut}>
        Log Out
      </Btn>

    </div>
  );
}

window.Profile = Profile;

  </script>

function loadLS(key, fallback) {
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }
  catch { return fallback; }
}
function hydrateWorking(w) {
  return { ...w, icon: ICO_MAP[w.iconKey] || Ico.sparkle };
}
// Migrate old entry format (body string) to new format (notes array)
function migrateEntry(e) {
  if (!e.notes || !Array.isArray(e.notes) || e.notes.length === 0) {
    const text = e.body || '';
    return {
      ...e,
      notes: text ? [{ id: 'migrated', text, ts: e.date ? (e.date + 'T' + (e.time || '12:00') + ':00') : new Date().toISOString() }] : [],
    };
  }
  return e;
}

// ── Magical events ────────────────────────────────────────────────────────────
function getMagicalEvents(date) {
  const events = [];
  const m = date.getMonth() + 1, day = date.getDate(), yr = date.getFullYear();
  const known = new Date('2000-01-06T18:14:00Z');
  const synodic = 29.530588853;
  const diff = (date - known) / (1000 * 60 * 60 * 24);
  const phase = ((diff % synodic) + synodic) % synodic;
  const tol = 1.2;
  if (phase < tol || phase > synodic - tol) events.push({ name: 'New Moon', glyph: 'new' });
  else if (Math.abs(phase - 7.38) < tol)  events.push({ name: 'First Quarter Moon', glyph: 'first-quarter' });
  else if (Math.abs(phase - 14.77) < tol) events.push({ name: 'Full Moon', glyph: 'full' });
  else if (Math.abs(phase - 22.15) < tol) events.push({ name: 'Last Quarter Moon', glyph: 'last-quarter' });
  const sabbats = [
    {m:2,d:1,name:'Imbolc'},{m:2,d:2,name:'Imbolc'},
    {m:3,d:19,name:'Ostara'},{m:3,d:20,name:'Ostara'},{m:3,d:21,name:'Ostara'},
    {m:5,d:1,name:'Beltane'},
    {m:6,d:20,name:'Litha'},{m:6,d:21,name:'Litha'},{m:6,d:22,name:'Litha'},
    {m:8,d:1,name:'Lughnasadh'},{m:8,d:2,name:'Lughnasadh'},
    {m:9,d:21,name:'Mabon'},{m:9,d:22,name:'Mabon'},{m:9,d:23,name:'Mabon'},
    {m:10,d:31,name:'Samhain'},{m:11,d:1,name:'Samhain'},
    {m:12,d:20,name:'Yule'},{m:12,d:21,name:'Yule'},{m:12,d:22,name:'Yule'},
  ];
  sabbats.forEach(s => { if (s.m === m && s.d === day) events.push({ name: s.name, glyph: null }); });
  const retro = [
    ['2025-04-07','2025-04-30'],['2025-08-06','2025-08-28'],['2025-11-25','2025-12-15'],
    ['2026-03-15','2026-04-07'],['2026-07-18','2026-08-11'],['2026-11-06','2026-11-28'],
    ['2027-02-26','2027-03-20'],['2027-06-29','2027-07-23'],['2027-10-19','2027-11-10'],
  ];
  const ds = `${yr}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const today = new Date(yr, m - 1, day);
  if (retro.some(([s, e]) => today >= new Date(s) && today <= new Date(e)))
    events.push({ name: 'Mercury Retrograde ☿', glyph: null });
  const eclipses = [
    {date:'2026-02-17',name:'Annular Solar Eclipse'},{date:'2026-03-03',name:'Total Lunar Eclipse'},
    {date:'2026-08-12',name:'Total Solar Eclipse'},{date:'2026-09-02',name:'Partial Lunar Eclipse'},
    {date:'2027-02-06',name:'Annular Solar Eclipse'},{date:'2027-07-22',name:'Total Solar Eclipse'},
    {date:'2027-08-06',name:'Total Lunar Eclipse'},
  ];
  eclipses.forEach(e => { if (e.date === ds) events.push({ name: e.name, glyph: null }); });
  return events;
}
