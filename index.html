          <div style={{ padding: '10px 14px 12px', display: 'flex', gap: 8 }}>
            <input
              value={newDeity}
              onChange={e => setNewDeity(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addDeity(); }}
              placeholder="Add a deity…"
              autoComplete="off"
              style={{
                flex: 1, background: 'var(--bg-page)',
                border: '1px solid var(--line-soft)',
                borderRadius: 'var(--r-xs)', padding: '8px 12px',
                color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 13,
                outline: 'none',
              }}
            />
            <Btn variant="secondary" size="sm" onClick={addDeity}>Add</Btn>
          </div>
        </div>
      </div>

      {/* ── Preferences ── */}
      <div>
        <div className="oma-eyebrow" style={{ marginBottom: 10 }}>Preferences</div>
        <div style={{ borderRadius: 'var(--r-lg)', border: '1px solid var(--line-soft)', overflow: 'hidden', background: 'var(--bg-surface)' }}>
          {/* Theme */}
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '13px 14px',
            borderBottom: '1px solid var(--line-soft)',
          }}>
            <div>
              <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>APPEARANCE</div>
              <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600, marginTop: 3 }}>
                {theme === 'dark' ? 'Dark' : 'Light'}
              </div>
            </div>
            <ThemeToggle theme={theme} onChange={setTheme} />
          </div>
        </div>
      </div>

      {/* ── Privacy ── */}
      <div>
        <div className="oma-eyebrow" style={{ marginBottom: 10 }}>Privacy</div>
        <div style={{ borderRadius: 'var(--r-lg)', border: '1px solid var(--line-soft)', overflow: 'hidden', background: 'var(--bg-surface)' }}>
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '13px 14px',
            borderBottom: '1px solid var(--line-soft)',
          }}>
            <div style={{ flex: 1, paddingRight: 12 }}>
              <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>LOCK ON BACKGROUND</div>
              <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600, marginTop: 3 }}>Require login on re-entry</div>
              <div style={{ color: 'var(--fg-3)', fontSize: 12, marginTop: 4, lineHeight: 1.45 }}>
                Protects your spells and journal entries from prying eyes. When enabled, leaving the app requires login before re-entry is possible.
              </div>
            </div>
            {/* Toggle */}
            <button
              onClick={() => setPrivacyLock(p => !p)}
              aria-pressed={privacyLock}
              style={{
                flexShrink: 0,
                width: 44, height: 26,
                borderRadius: 13,
                background: privacyLock ? 'var(--amber)' : 'var(--line-medium)',
                border: 'none',
                cursor: 'pointer',
                position: 'relative',
                transition: 'background 0.2s',
                padding: 0,
              }}
            >
              <span style={{
                position: 'absolute',
                top: 3, left: privacyLock ? 21 : 3,
                width: 20, height: 20,
                borderRadius: '50%',
                background: '#fff',
                transition: 'left 0.2s',
                boxShadow: '0 1px 3px rgba(0,0,0,0.25)',
              }} />
            </button>
          </div>

          {/* iCloud Backup */}
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '13px 14px',
            borderBottom: '1px solid var(--line-soft)',
          }}>
            <div style={{ flex: 1, paddingRight: 12 }}>
              <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>ICLOUD BACKUP</div>
              <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600, marginTop: 3 }}>Sync to iCloud</div>
              <div style={{ color: 'var(--fg-3)', fontSize: 12, marginTop: 4, lineHeight: 1.45 }}>
                {iCloudSync
                  ? 'Your data is backed up to your personal iCloud account and will be restored if you change iPhones. Your data is never shared with us.'
                  : 'Your data lives only on this iPhone. Keeping iCloud off gives you maximum privacy, but your data cannot be recovered if you switch devices.'}
              </div>
            </div>
            {/* Toggle */}
            <button
              onClick={() => setICloudSync(p => !p)}
              aria-pressed={iCloudSync}
              style={{
                flexShrink: 0,
                width: 44, height: 26,
                borderRadius: 13,
                background: iCloudSync ? 'var(--amber)' : 'var(--line-medium)',
                border: 'none',
                cursor: 'pointer',
                position: 'relative',
                transition: 'background 0.2s',
                padding: 0,
              }}
            >
              <span style={{
                position: 'absolute',
                top: 3, left: iCloudSync ? 21 : 3,
                width: 20, height: 20,
                borderRadius: '50%',
                background: '#fff',
                transition: 'left 0.2s',
                boxShadow: '0 1px 3px rgba(0,0,0,0.25)',
              }} />
            </button>
          </div>

          {/* Change Password */}
          <div style={{ borderTop: 0 }}>
            <button onClick={() => { setChangePwOpen(o => !o); setPwError(''); setPwSuccess(false); }} style={{
              width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '13px 14px', background: 'none', border: 0, cursor: 'pointer', textAlign: 'left',
            }}>
              <div>
                <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>PASSWORD</div>
                <div style={{ color: 'var(--fg-1)', fontSize: 14, fontWeight: 600, marginTop: 3 }}>Change Password</div>
              </div>
              <span style={{ color: 'var(--fg-3)', transform: changePwOpen ? 'rotate(90deg)' : 'rotate(0)', transition: 'transform 0.2s', display: 'flex' }}>
                {React.cloneElement(Ico.chevron, { size: 16 })}
              </span>
            </button>
            {changePwOpen && (
              <div style={{ padding: '0 14px 14px', display: 'flex', flexDirection: 'column', gap: 10 }}>
                {['Current Password', 'New Password', 'Confirm New Password'].map((label, i) => {
                  const vals = [pwCurrent, pwNew, pwConfirm];
                  const setters = [setPwCurrent, setPwNew, setPwConfirm];
                  return (
                    <div key={label}>
                      <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)', letterSpacing: '0.08em', marginBottom: 5 }}>
                        {label.toUpperCase()}
                      </div>
                      <input
                        type="password" value={vals[i]} onChange={e => { setters[i](e.target.value); setPwError(''); setPwSuccess(false); }}
                        placeholder="••••••••"
                        style={{
                          width: '100%', boxSizing: 'border-box',
                          background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
                          borderRadius: 'var(--r-xs)', padding: '10px 12px',
                          color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 14, outline: 'none',
                        }}
                      />
                    </div>
                  );
                })}
                {pwError && <div style={{ color: 'var(--crimson-300)', fontSize: 12 }}>{pwError}</div>}
                {pwSuccess && <div style={{ color: 'var(--moss)', fontSize: 12 }}>Password updated successfully.</div>}
                <Btn variant="primary" size="sm" onClick={handleChangePw}>Update Password</Btn>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* ── Reset demo data ── */}
      <div style={{ marginBottom: 8 }}>
        <Btn variant="secondary" size="lg" fullWidth onClick={() => {
          window.showConfirm('Reset all data to demo defaults? This cannot be undone.', () => {
            ['oma_workings','oma_entries','oma_cabinet','oma_profile'].forEach(k => localStorage.removeItem(k));
            window.location.reload();
          }, 'Reset');
        }}>
          Reset to Demo Data
        </Btn>
      </div>

      {/* ── Sign out ── */}
      <Btn variant="secondary" size="lg" fullWidth onClick={onLogOut}>
        Log Out
      </Btn>

    </div>
  );
}

window.Profile = Profile;

  </script>

function Splash({ onDone }) {
  const [phase, setPhase] = React.useState('enter'); // enter | idle | exit

  // Auto-advance after 3.2s; tap also advances
  React.useEffect(() => {
    const t = setTimeout(() => setPhase('exit'), 3200);
    return () => clearTimeout(t);
  }, []);

  React.useEffect(() => {
    if (phase !== 'exit') return;
    const t = setTimeout(onDone, 600);
    return () => clearTimeout(t);
  }, [phase]);

  function handleTap() {
    if (phase === 'exit') return;
    setPhase('exit');
  }

  const orbitR = 130; // px from center to moon

  return (
    <div
      onClick={handleTap}
      style={{
        position: 'absolute', inset: 0,
        background: 'radial-gradient(circle at 50% 44%, rgba(45,78,166,0.13) 0%, transparent 60%), #07090A',
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer',
        opacity: phase === 'exit' ? 0 : 1,
        transition: phase === 'exit' ? 'opacity 0.55s ease-in' : 'none',
        zIndex: 300,
      }}
    >
      <style>{`
        @keyframes splashFadeIn {
          from { opacity: 0; transform: scale(0.94); }
          to   { opacity: 1; transform: scale(1); }
        }
        @keyframes splashOrbit {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }
        @keyframes splashMoonCounter {
          from { transform: rotate(0deg); }
          to   { transform: rotate(-360deg); }
        }
        @keyframes splashPulse {
          0%, 100% { opacity: 0.55; transform: scale(1); }
          50%       { opacity: 0.80; transform: scale(1.04); }
        }
        @keyframes splashHintBlink {
          0%, 100% { opacity: 0; }
          50%       { opacity: 0.5; }
        }
      `}</style>

      {/* Ambient glow ring */}
      <div style={{
        position: 'absolute',
        width: 320, height: 320,
        borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(244,175,89,0.06) 0%, transparent 70%)',
        animation: 'splashPulse 3.5s ease-in-out infinite',
      }} />

      {/* Orbit + Logo wrapper */}
      <div style={{
        position: 'relative',
        width: orbitR * 2 + 60,
        height: orbitR * 2 + 60,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        animation: 'splashFadeIn 1.1s cubic-bezier(0.25,0.46,0.45,0.94) forwards',
        opacity: 0,
      }}>

        {/* Orbit ring (faint dashed circle) */}
        <svg
          width={orbitR * 2 + 60}
          height={orbitR * 2 + 60}
          style={{ position: 'absolute', top: 0, left: 0, pointerEvents: 'none' }}
        >
          <circle
            cx={(orbitR * 2 + 60) / 2}
            cy={(orbitR * 2 + 60) / 2}
            r={orbitR}
            fill="none"
            stroke="rgba(244,175,89,0.12)"
            strokeWidth="1"
            strokeDasharray="3 7"
          />
        </svg>

        {/* Spinning orbit container */}
        <div style={{
          position: 'absolute', inset: 0,
          animation: 'splashOrbit 22s linear infinite',
          transformOrigin: '50% 50%',
        }}>
          {SPLASH_PHASES.map((ph, i) => {
            const angle = (i / SPLASH_PHASES.length) * 360;
            const rad = (angle * Math.PI) / 180;
            const cx = (orbitR * 2 + 60) / 2;
            const cy = (orbitR * 2 + 60) / 2;
            const x = cx + orbitR * Math.sin(rad);
            const y = cy - orbitR * Math.cos(rad);
            return (
              <div key={ph} style={{
                position: 'absolute',
                left: x - 14,
                top: y - 14,
                width: 28, height: 28,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                animation: 'splashMoonCounter 22s linear infinite',
                transformOrigin: '14px 14px',
                opacity: ph === 'full' ? 1 : 0.7,
              }}>
                <MoonGlyph
                  phase={ph}
                  size={ph === 'full' ? 22 : 16}
                  color={ph === 'full' ? 'rgba(244,175,89,0.9)' : 'rgba(253,254,235,0.6)'}
                />
              </div>
            );
          })}
        </div>

        {/* Logo — centered */}
        <div style={{ position: 'relative', zIndex: 2 }}>
          <SplashLogo size={200} />
        </div>
      </div>

      {/* Tagline */}
      <div style={{
        marginTop: 32,
        fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.20em',
        color: 'rgba(253,254,235,0.30)', textTransform: 'uppercase',
        animation: 'splashFadeIn 1.6s 0.8s cubic-bezier(0.25,0.46,0.45,0.94) forwards',
        opacity: 0,
      }}>
        Your Practice. Your Book.
      </div>

      {/* Tap hint — blinks in after 1.8s */}
      <div style={{
        position: 'absolute', bottom: 52,
        fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.20em',
        color: 'rgba(253,254,235,0.28)', textTransform: 'uppercase',
        animation: 'splashFadeIn 0.6s 1.8s ease forwards, splashHintBlink 2.2s 2.4s ease-in-out infinite',
        opacity: 0,
      }}>
        Tap to enter
      </div>
    </div>
  );
}

window.Splash = Splash;
window.SplashLogo = SplashLogo;

function CreateProfile({ onComplete, onBack, hasFrame }) {
  const [name,     setName]     = React.useState('Demo Witch');
  const [username, setUsername] = React.useState('demo');
  const [password, setPassword] = React.useState('demo');
  const [confirm,  setConfirm]  = React.useState('demo');
  const [deities,  setDeities]  = React.useState('Hecate, Brigid');
  const [error,    setError]    = React.useState('');
  const [visible,  setVisible]  = React.useState(false);
  const [focused,  setFocused]  = React.useState(null);

  React.useEffect(() => {
    const t = setTimeout(() => setVisible(true), 40);
    return () => clearTimeout(t);
  }, []);

  const baseInput = {
    width: '100%', boxSizing: 'border-box',
    background: 'rgba(253,254,235,0.05)',
    border: '1px solid rgba(253,254,235,0.12)',
    borderRadius: 14, padding: '14px 16px',
    color: 'var(--fg-1)', fontFamily: 'var(--font-body)',
    fontSize: 15, outline: 'none',
    transition: 'border-color 0.18s, background 0.18s',
    display: 'block',
  };
  function inputStyle(f) {
    return {
      ...baseInput,
      borderColor: focused === f ? 'rgba(244,175,89,0.55)' : 'rgba(253,254,235,0.12)',
      background:  focused === f ? 'rgba(253,254,235,0.07)' : 'rgba(253,254,235,0.05)',
    };
  }

  function handleCreate() {
    if (!name.trim())     { setError('Please enter your name.'); return; }
    if (!username.trim()) { setError('Please choose a username.'); return; }
    if (password.length < 4) { setError('Password must be at least 4 characters.'); return; }
    if (password !== confirm) { setError('Passwords do not match.'); return; }
    // Save credentials locally
    localStorage.setItem('oma_credentials', JSON.stringify({ username: username.trim(), password }));
    // Build profile data to pass back
    const deitiesArr = deities.split(',').map(d => d.trim()).filter(Boolean);
    onComplete({ name: name.trim(), deities: deitiesArr });
  }

  const labelStyle = {
    display: 'block', marginBottom: 6,
    fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.14em',
    color: 'rgba(253,254,235,0.35)', textTransform: 'uppercase',
  };

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(circle at 50% 38%, rgba(45,78,166,0.14) 0%, transparent 62%), #07090A',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'flex-start',
      padding: `${hasFrame ? 120 : 48}px 32px 40px`, overflowY: 'auto',
      opacity: visible ? 1 : 0, transition: 'opacity 0.45s ease',
    }}>
      {window.OMA_LOGO_WHITE
        ? <img src={window.OMA_LOGO_WHITE} alt="Old Mother's Altar" style={{ width: 160, display: 'block' }} />
        : <SplashLogo size={120} />}
      <div style={{
        fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.20em',
        color: 'rgba(253,254,235,0.30)', textTransform: 'uppercase',
        marginBottom: 32, marginTop: 10,
      }}>Create Your Profile</div>

      <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 12 }}>
        {/* Name */}
        <div>
          <label style={labelStyle}>Your Name</label>
          <input type="text" placeholder="How shall we address you?"
            value={name} onChange={e => { setName(e.target.value); setError(''); }}
            onFocus={() => setFocused('name')} onBlur={() => setFocused(null)}
            style={inputStyle('name')} autoComplete="name" />
        </div>
        {/* Username */}
        <div>
          <label style={labelStyle}>Username</label>
          <input type="text" placeholder="Choose a username"
            value={username} onChange={e => { setUsername(e.target.value); setError(''); }}
            onFocus={() => setFocused('username')} onBlur={() => setFocused(null)}
            style={inputStyle('username')} autoComplete="username" />
        </div>
        {/* Password */}
        <div>
          <label style={labelStyle}>Password</label>
          <input type="password" placeholder="••••••••"
            value={password} onChange={e => { setPassword(e.target.value); setError(''); }}
            onFocus={() => setFocused('password')} onBlur={() => setFocused(null)}
            style={inputStyle('password')} autoComplete="new-password" />
        </div>
        {/* Confirm password */}
        <div>
          <label style={labelStyle}>Confirm Password</label>
          <input type="password" placeholder="••••••••"
            value={confirm} onChange={e => { setConfirm(e.target.value); setError(''); }}
            onFocus={() => setFocused('confirm')} onBlur={() => setFocused(null)}
            style={inputStyle('confirm')} autoComplete="new-password" />
        </div>
        {/* Deities (optional) */}
        <div>
          <label style={labelStyle}>Deities <span style={{ opacity: 0.5 }}>(optional)</span></label>
          <input type="text" placeholder="e.g. Hecate, Brigid, The Morrigan"
            value={deities} onChange={e => setDeities(e.target.value)}
            onFocus={() => setFocused('deities')} onBlur={() => setFocused(null)}
            style={inputStyle('deities')} />
          <div style={{ marginTop: 6, fontSize: 10, fontFamily: 'var(--font-mono)', color: 'rgba(253,254,235,0.22)', letterSpacing: '0.08em' }}>

          </div>
        </div>

        {/* Error */}
        {error && (
          <div style={{
            padding: '9px 12px', background: 'rgba(220,53,69,0.12)',
            borderRadius: 8, color: 'rgba(253,150,150,0.9)',
            fontSize: 12, fontFamily: 'var(--font-body)', textAlign: 'center',
          }}>{error}</div>
        )}

        {/* Create button */}
        <button onClick={handleCreate} style={{
          marginTop: 4, width: '100%', padding: '15px',
          background: 'linear-gradient(135deg, #96A560 0%, #7d8c4e 100%)',
          border: 'none', borderRadius: 14, color: '#2A1230',
          fontFamily: 'var(--font-body)', fontWeight: 700,
          fontSize: 15, letterSpacing: '0.03em', cursor: 'pointer',
          boxShadow: '0 4px 18px rgba(244,175,89,0.22)',
        }}>
          Create Profile
        </button>

        {/* Or Log In */}
        <button onClick={onBack} style={{
          marginTop: 4, width: '100%', padding: '14px',
          background: 'none',
          border: '1px solid rgba(253,254,235,0.22)',
          borderRadius: 14, color: 'rgba(253,254,235,0.75)',
          fontFamily: 'var(--font-body)', fontWeight: 600,
          fontSize: 15, letterSpacing: '0.03em', cursor: 'pointer',
        }}>
          Or Log In
        </button>
      </div>

      <div style={{
        marginTop: 32, fontFamily: 'var(--font-mono)', fontSize: 9,
        color: 'rgba(253,254,235,0.18)', letterSpacing: '0.10em', textAlign: 'center',
      }}>
        This is a concept by Katy Towell, and I'll hex you if you steal it. © {new Date().getFullYear()}
      </div>
    </div>
  );
}

// ── Onboarding overlay ────────────────────────────────────────────────────────
function Onboarding({ name, onDone, onTabChange }) {
  const [step, setStep] = React.useState(0);
  const [visible, setVisible] = React.useState(false);
  const [exiting, setExiting] = React.useState(false);

  React.useEffect(() => {
    const t = setTimeout(() => setVisible(true), 60);
    return () => clearTimeout(t);
  }, []);

  function dismiss() {
    setExiting(true);
    if (onTabChange) onTabChange('altar');
    setTimeout(onDone, 380);
  }

  const steps = [
    {
      icon: Ico.sparkle,
      iconColor: 'var(--amber)',
      iconBg: 'rgba(244,175,89,0.15)',
      title: `Welcome, ${name || 'Witch'}`,
      body: "Your altar is ready. Here's a quick look at what's inside — tap through to get oriented.",
      tab: 'altar',
    },
    {
      icon: Ico.altar,
      iconColor: 'var(--indigo-300)',
      iconBg: 'rgba(45,78,166,0.18)',
      title: 'Home',
      body: "Your practice at a glance. See the moon phase, active spells, and jump straight into casting or journaling.",
      tab: 'altar',
    },
    {
      icon: Ico.sparkle,
      iconColor: 'var(--amber)',
      iconBg: 'rgba(244,175,89,0.15)',
      title: 'The Grimoire',
      body: 'Your catalog of spells and rituals. Add ingredients, set moon phase associations, and track every casting over time.',
      tab: 'workings',
    },
    {
      icon: Ico.book,
      iconColor: 'var(--moss)',
      iconBg: 'rgba(135,158,88,0.18)',
      title: 'The Journal',
      body: 'Log your castings and reflect on outcomes. Mark entries pending, ongoing, or complete as your work unfolds.',
      tab: 'book',
    },
    {
      icon: Ico.cabinet,
      iconColor: 'var(--fg-2)',
      iconBg: 'rgba(253,254,235,0.08)',
      title: 'The Cabinet',
      body: 'Keep inventory of your magical tools and supplies. Know what you have before you cast.',
      tab: 'cabinet',
    },
    {
      icon: Ico.candle,
      iconColor: 'var(--amber)',
      iconBg: 'rgba(244,175,89,0.15)',
      title: "You're all set",
      body: 'Your altar awaits. Everything you add here stays private on your device. Now go make some magic.',
      tab: 'altar',
      final: true,
    },
  ];

  function goToStep(n) {
    setStep(n);
    if (onTabChange) onTabChange(steps[n].tab);
  }

  const s = steps[step];
  const isLast = step === steps.length - 1;

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 400,
      background: 'rgba(7,9,10,0.40)',
      backdropFilter: 'blur(0.5px)',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'flex-end',
      opacity: visible && !exiting ? 1 : 0,
      transition: 'opacity 0.38s ease',
      padding: '0 0 0 0',
    }}>


      {/* Card */}
      <div style={{
        width: '100%',
        background: 'var(--bg-surface)',
        borderTop: '1px solid var(--line-soft)',
        borderRadius: '20px 20px 0 0',
        padding: '28px 20px 40px',
        display: 'flex', flexDirection: 'column', alignItems: 'center',
        gap: 16,
        transform: visible && !exiting ? 'translateY(0)' : 'translateY(40px)',
        transition: 'transform 0.38s cubic-bezier(0.22,1,0.36,1)',
      }}>

        {/* Drag handle */}
        <div style={{ width: 36, height: 4, borderRadius: 2, background: 'var(--line-medium)', marginBottom: 4 }} />

        {/* Icon */}
        <div style={{
          width: 72, height: 72, borderRadius: '50%',
          background: s.iconBg,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: s.iconColor,
        }}>
          {React.cloneElement(s.icon, { size: 32 })}
        </div>

        {/* Text */}
        <div style={{ textAlign: 'center', maxWidth: 300 }}>
          <div style={{
            fontFamily: 'var(--font-display)', fontSize: 22,
            color: 'var(--fg-1)', marginBottom: 10, lineHeight: 1.15,
          }}>
            {s.title}
          </div>
          <div style={{
            fontSize: 14, color: 'var(--fg-2)', lineHeight: 1.6,
          }}>
            {s.body}
          </div>
        </div>

        {/* Step dots */}
        <div style={{ display: 'flex', gap: 6, marginTop: 4 }}>
          {steps.map((_, i) => (
            <div key={i} style={{
              width: i === step ? 18 : 6, height: 6,
              borderRadius: 3,
              background: i === step ? 'var(--amber)' : 'var(--line-medium)',
              transition: 'width 0.25s ease, background 0.25s ease',
            }} />
          ))}
        </div>

        {/* Buttons */}
        <div style={{ width: '100%', display: 'flex', gap: 10, marginTop: 4, padding: '0 4px' }}>
          {!isLast && (
            <button onClick={dismiss} style={{
              flex: 1, padding: '15px',
              background: 'none',
              border: '1px solid var(--line-medium)',
              borderRadius: 14, color: 'var(--fg-2)',
              fontFamily: 'var(--font-body)', fontWeight: 600,
              fontSize: 15, letterSpacing: '0.03em', cursor: 'pointer',
            }}>
              Dismiss
            </button>
          )}
          <button onClick={isLast ? dismiss : () => goToStep(step + 1)} style={{
            flex: isLast ? undefined : 1,
            width: isLast ? '100%' : undefined,
            padding: '15px',
            background: 'linear-gradient(135deg, #96A560 0%, #7d8c4e 100%)',
            border: 'none', borderRadius: 14, color: '#2A1230',
            fontFamily: 'var(--font-body)', fontWeight: 700,
            fontSize: 15, letterSpacing: '0.03em', cursor: 'pointer',
            boxShadow: '0 4px 18px rgba(244,175,89,0.18)',
          }}>
            {isLast ? 'Set Up Your Altar' : 'Next'}
          </button>
          {false && (
            <button onClick={() => setStep(s => s - 1)} style={{
              background: 'none', border: 'none', cursor: 'pointer',
              color: 'var(--fg-3)', fontFamily: 'var(--font-body)',
              fontSize: 13, padding: '6px 0', textAlign: 'center',
            }}>
              Back
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

window.Onboarding = Onboarding;

function loadLS(key, fallback) {
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }
  catch { return fallback; }
}
function hydrateWorking(w) {
  return { ...w, icon: ICO_MAP[w.iconKey] || Ico.sparkle };
}
// Migrate old entry format (body string) to new format (notes array)
function migrateEntry(e) {
  if (!e.notes || !Array.isArray(e.notes) || e.notes.length === 0) {
    const text = e.body || '';
    return {
      ...e,
      notes: text ? [{ id: 'migrated', text, ts: e.date ? (e.date + 'T' + (e.time || '12:00') + ':00') : new Date().toISOString() }] : [],
    };
  }
  return e;
}

// ── Magical events ────────────────────────────────────────────────────────────
function getMagicalEvents(date) {
  const events = [];
  const m = date.getMonth() + 1, day = date.getDate(), yr = date.getFullYear();
  const known = new Date('2000-01-06T18:14:00Z');
  const synodic = 29.530588853;
  const diff = (date - known) / (1000 * 60 * 60 * 24);
  const phase = ((diff % synodic) + synodic) % synodic;
  const tol = 1.2;
  if (phase < tol || phase > synodic - tol) events.push({ name: 'New Moon', glyph: 'new' });
  else if (Math.abs(phase - 7.38) < tol)  events.push({ name: 'First Quarter Moon', glyph: 'first-quarter' });
  else if (Math.abs(phase - 14.77) < tol) events.push({ name: 'Full Moon', glyph: 'full' });
  else if (Math.abs(phase - 22.15) < tol) events.push({ name: 'Last Quarter Moon', glyph: 'last-quarter' });
  const sabbats = [
    {m:2,d:1,name:'Imbolc'},{m:2,d:2,name:'Imbolc'},
    {m:3,d:19,name:'Ostara'},{m:3,d:20,name:'Ostara'},{m:3,d:21,name:'Ostara'},
    {m:5,d:1,name:'Beltane'},
    {m:6,d:20,name:'Litha'},{m:6,d:21,name:'Litha'},{m:6,d:22,name:'Litha'},
    {m:8,d:1,name:'Lughnasadh'},{m:8,d:2,name:'Lughnasadh'},
    {m:9,d:21,name:'Mabon'},{m:9,d:22,name:'Mabon'},{m:9,d:23,name:'Mabon'},
    {m:10,d:31,name:'Samhain'},{m:11,d:1,name:'Samhain'},
    {m:12,d:20,name:'Yule'},{m:12,d:21,name:'Yule'},{m:12,d:22,name:'Yule'},
  ];
  sabbats.forEach(s => { if (s.m === m && s.d === day) events.push({ name: s.name, glyph: null }); });
  const retro = [
    ['2025-04-07','2025-04-30'],['2025-08-06','2025-08-28'],['2025-11-25','2025-12-15'],
    ['2026-03-15','2026-04-07'],['2026-07-18','2026-08-11'],['2026-11-06','2026-11-28'],
    ['2027-02-26','2027-03-20'],['2027-06-29','2027-07-23'],['2027-10-19','2027-11-10'],
  ];
  const ds = `${yr}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const today = new Date(yr, m - 1, day);
  if (retro.some(([s, e]) => today >= new Date(s) && today <= new Date(e)))
    events.push({ name: 'Mercury Retrograde ☿', glyph: null });
  const eclipses = [
    {date:'2026-02-17',name:'Annular Solar Eclipse'},{date:'2026-03-03',name:'Total Lunar Eclipse'},
    {date:'2026-08-12',name:'Total Solar Eclipse'},{date:'2026-09-02',name:'Partial Lunar Eclipse'},
    {date:'2027-02-06',name:'Annular Solar Eclipse'},{date:'2027-07-22',name:'Total Solar Eclipse'},
    {date:'2027-08-06',name:'Total Lunar Eclipse'},
  ];
  eclipses.forEach(e => { if (e.date === ds) events.push({ name: e.name, glyph: null }); });
  return events;
}

      <button onClick={() => setOpen(o => !o)} style={{
        width: '100%', display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between',
        gap: 10, padding: '12px 14px',
        background: 'transparent', border: 0, cursor: 'pointer', textAlign: 'left',

        <span style={{ fontFamily: 'var(--font-body)', fontWeight: 600, fontSize: 13.5, color: 'var(--fg-1)', lineHeight: 1.4, flex: 1 }}>
          {item.q}
        </span>
        <span style={{
          color: 'var(--fg-3)', flexShrink: 0, marginTop: 2,
          transform: open ? 'rotate(90deg)' : 'rotate(0)', transition: 'transform 0.18s', display: 'flex',
        }}>
          {React.cloneElement(Ico.chevron, { size: 14 })}
        </span>
      </button>
      {open && (
        <div style={{ padding: '0 14px 14px', color: 'var(--fg-2)', fontSize: 13, lineHeight: 1.65 }}>
          {item.a}
        </div>
      )}
    </div>
  );
}

function LoginScreen({ theme, onLogin, onCreateProfile }) {
  const [user, setUser] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [shake, setShake] = React.useState(false);
  const [error, setError] = React.useState('');

  function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (!user.trim() || !pass) {
      setError('Please enter your username and password.');
      setShake(true); setTimeout(() => setShake(false), 500);
      return;
    }
    const stored = loadLS('oma_credentials', null);
    if (!stored || stored.username !== user.trim() || stored.password !== pass) {
      setError('Username or password is incorrect.');
      setShake(true); setTimeout(() => setShake(false), 500);
      return;
    }
    onLogin();
  }

  const inputStyle = {
    width: '100%', boxSizing: 'border-box',
    background: 'var(--bg-elevated)',
    border: '1px solid var(--line-medium)',
    borderRadius: 'var(--r-md)',
    padding: '13px 16px',
    color: 'var(--fg-1)',
    fontFamily: 'var(--font-body)',
    fontSize: 16,
    outline: 'none',
  };

  const logoSrc = theme === 'dark' ? window.OMA_LOGO_WHITE : window.OMA_LOGO_PRIMARY;

  return (
    <div data-theme={theme} style={{
      width: '100%', height: '100%',
      background: 'var(--bg-page)', color: 'var(--fg-1)',
      fontFamily: 'var(--font-body)',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      padding: '0 32px', boxSizing: 'border-box',
    }}>
      {logoSrc && (
        <img src={logoSrc} alt="Old Mother's Altar"
          style={{ height: 56, marginBottom: 36, display: 'block' }} />
      )}
      <form onSubmit={handleSubmit} style={{
        width: '100%', maxWidth: 300,
        display: 'flex', flexDirection: 'column', gap: 14,
        animation: shake ? 'oma-shake 0.4s ease' : 'none',
      }}>
        <div>
          <div className="oma-eyebrow" style={{ marginBottom: 6 }}>Username</div>
          <input value={user} onChange={ev => { setUser(ev.target.value); setError(''); }}
            placeholder="your username" autoComplete="username" style={inputStyle} />
        </div>
        <div>
          <div className="oma-eyebrow" style={{ marginBottom: 6 }}>Password</div>
          <input type="password" value={pass} onChange={ev => { setPass(ev.target.value); setError(''); }}
            placeholder="••••••••" autoComplete="current-password" style={inputStyle} />
        </div>
        {error && (
          <div style={{ color: 'var(--crimson-300)', fontSize: 12, marginTop: -6, lineHeight: 1.4 }}>
            {error}
          </div>
        )}
        <button type="submit" style={{
          marginTop: 4,
          background: 'var(--action-primary-bg)', color: 'var(--action-primary-fg)',
          border: 'none', borderRadius: 'var(--r-md)',
          padding: '14px 0', width: '100%', cursor: 'pointer',
          fontFamily: 'var(--font-body)', fontWeight: 600, fontSize: 15,
          letterSpacing: 'var(--tk-button)',
        }}>Log In</button>
      </form>
      <button
        onClick={onCreateProfile}
        style={{
          marginTop: 20,
          background: 'none', border: 'none',
          color: 'var(--fg-3)',
          fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.12em',
          textTransform: 'uppercase', cursor: 'pointer',
          padding: '6px 0',
          textDecoration: 'underline',

        Create Profile
      </button>
      <style>{`
        @keyframes oma-shake {
          0%,100%{transform:translateX(0)}
          20%{transform:translateX(-6px)}
          40%{transform:translateX(6px)}
          60%{transform:translateX(-4px)}
          80%{transform:translateX(4px)}
        }
      `}</style>
    </div>
  );
}

const SPLASH_PHASES = [
  'new', 'waxing-crescent', 'first-quarter', 'waxing-gibbous',
  'full', 'waning-gibbous', 'last-quarter', 'waning-crescent',
];

function SplashScreen({ theme, onDone }) {
  const [exiting, setExiting] = React.useState(false);
  const logoSrc = theme === 'dark' ? window.OMA_LOGO_WHITE : window.OMA_LOGO_PRIMARY;
  const orbitR = 130;

  // Auto-advance after 3.4s
  React.useEffect(() => {
    const t = setTimeout(() => setExiting(true), 3400);
    return () => clearTimeout(t);
  }, []);

  React.useEffect(() => {
    if (!exiting) return;
    const t = setTimeout(onDone, 600);
    return () => clearTimeout(t);
  }, [exiting]);

  function handleTap() { if (!exiting) setExiting(true); }

  return (
    <div data-theme={theme} onClick={handleTap} style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(circle at 50% 44%, rgba(45,78,166,0.13) 0%, transparent 60%), var(--bg-page)',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      cursor: 'pointer',
      opacity: exiting ? 0 : 1,
      transition: exiting ? 'opacity 0.55s ease-in' : 'none',
      zIndex: 300,
      userSelect: 'none',
    }}>
      <style>{`
        @keyframes splashFadeIn {
          from { opacity: 0; transform: scale(0.94); }
          to   { opacity: 1; transform: scale(1); }
        }
        @keyframes splashOrbit {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }
        @keyframes splashMoonCounter {
          from { transform: rotate(0deg); }
          to   { transform: rotate(-360deg); }
        }
        @keyframes splashPulse {
          0%, 100% { opacity: 0.5; transform: scale(1); }
          50%       { opacity: 0.8; transform: scale(1.05); }
        }
        @keyframes splashHintBlink {
          0%, 100% { opacity: 0; }
          50%       { opacity: 0.5; }
        }
      `}</style>

      {/* Ambient glow */}
      <div style={{
        position: 'absolute',
        width: 340, height: 340, borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(244,175,89,0.07) 0%, transparent 70%)',
        animation: 'splashPulse 3.6s ease-in-out infinite',
      }} />

      {/* Orbit + logo */}
      <div style={{
        position: 'relative',
        width: orbitR * 2 + 60,
        height: orbitR * 2 + 60,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        animation: 'splashFadeIn 1.1s cubic-bezier(0.25,0.46,0.45,0.94) forwards',
        opacity: 0,
      }}>
        {/* Dashed orbit ring */}
        <svg width={orbitR * 2 + 60} height={orbitR * 2 + 60}
          style={{ position: 'absolute', top: 0, left: 0, pointerEvents: 'none' }}>
          <circle
            cx={(orbitR * 2 + 60) / 2} cy={(orbitR * 2 + 60) / 2} r={orbitR}
            fill="none" stroke="rgba(244,175,89,0.12)" strokeWidth="1" strokeDasharray="3 7"
          />
        </svg>

        {/* Spinning moon container */}
        <div style={{
          position: 'absolute', inset: 0,
          animation: 'splashOrbit 22s linear infinite',
          transformOrigin: '50% 50%',
        }}>
          {SPLASH_PHASES.map((ph, i) => {
            const angle = (i / SPLASH_PHASES.length) * 360;
            const rad   = (angle * Math.PI) / 180;
            const cx    = (orbitR * 2 + 60) / 2;
            const cy    = (orbitR * 2 + 60) / 2;
            const x     = cx + orbitR * Math.sin(rad);
            const y     = cy - orbitR * Math.cos(rad);
            return (
              <div key={ph} style={{
                position: 'absolute',
                left: x - 14, top: y - 14,
                width: 28, height: 28,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                animation: 'splashMoonCounter 22s linear infinite',
                transformOrigin: '14px 14px',
                opacity: ph === 'full' ? 1 : 0.65,
              }}>
                <MoonGlyph
                  phase={ph}
                  size={ph === 'full' ? 22 : 16}
                  color={ph === 'full' ? 'rgba(244,175,89,0.95)' : 'rgba(253,254,235,0.65)'}
                />
              </div>
            );
          })}
        </div>

        {/* Logo */}
        <div style={{ position: 'relative', zIndex: 2, padding: '0 20px' }}>
          {logoSrc
            ? <img src={logoSrc} alt="Old Mother's Altar" style={{ width: 200, display: 'block', filter: 'drop-shadow(0 0 18px rgba(244,175,89,0.15))' }} />
            : <div style={{ color: 'var(--fg-1)', fontFamily: 'var(--font-display)', fontSize: 22, textAlign: 'center', textTransform: 'uppercase' }}>Old Mother's Altar</div>
          }
        </div>
      </div>

      {/* Tagline */}
      <div style={{
        marginTop: 32,
        fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.20em',
        color: 'rgba(253,254,235,0.28)', textTransform: 'uppercase',
        animation: 'splashFadeIn 1.2s 0.9s cubic-bezier(0.25,0.46,0.45,0.94) forwards',
        opacity: 0,
      }}>
        Your Book of Shadows
      </div>

      {/* Tap hint */}
      <div style={{
        position: 'absolute', bottom: 52,
        fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.20em',
        color: 'rgba(253,254,235,0.28)', textTransform: 'uppercase',
        animation: 'splashFadeIn 0.6s 1.8s ease forwards, splashHintBlink 2.4s 2.4s ease-in-out infinite',
        opacity: 0,
      }}>
        Tap to enter
      </div>
    </div>
  );
}

function App({ theme, setTheme, isMobile }) {
  const [splashDone, setSplashDone] = React.useState(false);
  const [authScreen, setAuthScreen] = React.useState(null); // always start in app for demo
  const [showOnboarding, setShowOnboarding] = React.useState(false);

  function handleLogOut() {
    setAuthScreen('login');
  }
  const [tab, setTab]                     = React.useState('altar');
  const [openWorkingId, setOpenWorkingId] = React.useState(null);
  const [editWorkingId, setEditWorkingId] = React.useState(null);
  const [viewEntryId, setViewEntryId]     = React.useState(null);
  const [composerOpen, setComposerOpen]   = React.useState(false);
  const [composerKey, setComposerKey]     = React.useState(0);
  const [entryOpen, setEntryOpen]               = React.useState(false);
  const [entryKey, setEntryKey]                 = React.useState(0);
  const [editEntryId, setEditEntryId]           = React.useState(null);
  const [cabinetFormOpen, setCabinetFormOpen]   = React.useState(false);
  const [cabinetFormKey, setCabinetFormKey]     = React.useState(0);
  const [editCabinetItem, setEditCabinetItem]   = React.useState(null);
  const [drawerOpen, setDrawerOpen]             = React.useState(false);

  const newWorkingSubmitRef  = React.useRef(null);
  const newEntrySubmitRef    = React.useRef(null);
  const cabinetFormSubmitRef = React.useRef(null);
  const scrollRef            = React.useRef(null);

  // ── Persisted state ────────────────────────────────────────────────────────
  const [workings, setWorkings] = React.useState(() =>
    loadLS('oma_workings', DEFAULT_WORKINGS).map(hydrateWorking)
  );
  const [entries, setEntries] = React.useState(() =>
    loadLS('oma_entries', DEFAULT_ENTRIES).map(migrateEntry)
  );
  const [cabinet, setCabinet] = React.useState(() =>
    loadLS('oma_cabinet', DEFAULT_CABINET).map(c => ({
      ...c,
      types: c.types || (c.type ? [c.type] : ['other']),
    }))
  );
  const [profile, setProfile] = React.useState(() =>
    loadLS('oma_profile', DEFAULT_PROFILE)
  );
  const [dismissedProgressIds, setDismissedProgressIds] = React.useState(() =>
    loadLS('oma_dismissed_progress', [])
  );

  // ── Persist ────────────────────────────────────────────────────────────────
  React.useEffect(() => {
    localStorage.setItem('oma_workings', JSON.stringify(workings.map(({ icon, ...r }) => r)));
  }, [workings]);
  React.useEffect(() => { localStorage.setItem('oma_entries', JSON.stringify(entries)); }, [entries]);
  React.useEffect(() => { localStorage.setItem('oma_cabinet', JSON.stringify(cabinet)); }, [cabinet]);
  React.useEffect(() => { localStorage.setItem('oma_profile', JSON.stringify(profile)); }, [profile]);
  React.useEffect(() => { localStorage.setItem('oma_dismissed_progress', JSON.stringify(dismissedProgressIds)); }, [dismissedProgressIds]);

  // Reset scroll to top on every page/view change
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }, [tab, openWorkingId, viewEntryId, composerOpen, cabinetFormOpen, entryOpen]);

  // ── Custom confirm modal ───────────────────────────────────────────────────
  const [confirmState, setConfirmState] = React.useState(null);
  React.useEffect(() => {
    window.showConfirm = (message, onConfirm, confirmLabel = 'Confirm', isDanger = true) => {
      setConfirmState({ message, onConfirm, confirmLabel, isDanger });
    };
  }, []);

  // ── Handlers ──────────────────────────────────────────────────────────────
  // Auto-add any spell ingredients not already in the cabinet (case-insensitive match).
  // New items land under type "other" with no quantity — user can edit later.
  function syncIngredientsToCabinet(ingredients) {
    if (!ingredients || ingredients.length === 0) return;
    setCabinet(prev => {
      const existing = new Set(prev.map(c => c.name.toLowerCase().trim()));
      const newItems = ingredients
        .filter(ing => ing.name && ing.name.trim() && !existing.has(ing.name.toLowerCase().trim()))
        .map(ing => ({
          id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
          name: ing.name.trim(),
          type: 'other',
          inv: null,
          note: '',
        }));
      return newItems.length > 0 ? [...newItems, ...prev] : prev;
    });
  }

  function handleCreateWorking(w) {
    setWorkings(prev => [hydrateWorking(w), ...prev]);
    syncIngredientsToCabinet(w.ingredients);
    setComposerOpen(false); setEditWorkingId(null);
  }
  function handleSaveWorking(w) {
    setWorkings(prev => prev.map(x => x.id === w.id ? hydrateWorking(w) : x));
    syncIngredientsToCabinet(w.ingredients);
    setComposerOpen(false); setEditWorkingId(null);
  }
  function handleDeleteWorking(id) { setWorkings(prev => prev.filter(w => w.id !== id)); setOpenWorkingId(null); }
  function handleSealWorking(id) { setWorkings(prev => prev.map(w => w.id === id ? { ...w, sealed: !w.sealed } : w)); }
  function handleToggleFavorite(id) { setWorkings(prev => prev.map(w => w.id === id ? { ...w, favorite: !w.favorite } : w)); }

  function handleSaveEntry(e) {
    setEntries(prev => {
      const idx = prev.findIndex(x => x.id === e.id);
      if (idx >= 0) { const next = [...prev]; next[idx] = e; return next; }
      return [e, ...prev];
    });
    setEntryOpen(false); setEditEntryId(null);
  }
  function handleDeleteEntry(id) {
    setEntries(prev => prev.filter(e => e.id !== id));
    setEntryOpen(false); setEditEntryId(null);
    setViewEntryId(null);
  }

  // ── Form open helpers (increment key to force fresh mount) ────────────────
  function openComposer(editId = null) {
    setEditWorkingId(editId);
    setComposerKey(k => k + 1);
    setComposerOpen(true);
  }
  function openEntryForm(editId = null) {
    setEditEntryId(editId);
    setEntryKey(k => k + 1);
    setEntryOpen(true);
  }
  function openCabinetForm(item = null) {
    setEditCabinetItem(item);
    setCabinetFormKey(k => k + 1);
    setCabinetFormOpen(true);
  }

  function handleSaveCabinetItem(item) {
    setCabinet(prev => {
      const idx = prev.findIndex(c => c.id === item.id);
      if (idx >= 0) { const next = [...prev]; next[idx] = item; return next; }
      return [item, ...prev];
    });
  }
  function handleDeleteCabinetItem(id) { setCabinet(prev => prev.filter(c => c.id !== id)); }

  function handleUpdateProfile(p) { setProfile(p); }
  function handleDismissProgress(entryId) { setDismissedProgressIds(prev => [...prev, entryId]); }
  function handleToggleEntryTask(entryId, doneKey) {
    setEntries(prev => prev.map(e => {
      if (e.id !== entryId) return e;
      const tasksDone = { ...(e.tasksDone || {}) };
      tasksDone[doneKey] = !tasksDone[doneKey];
      return { ...e, tasksDone };
    }));
  }

  function handleAddCustomCabType(customType) {
    const existing = profile.customCabinetTypes || [];
    if (existing.find(t => t.id === customType.id)) return;
    handleUpdateProfile({ ...profile, customCabinetTypes: [...existing, customType] });
  }

  // Keep module-level type store in sync so typeEmoji/typeLabel work everywhere
  React.useEffect(() => {
    window._setCustomCabTypes(profile.customCabinetTypes || []);
  }, [profile.customCabinetTypes]);

  // All available cabinet types: base + custom + Other at the end
  const allCabTypes = React.useMemo(() => {
    const base = CAB_TYPES.filter(t => t.id !== 'other');
    const custom = profile.customCabinetTypes || [];
    const other = CAB_TYPES.find(t => t.id === 'other');
    return [...base, ...custom, other];
  }, [profile.customCabinetTypes]);

  // ── Altar data ─────────────────────────────────────────────────────────────
  const now = new Date();
  const MONTHS_ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  const h = now.getHours();
  const timeOfDay = h < 5 ? 'Still the night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const magicalEvents = getMagicalEvents(now);
  const MOON_PHASES = [
    {key:'new',label:'New Moon'},{key:'waxing-crescent',label:'Waxing Crescent'},
    {key:'first-quarter',label:'First Quarter'},{key:'waxing-gibbous',label:'Waxing Gibbous'},
    {key:'full',label:'Full Moon'},{key:'waning-gibbous',label:'Waning Gibbous'},
    {key:'last-quarter',label:'Last Quarter'},{key:'waning-crescent',label:'Waning Crescent'},
  ];
  const known = new Date('2000-01-06T18:14:00Z');
  const synodic = 29.530588853;
  const moonDiff = ((now - known) / (1000 * 60 * 60 * 24) % synodic + synodic) % synodic;
  const moonIdx = Math.floor((moonDiff / synodic) * 8) % 8;
  const currentMoon = MOON_PHASES[moonIdx];

  // ── Progress reminders — cast entries whose spell duration has elapsed ──────
  function durationToMs({ val, unit }) {
    const map = { minutes: 60e3, hours: 36e5, days: 864e5, weeks: 6048e5, months: 2592e6 };
    return val * (map[unit] || 864e5);
  }
  const progressReminders = [];
  entries.forEach(entry => {
    if (entry.kind !== 'cast') return;
    if (!entry.workingId) return;
    if (entry.status === 'Completed') return;
    const spell = workings.find(w => w.id === entry.workingId);
    if (!spell || spell.sealed || !spell.duration || !spell.duration.val) return;
    if (dismissedProgressIds.includes(entry.id)) return;
    const dueDate = new Date(new Date(entry.date).getTime() + durationToMs(spell.duration));
    if (now < dueDate) return;
    progressReminders.push({
      entryId: entry.id,
      entryTitle: entry.title,
      spellName: spell.name,
      duration: spell.duration,
      castDate: entry.date,
    });
  });
  progressReminders.sort((a, b) => new Date(a.castDate) - new Date(b.castDate));
  const progressReminder = progressReminders[0] ?? null;

  // Compute pending tasks from journal entries that are linked to spells
  const pendingTasks = [];
  entries.forEach(entry => {
    if (!entry.workingId) return;
    if (entry.status === 'Completed') return;
    const spell = workings.find(w => w.id === entry.workingId);
    if (!spell || !spell.tasks || spell.tasks.length === 0) return;
    const castDate = new Date(entry.date);
    spell.tasks.forEach(task => {
      if (task.repeat && task.repeat.val > 0) {
        // Repeating task — show if current occurrence is undone
        const repeatMs = task.repeat.val * (
          { minutes: 60e3, hours: 36e5, days: 864e5, weeks: 6048e5, months: 2592e6, years: 31536e6 }[task.repeat.unit] || 864e5
        );
        const occIdx = Math.max(0, Math.floor((now - castDate) / repeatMs));
        const doneKey = `${task.id}_${occIdx}`;
        if (!entry.tasksDone || !entry.tasksDone[doneKey]) {
          pendingTasks.push({
            taskId: task.id, doneKey,
            taskText: task.text,
            entryId: entry.id, entryTitle: entry.title, spellName: spell.name,
            repeatInfo: `Every ${task.repeat.val} ${task.repeat.unit}`,
          });
        }
      } else {
        // Non-repeating task
        if (!entry.tasksDone || !entry.tasksDone[task.id]) {
          pendingTasks.push({
            taskId: task.id, doneKey: task.id,
            taskText: task.text,
            entryId: entry.id, entryTitle: entry.title, spellName: spell.name,
          });
        }
      }
    });
  });

  const altarData = {
    moonPhase: currentMoon.key,
    moonLabel: currentMoon.label,
    monthRoman: MONTHS_ROMAN[now.getMonth()],
    recentEntries: entries.slice(0, 3),
    totalEntries: entries.length,
    pendingTasks,
    progressReminder,
    magicalEvents,
    timeOfDay,
    userName: profile.name || 'Witch',
  };

  // ── Persistent right-side buttons: hamburger ─────────────────────────────
  const rightBtns = (
    <IconBtn icon={Ico.menu} onClick={() => setDrawerOpen(true)} label="Menu" />
  );

  // ── Home button — shown on non-altar tabs (no back arrow present) ─────────
  const homeBtn = (
    <IconBtn icon={Ico.altar} onClick={() => { setTab('altar'); setOpenWorkingId(null); setViewEntryId(null); }} label="Home" />
  );

  // ── Routing ────────────────────────────────────────────────────────────────
  let topBar = null, body = null, bottomBar = null;
  const openWorking = workings.find(w => w.id === openWorkingId);
  const viewEntry = viewEntryId ? entries.find(e => e.id === viewEntryId) : null;

  if (composerOpen) {
    // ── New / Edit Spell — full page ──
    const isEdit = !!editWorkingId;
    topBar = (
      <TopBar title={isEdit ? 'Edit Spell' : 'New Spell'} eyebrow="GRIMOIRE"
        leading={<IconBtn icon={Ico.back} onClick={() => { setComposerOpen(false); setEditWorkingId(null); }} label="Back" />}
        trailing={rightBtns} />
    );
    body = (
      <NewWorking
        key={composerKey}
        editData={isEdit ? workings.find(w => w.id === editWorkingId) : null}
        onCreate={handleCreateWorking}
        onSave={handleSaveWorking}
        submitRef={newWorkingSubmitRef}
        cabinet={cabinet}
        profileDeities={profile.deities || []}
      />
    );
    bottomBar = (
      <BottomBar>
        <Btn variant="secondary" size="lg" style={{ flex: '0 0 auto' }}
          onClick={() => { setComposerOpen(false); setEditWorkingId(null); }}>
          Cancel
        </Btn>
        <Btn variant="primary" size="lg" icon={Ico.sparkle} fullWidth
          onClick={() => newWorkingSubmitRef.current?.()}>
          Save Spell
        </Btn>
      </BottomBar>
    );

  } else if (cabinetFormOpen) {
    // ── New / Edit Cabinet Item — full page ──
    const isEditItem = !!editCabinetItem;
    topBar = (
      <TopBar title={isEditItem ? 'Edit Item' : 'Add to Cabinet'} eyebrow="THE CABINET"
        leading={<IconBtn icon={Ico.back} onClick={() => { setCabinetFormOpen(false); setEditCabinetItem(null); }} label="Back" />}
        trailing={rightBtns} />
    );
    body = (
      <CabinetForm
        key={cabinetFormKey}
        item={editCabinetItem}
        onSave={item => { handleSaveCabinetItem(item); setCabinetFormOpen(false); setEditCabinetItem(null); }}
        onDelete={id => { handleDeleteCabinetItem(id); setCabinetFormOpen(false); setEditCabinetItem(null); }}
        submitRef={cabinetFormSubmitRef}
        allCabTypes={allCabTypes}
        onAddCustomType={handleAddCustomCabType}
      />
    );
    bottomBar = (
      <BottomBar>
        <Btn variant="secondary" size="lg" style={{ flex: '0 0 auto' }}
          onClick={() => { setCabinetFormOpen(false); setEditCabinetItem(null); }}>
          Cancel
        </Btn>
        <Btn variant="primary" size="lg" icon={Ico.check} fullWidth
          onClick={() => cabinetFormSubmitRef.current?.()}>
          {isEditItem ? 'Save Changes' : 'Save Item'}
        </Btn>
      </BottomBar>
    );

  } else if (entryOpen) {
    // ── New / Edit Journal Entry — full page ──
    const isEditEntry = !!editEntryId;
    topBar = (
      <TopBar title={isEditEntry ? 'Edit Entry' : 'New Entry'} eyebrow="JOURNAL"
        leading={<IconBtn icon={Ico.back} onClick={() => { setEntryOpen(false); setEditEntryId(null); }} label="Back" />}
        trailing={rightBtns} />
    );
    body = (
      <JournalEntry
        key={entryKey}
        editId={editEntryId}
        onSave={handleSaveEntry}
        onDelete={handleDeleteEntry}
        workings={workings}
        entries={entries}
        submitRef={newEntrySubmitRef}
      />
    );
    bottomBar = (
      <BottomBar>
        <Btn variant="secondary" size="lg" style={{ flex: '0 0 auto' }}
          onClick={() => { setEntryOpen(false); setEditEntryId(null); }}>
          Cancel
        </Btn>
        <Btn variant="primary" size="lg" icon={Ico.penTool} fullWidth
          onClick={() => newEntrySubmitRef.current?.()}>
          Save Entry
        </Btn>
      </BottomBar>
    );

  } else if (viewEntry) {
    // ── Entry detail (read-only) — checked before openWorking so navigating from
    //    a spell's cast history to an entry preserves the spell in the back stack ──
    topBar = (
      <TopBar title={viewEntry.title} eyebrow="JOURNAL ENTRY"
        leading={<IconBtn icon={Ico.back} onClick={() => setViewEntryId(null)} label="Back" />}
        trailing={rightBtns} />
    );
    body = <EntryDetail entryId={viewEntryId} entries={entries} workings={workings} onToggleTask={doneKey => handleToggleEntryTask(viewEntryId, doneKey)} />;
    bottomBar = (
      <BottomBar>
        <Btn variant="ghost" size="md" onClick={() => {
          window.showConfirm('Delete this entry? This cannot be undone.', () => handleDeleteEntry(viewEntryId), 'Delete');
        }} style={{ color: 'var(--crimson-300)', display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
          {React.cloneElement(Ico.trash, { size: 15 })}
          Delete
        </Btn>
        <Btn variant="primary" size="md" fullWidth icon={Ico.edit} onClick={() => openEntryForm(viewEntryId)}>
          Edit Entry
        </Btn>
      </BottomBar>
    );

  } else if (openWorking) {
    // ── Spell detail ──
    topBar = (
      <TopBar title={openWorking.name} eyebrow="SPELL"
        leading={<IconBtn icon={Ico.back} onClick={() => setOpenWorkingId(null)} label="Back" />}
        trailing={rightBtns} />
    );
    body = (
      <WorkingDetail working={openWorking}
        entries={entries}
        onOpenEntry={id => setViewEntryId(id)}
        onBack={() => setOpenWorkingId(null)}
        onCast={() => openEntryForm(null)}
        onDelete={() => handleDeleteWorking(openWorking.id)}
        onEdit={() => openComposer(openWorking.id)}
        onToggleFavorite={() => handleToggleFavorite(openWorking.id)} />
    );
    // WorkingDetail has its own sticky footer

  } else if (tab === 'altar') {
    const logoSrc = theme === 'dark' ? window.OMA_LOGO_WHITE : window.OMA_LOGO_PRIMARY;
    topBar = (
      <TopBar
        title={logoSrc
          ? <img src={logoSrc} alt="Old Mother's Altar" style={{ height: 26, display: 'block', margin: '0 auto' }} />
          : "Home"}
        trailing={rightBtns} />
    );
    body = <Altar data={altarData} onOpenWorking={setOpenWorkingId} onCompose={() => openComposer()} onNewEntry={() => openEntryForm()} onOpenEntry={id => setViewEntryId(id)} onGoToJournal={() => setTab('book')} onDismissProgress={handleDismissProgress} />;
    bottomBar = (
      <BottomBar>
        <Btn variant="secondary" size="lg" icon={Ico.penTool} style={{ flex: 1 }} onClick={() => openEntryForm()}>
          New Journal Entry
        </Btn>
        <Btn variant="primary" size="lg" icon={Ico.sparkle} style={{ flex: 1 }} onClick={() => openComposer()}>
          New Spell
        </Btn>
      </BottomBar>
    );

  } else if (tab === 'workings') {
    topBar = (
      <TopBar title="The Grimoire" eyebrow="YOUR SPELLS"
        leading={homeBtn} trailing={rightBtns} />
    );
    body = <Workings workings={workings} onOpenWorking={setOpenWorkingId} onCompose={() => openComposer()} onToggleFavorite={handleToggleFavorite} />;
    bottomBar = (
      <BottomBar>
        <Btn variant="primary" size="md" icon={Ico.plus} fullWidth onClick={() => openComposer()}>
          Add a Spell
        </Btn>
      </BottomBar>
    );

  } else if (tab === 'book') {
    topBar = (
      <TopBar title="The Journal" eyebrow="YOUR PRACTICE"
        leading={homeBtn} trailing={rightBtns} />
    );
    body = <TheBook entries={entries} workings={workings} onWrite={() => openEntryForm()} onOpenEntry={id => setViewEntryId(id)} />;
    bottomBar = (
      <BottomBar>
        <Btn variant="primary" size="md" icon={Ico.penTool} fullWidth onClick={() => openEntryForm()}>
          Write an Entry
        </Btn>
      </BottomBar>
    );

  } else if (tab === 'cabinet') {
    topBar = (
      <TopBar title="The Cabinet" eyebrow="YOUR STORES"
        leading={homeBtn} trailing={rightBtns} />
    );
    body = <Cabinet cabinet={cabinet} onAdd={() => openCabinetForm()} onEditItem={item => openCabinetForm(item)} allCabTypes={allCabTypes} />;
    bottomBar = (
      <BottomBar>
        <Btn variant="primary" size="md" icon={Ico.plus} fullWidth onClick={() => openCabinetForm()}>
          Add to Cabinet
        </Btn>
      </BottomBar>
    );

  } else if (tab === 'profile') {
    topBar = (
      <TopBar title="Settings" eyebrow="YOUR PRACTICE"
        leading={homeBtn} trailing={rightBtns} />
    );
    body = (
      <Profile profile={profile} onUpdateProfile={handleUpdateProfile}
        workings={workings} entries={entries} cabinet={cabinet}
        theme={theme} setTheme={setTheme} onLogOut={handleLogOut}
        onNavigate={t => setTab(t)} />
    );
  } else if (tab === 'help') {
    topBar = (
      <TopBar title="How to Use" eyebrow="YOUR GUIDE"
        leading={homeBtn} trailing={rightBtns} />
    );
    body = <HelpScreen />;
  }

  if (!splashDone) {
    return <SplashScreen theme={theme} onDone={() => setSplashDone(true)} />;
  }
  if (authScreen === 'login') {
    return <Login onSignIn={() => setAuthScreen(null)} onCreateProfile={() => setAuthScreen('create-profile')} />;
  }
  if (authScreen === 'create-profile') {
    const hasCreds = !!loadLS('oma_credentials', null);
    return <CreateProfile
      onComplete={data => {
        if (data) setProfile(p => ({ ...p, name: data.name || p.name, deities: data.deities && data.deities.length ? data.deities : p.deities }));
        setAuthScreen(null);
        setShowOnboarding(true);
      }}
      onBack={() => setAuthScreen('login')}
      hasFrame={!isMobile}
    />;
  }

  return (
    <div data-theme={theme} style={{
      width: '100%', height: '100%',
      background: 'var(--bg-page)', color: 'var(--fg-1)',
      fontFamily: 'var(--font-body)',
      display: 'flex', flexDirection: 'column',
      position: 'relative', overflow: 'hidden',
      paddingTop: isMobile ? 0 : 62, boxSizing: 'border-box',
      transition: 'background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out)',
    }}>
      {topBar}
      <div ref={scrollRef} style={{ flex: 1, overflow: 'auto', position: 'relative' }}>
        {body}
        <div style={{
          padding: '28px 16px 22px',
          textAlign: 'center',
          fontFamily: 'var(--font-mono)',
          fontSize: 9,
          letterSpacing: '0.12em',
          color: 'rgba(253,254,235,0.50)',
          userSelect: 'none',
          pointerEvents: 'none',
        }}>
          This is a concept by Katy Towell, and I'll hex you if you steal it. © {new Date().getFullYear()}
        </div>
      </div>
      {bottomBar}

      {/* Confirm modal */}
      <ConfirmModal
        state={confirmState}
        onClose={() => setConfirmState(null)}
        invertedTheme={theme === 'dark' ? 'light' : 'dark'}
      />

      {/* Onboarding overlay */}
      {showOnboarding && (
        <Onboarding name={profile.name} onDone={() => setShowOnboarding(false)} onTabChange={t => setTab(t)} />
      )}

      {/* Drawer navigation */}
      <Drawer
        open={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        activeTab={tab}
        onChangeTab={t => {
          setTab(t);
          setOpenWorkingId(null);
          setViewEntryId(null);
          setComposerOpen(false); setEditWorkingId(null);
          setEntryOpen(false);    setEditEntryId(null);
          setCabinetFormOpen(false); setEditCabinetItem(null);
        }}
        onLogOut={handleLogOut}
        theme={theme}
      />
    </div>
  );
}

window.App = App;
window.getMagicalEvents = getMagicalEvents;

  </script>

  <script type="text/babel">
    function Root() {
      const [theme, setTheme] = React.useState('dark');

      // matchMedia keeps JS in sync with CSS media queries — works correctly
      // in DevTools device emulation and on real mobile devices.
      const [isMobile, setIsMobile] = React.useState(
        () => window.matchMedia('(max-width: 599px)').matches
      );
      const [scale, setScale] = React.useState(
        () => Math.min(1, (window.innerHeight - 40) / 874)
      );

      React.useEffect(() => {
        const mq = window.matchMedia('(max-width: 599px)');
        function onMQ(e) { setIsMobile(e.matches); }
        mq.addEventListener('change', onMQ);
        return () => mq.removeEventListener('change', onMQ);
      }, []);

      React.useEffect(() => {
        function onResize() {
          setScale(Math.min(1, (window.innerHeight - 40) / 874));
        }
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // Mobile: fill the screen with no device frame
      if (isMobile) {
        return (
          <div data-theme={theme} style={{
            position: 'fixed', inset: 0,
            width: '100vw', height: '100dvh',
            background: 'var(--bg-page)',
            display: 'flex', flexDirection: 'column',
            overflow: 'hidden',
          }}>
            <App theme={theme} setTheme={setTheme} isMobile={true} />
          </div>
        );
      }

      // Desktop: show inside the iOS device frame, scaled to fit the window
      const scaledH = Math.round(874 * scale);
      const scaledW = Math.round(402 * scale);
      return (
        <div style={{ width: scaledW, height: scaledH }}>
          <div style={{ transform: `scale(${scale.toFixed(4)})`, transformOrigin: 'top left', width: 402, height: 874 }}>
            <IOSDevice width={402} height={874} dark={theme === 'dark'}>
              <App theme={theme} setTheme={setTheme} />
            </IOSDevice>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
