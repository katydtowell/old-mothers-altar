<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Old Mother's Altar</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ── design system tokens (inlined from colors_and_type.css) ── */
/* =====================================================================
   OLD MOTHER'S ALTAR — colors & type tokens
   A witchcraft spell journal & tracker. Dark slate ritual surface
   warmed by the David Palladini Aquarian Tarot (1970) palette.
   ===================================================================== */

/* ---- FONTS ---------------------------------------------------------- */

/* New Kansas — body + UI workhorse (8 weights) */
@font-face { font-family: "New Kansas"; font-weight: 100; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-Thin.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "New Kansas"; font-weight: 300; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-Light.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "New Kansas"; font-weight: 400; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-Regular.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "New Kansas"; font-weight: 500; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-Medium.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "New Kansas"; font-weight: 600; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-SemiBold.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "New Kansas"; font-weight: 700; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-Bold.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "New Kansas"; font-weight: 800; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-Black.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "New Kansas"; font-weight: 900; font-style: normal;
  src: url("./Old Mother's Altar Design System/fonts/NewKansas-Heavy.otf") format("opentype"); font-display: swap; }

/* Ohno Blazeface — display, ROMAN/UPRIGHT, 9 optical sizes.
   The "Ohno Blazeface Upright" family routes to the 16pt file (a sensible
   middle-ground for headings 18–32px). For specific size choices, use the
   per-optical-size aliases ("Ohno Blazeface 24" etc) — they now point at
   the matching roman file, not the italic. */
@font-face {
  font-family: "Ohno Blazeface Upright";
  font-style: normal;
  font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-16Point.otf") format("opentype");
  font-display: swap;
}

/* Per-optical-size aliases — roman */
@font-face { font-family: "Ohno Blazeface 12"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-12Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 14"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-14Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 16"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-16Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 18"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-18Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 24"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-24Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 36"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-36Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 48"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-48Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 60"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-60Point.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Ohno Blazeface 72"; font-style: normal; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-72Point.otf") format("opentype"); font-display: swap; }

/* Italic family — kept registered for the rare emphasis use, NOT the default.
   Uses the corresponding italic optical-size files. */
@font-face { font-family: "Ohno Blazeface Italic"; font-style: italic; font-weight: 400;
  src: url("./Old Mother's Altar Design System/fonts/OhnoBlazeface-16PointItalic.otf") format("opentype"); font-display: swap; }

:root {
  /* =================================================================
     COLOR — base palette
     ================================================================= */

  /* Ink — the altar cloth. Near-black with a dark eggplant undertone,
     ritual interior rather than cool dashboard. */
  --ink-0:        #000000;
  --ink-50:       #08060C;
  --ink-100:      #100D18;  /* page bg, deepest — deep eggplant near-black */
  --ink-200:      #1A1528;  /* card surface — dark eggplant */
  --ink-300:      #261D38;  /* elevated / hover */
  --ink-400:      #3E2F52;  /* line break */

  /* Slate — bone & taupe; the smoke that drifts off the candle.
     Was a cool cyan-gray, now a warm tarot-parchment family. */
  --slate-100:    #FFFFFF;
  --slate-200:    #FDFEEB;  /* high-contrast text on ink — bone/parchment */
  --slate-300:    #BFAA84;  /* secondary text, icons — warm taupe */
  --slate-400:    #A99378;
  --slate-500:    #7A6850;  /* eyebrow / tertiary — desaturated amber */
  --slate-600:    #524736;
  --slate-700:    #382F23;

  /* Indigo — the sigil, the sealed envelope, the action */
  --indigo-300:   #4F71C7;
  --indigo-500:   #2D4EA6;  /* primary button */
  --indigo-700:   #1F3878;
  --indigo-900:   #0F1C40;

  /* Crimson — the wound, the warning, the bound spell */
  --crimson-300:  #E84A6B;
  --crimson-500:  #D41840;
  --crimson-700:  #8C0E2A;

  /* Aquarian Tarot warm accents — lifted from Palladini 1970.
     Used sparingly for ritual tags, candle states, sigil highlights. */
  --ember:        #F35321;  /* fire, completed spell */
  --vermillion:   #C34530;  /* deeper ember */
  --saffron:      #F59823;  /* a struck match */
  --amber:        #F4AF59;  /* warm parchment glow */
  --gold:         #FFCE00;  /* offering */
  --moss:         #96A560;  /* herb, growth */
  --olive:        #976F34;  /* root, oil */
  --bone:         #FDFEEB;  /* parchment, salt circle */
  --plum:         #764883;  /* twilight */

  /* Semantic feedback */
  --success:      #00C28A;
  --warning:      #F4AF59;
  --danger:       #D41840;
  --info:         #00BCC2;

  /* =================================================================
     SEMANTIC — what the design system reaches for
     ================================================================= */

  /* surfaces */
  --bg-page:        var(--ink-100);
  --bg-surface:     var(--ink-200);
  --bg-elevated:    var(--ink-300);
  --bg-overlay:     rgba(16, 13, 24, 0.74);
  --bg-vellum:      var(--bone);       /* light-mode parchment, journal pages */

  /* foreground */
  --fg-1:           var(--slate-200);  /* primary text */
  --fg-2:           var(--slate-300);  /* secondary text */
  --fg-3:           var(--slate-400);  /* eyebrow / labels — lifted from slate-500 for contrast */
  --fg-invert:      var(--ink-100);    /* text on light surfaces */
  --fg-accent:      var(--amber);
  --fg-link:        var(--slate-200);

  /* lines — derived from warm slate-300 (#BFAA84 → rgb(191,170,132)) */
  --line-soft:      rgba(191, 170, 132, 0.10);
  --line-medium:    rgba(191, 170, 132, 0.22);
  --line-strong:    rgba(191, 170, 132, 0.45);
  --line-vellum:    rgba(16, 13, 24, 0.18);

  /* actions */
  --action-primary-bg:     var(--indigo-500);
  --action-primary-fg:     var(--bone);
  --action-primary-hover:  #3760BD;
  --action-primary-press:  var(--indigo-700);
  --action-secondary-bg:   rgba(191, 170, 132, 0.08);
  --action-secondary-fg:   var(--slate-200);
  --action-secondary-hover: rgba(191, 170, 132, 0.14);
  --action-ghost-fg:       var(--slate-200);
  --action-danger-bg:      var(--crimson-500);
  --action-danger-fg:      var(--bone);

  /* amber lives in chrome — promoted from "ritual moment" to
     "everyday active / selected" tint. Saffron / ember / moss / plum
     remain reserved for true ritual states. */
  --chrome-active-bg:      rgba(244, 175, 89, 0.14);
  --chrome-active-fg:      var(--amber);
  --chrome-active-line:    var(--amber);

  /* =================================================================
     TYPE — families, weights, scale
     ================================================================= */

  /* Display — Ohno Blazeface, roman/upright. Resolves to the 16pt optical
     file. For larger sizes use the optical-size aliases via .oma-h1/h2
     classes (each maps to the right optical file). */
  --font-display: "Ohno Blazeface Upright", "New Kansas",
                  ui-serif, Georgia, "Times New Roman", serif;
  --font-body:    "New Kansas", ui-serif, Georgia, "Times New Roman", serif;
  --font-eyebrow: "New Kansas", ui-serif, Georgia, serif;  /* tracked, uppercase */
  --font-mono:    "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  /* type scale — body-driven (1.250 minor third) */
  --t-2xs:  11px;
  --t-xs:   12px;
  --t-sm:   14px;
  --t-md:   16px;
  --t-lg:   18px;
  --t-xl:   22px;
  --t-2xl:  28px;
  --t-3xl:  36px;
  --t-4xl:  48px;
  --t-5xl:  64px;
  --t-6xl:  84px;

  /* line heights */
  --lh-tight:    1.05;
  --lh-display:  1.0;
  --lh-snug:     1.20;
  --lh-body:     1.55;
  --lh-loose:    1.70;

  /* tracking */
  --tk-eyebrow:  0.18em;
  --tk-button:   0.04em;
  --tk-tight:    -0.01em;

  /* =================================================================
     SHAPE — radii, shadow, spacing
     ================================================================= */
  --r-xs:  4px;
  --r-sm:  6px;
  --r-md:  8px;
  --r-lg:  10px;
  --r-xl:  16px;
  --r-2xl: 24px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(0,0,0,0.35), 0 0 0 1px var(--line-soft);
  --shadow-2: 0 4px 18px rgba(0,0,0,0.40), 0 0 0 1px var(--line-soft);
  --shadow-3: 0 18px 60px rgba(0,0,0,0.55), 0 0 0 1px var(--line-medium);
  --glow-indigo: 0 0 0 1px rgba(45,78,166,0.45), 0 0 24px rgba(45,78,166,0.30);
  --glow-ember:  0 0 0 1px rgba(243,83,33,0.30), 0 0 22px rgba(243,83,33,0.25);

  /* spacing — 4px grid */
  --s-0:  0;
  --s-1:  4px;
  --s-2:  8px;
  --s-3:  12px;
  --s-4:  16px;
  --s-5:  20px;
  --s-6:  24px;
  --s-7:  32px;
  --s-8:  40px;
  --s-9:  56px;
  --s-10: 72px;
  --s-11: 96px;

  /* motion */
  --ease-out:    cubic-bezier(0.20, 0.80, 0.20, 1);
  --ease-in-out: cubic-bezier(0.65, 0.05, 0.36, 1);
  --ease-candle: cubic-bezier(0.40, 0.00, 0.20, 1);
  --dur-fast:    140ms;
  --dur-base:    220ms;
  --dur-slow:    420ms;

  /* candle flame — gradient stops switch by mode so the flame reads on
     both ink (default) and parchment (light). See [data-theme="light"]. */
  --flame-1: #FFE082;
  --flame-2: var(--saffron);
  --flame-3: var(--ember);
  --flame-4: rgba(243, 83, 33, 0);
  /* candle wax — light bone on ink, deeper waxy beige on parchment */
  --wax-1: var(--bone);
  --wax-2: #E8DDC1;
  --wax-outline: rgba(0,0,0,0.35);
}

/* =====================================================================
   LIGHT MODE — parchment surface, ink text, indigo accent
   Apply by setting `data-theme="light"` on <html> or any container.
   The same brand vocabulary (ember/saffron/moss/indigo/crimson) is
   preserved; only surfaces, text and lines flip.
   ===================================================================== */
[data-theme="light"] {
  /* surfaces */
  --bg-page:      var(--bone);              /* #FDFEEB parchment */
  --bg-surface:   #FFFFFF;                  /* a brighter page-within-page */
  --bg-elevated:  #F6F4E4;                  /* softly warmed elevated */
  --bg-overlay:   rgba(253, 254, 235, 0.78);
  --bg-vellum:    var(--bone);              /* same surface */

  /* foreground */
  --fg-1:         var(--ink-100);           /* primary ink */
  --fg-2:         var(--slate-700);         /* secondary */
  --fg-3:         var(--slate-500);         /* eyebrow / labels */
  --fg-invert:    var(--bone);
  --fg-accent:    var(--vermillion);        /* warmer than indigo on parchment */
  --fg-link:      var(--indigo-700);

  /* lines */
  --line-soft:    rgba(20, 17, 13, 0.08);
  --line-medium:  rgba(20, 17, 13, 0.16);
  --line-strong:  rgba(20, 17, 13, 0.34);

  /* actions */
  --action-primary-bg:     var(--indigo-500);
  --action-primary-fg:     var(--bone);
  --action-primary-hover:  var(--indigo-700);
  --action-primary-press:  #142A60;
  --action-secondary-bg:   rgba(20, 17, 13, 0.05);
  --action-secondary-fg:   var(--ink-100);
  --action-secondary-hover: rgba(20, 17, 13, 0.10);
  --action-ghost-fg:       var(--ink-100);

  /* amber chrome accent — light-mode tuned (deeper amber for legibility on bone) */
  --chrome-active-bg:      rgba(244, 175, 89, 0.16);
  --chrome-active-fg:      var(--olive);
  --chrome-active-line:    var(--olive);

  /* elevation — light mode uses soft drop-shadows, no glow at rest */
  --shadow-1: 0 1px 2px rgba(20,20,18,0.06), 0 0 0 1px var(--line-soft);
  --shadow-2: 0 4px 14px rgba(20,20,18,0.10), 0 0 0 1px var(--line-soft);
  --shadow-3: 0 18px 50px rgba(20,20,18,0.18), 0 0 0 1px var(--line-medium);
  --glow-indigo: 0 0 0 2px rgba(45,78,166,0.30);
  --glow-ember:  0 0 0 1px rgba(243,83,33,0.45), 0 0 16px rgba(243,83,33,0.18);

  /* candle flame — deeper, more saturated so it reads on parchment */
  --flame-1: var(--saffron);
  --flame-2: var(--ember);
  --flame-3: var(--vermillion);
  --flame-4: rgba(195, 69, 48, 0);

  /* candle wax — beeswax beige with vermillion outline on parchment */
  --wax-1: #E8C892;
  --wax-2: #B8884A;
  --wax-outline: rgba(120, 60, 20, 0.45);
}

/* =====================================================================
   SEMANTIC TEXT ELEMENTS — drop-in classes
   ===================================================================== */

.oma-display {
  font-family: "Ohno Blazeface 72", var(--font-display);
  font-style: normal;
  font-weight: 400;
  font-size: var(--t-5xl);
  line-height: var(--lh-display);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--fg-1);
}
.oma-h1 {
  font-family: "Ohno Blazeface 48", var(--font-display);
  font-style: normal;
  font-weight: 400;
  font-size: var(--t-4xl);
  line-height: var(--lh-tight);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--fg-1);
}
.oma-h2 {
  font-family: "Ohno Blazeface 36", var(--font-display);
  font-style: normal;
  font-weight: 400;
  font-size: var(--t-3xl);
  line-height: var(--lh-tight);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--fg-1);
}
.oma-h3 {
  font-family: "Ohno Blazeface 24", var(--font-display);
  font-style: normal;
  font-weight: 400;
  font-size: var(--t-2xl);
  line-height: var(--lh-snug);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--fg-1);
}
.oma-h4 {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--t-xl);
  line-height: var(--lh-snug);
  color: var(--fg-1);
}
.oma-p {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: var(--t-md);
  line-height: var(--lh-body);
  color: var(--fg-1);
  text-wrap: pretty;
}
.oma-small {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: var(--t-sm);
  line-height: var(--lh-snug);
  color: var(--fg-2);
}
.oma-eyebrow {
  font-family: var(--font-eyebrow);
  font-weight: 300;
  font-size: var(--t-2xs);
  letter-spacing: var(--tk-eyebrow);
  text-transform: uppercase;
  color: var(--fg-3);
}
.oma-button-text {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--t-sm);
  letter-spacing: var(--tk-button);
  line-height: 1;
}
.oma-mono {
  font-family: var(--font-mono);
  font-size: var(--t-sm);
  letter-spacing: 0;
  color: var(--fg-2);
}
.oma-rune {
  /* For roman-numeral chapter marks etc. — display, big & airy */
  font-family: "Ohno Blazeface 72", var(--font-display);
  font-style: normal;
  font-weight: 400;
  font-size: var(--t-6xl);
  line-height: 0.9;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}

  /* ── app chrome ── */
  html, body {
    margin: 0; padding: 0;
    background: #07090A;
    font-family: var(--font-body);
    color: var(--fg-1);
  }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    padding: 20px; box-sizing: border-box;
    background:
      radial-gradient(circle at 50% 30%, rgba(45,78,166,0.10) 0%, transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(243,83,33,0.06) 0%, transparent 50%),
      #07090A;
  }
  @keyframes omaFadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes omaSheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .oma-flame { animation: omaCandle 2.4s var(--ease-candle) infinite; transform-origin: center bottom; filter: blur(0.2px); }
  @keyframes omaCandle {
    0%, 100% { transform: scaleY(1)    scaleX(1)    translateX(0); opacity: 0.95; }
    35%      { transform: scaleY(1.05) scaleX(0.95) translateX(0.5px); opacity: 1; }
    65%      { transform: scaleY(0.97) scaleX(1.03) translateX(-0.5px); opacity: 0.85; }
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
  /* On mobile: fill the screen, no centering or background needed */
  @media (max-width: 599px) {
    html, body { height: 100%; overflow: hidden; }
    body { padding: 0; background: none; display: block; }
    #root { width: 100%; height: 100%; }
    /* Zero out the IOSDevice-specific inset on mobile */
    :root { --bottom-inset: env(safe-area-inset-bottom, 0px); }
    /* Stack date/time fields vertically so they fill the width */
    .oma-date-time-row { flex-direction: column !important; }
    /* Strip native picker chrome so inputs respect container width */
    input[type="date"], input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
    }
  }
</style>
</head>
<body>

  <script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';

  };

    <div key={k} style={{
      height: 42, borderRadius: 8.5,

        position: 'absolute', inset: 0, borderRadius: 27,

        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

// ─── MOON GLYPH (8 phases) ──────────────────────────────────────────
function MoonGlyph({ phase = 'waning-gibbous', size = 22, color = 'currentColor' }) {
  // phases: new, waxing-crescent, first-quarter, waxing-gibbous,
  //         full, waning-gibbous, last-quarter, waning-crescent
  const r = size / 2;
  let face;
  switch (phase) {
    case 'new':              face = <circle cx={r} cy={r} r={r - 1} fill="none" stroke={color} strokeWidth="1.5"/>; break;
    case 'full':             face = <circle cx={r} cy={r} r={r - 1} fill={color}/>; break;
    case 'first-quarter':    face = <><circle cx={r} cy={r} r={r - 1} fill="none" stroke={color} strokeWidth="1.5"/><path d={`M${r} ${1} A ${r - 1} ${r - 1} 0 0 1 ${r} ${size - 1} Z`} fill={color}/></>; break;
    case 'last-quarter':     face = <><circle cx={r} cy={r} r={r - 1} fill="none" stroke={color} strokeWidth="1.5"/><path d={`M${r} ${1} A ${r - 1} ${r - 1} 0 0 0 ${r} ${size - 1} Z`} fill={color}/></>; break;
    case 'waxing-crescent':  face = <><circle cx={r} cy={r} r={r - 1} fill="none" stroke={color} strokeWidth="1.5"/><path d={`M${r - 2} ${1} A ${r - 1} ${r - 1} 0 0 1 ${r - 2} ${size - 1} A ${r - 3} ${r - 1} 0 0 0 ${r - 2} ${1} Z`} fill={color}/></>; break;
    case 'waxing-gibbous':   face = <><circle cx={r} cy={r} r={r - 1} fill={color}/><path d={`M${r - 3} ${1} A ${r - 1} ${r - 1} 0 0 0 ${r - 3} ${size - 1} A ${r - 6} ${r - 1} 0 0 0 ${r - 3} ${1} Z`} fill="var(--bg-page)"/></>; break;
    case 'waning-gibbous':   face = <><circle cx={r} cy={r} r={r - 1} fill={color}/><path d={`M${r + 3} ${1} A ${r - 1} ${r - 1} 0 0 1 ${r + 3} ${size - 1} A ${r - 6} ${r - 1} 0 0 1 ${r + 3} ${1} Z`} fill="var(--bg-page)"/></>; break;
    case 'waning-crescent':  face = <><circle cx={r} cy={r} r={r - 1} fill="none" stroke={color} strokeWidth="1.5"/><path d={`M${r + 2} ${1} A ${r - 1} ${r - 1} 0 0 0 ${r + 2} ${size - 1} A ${r - 3} ${r - 1} 0 0 1 ${r + 2} ${1} Z`} fill={color}/></>; break;
    default:                 face = <circle cx={r} cy={r} r={r - 1} fill={color}/>;
  }
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: 'block' }}>{face}</svg>;
}

// ─── BADGE ─────────────────────────────────────────────────────────
// Each tone carries fg (text) and dot (accent dot) separately.
// Contrast targets: all text ≥4.5:1 on composited badge bg.
function Badge({ tone = 'pending', dot = true, children, style }) {
  const tones = {
    pending: { bg: 'var(--action-secondary-bg)', fg: 'var(--fg-2)',   dot: 'var(--fg-2)' },   // ~8.9:1 ✓
    sealed:  { bg: 'rgba(0,194,138,0.14)',        fg: 'var(--success)', dot: 'var(--success)' }, // ~6.6:1 ✓
    burning: { bg: 'rgba(243,83,33,0.18)',        fg: 'var(--saffron)', dot: 'var(--ember)' },   // saffron ~6.8:1 ✓; dot stays ember
    moss:    { bg: 'rgba(244,175,89,0.22)',       fg: 'var(--moss)',   dot: 'var(--moss)' },    // moss ~4.7:1 ✓ (was --olive: 2.8:1 ✗)
    plum:    { bg: 'rgba(118,72,131,0.26)',       fg: 'var(--fg-1)',   dot: 'var(--plum)' },    // bone ~15:1 ✓ (was --plum: 2.1:1 ✗)
    amber:   { bg: 'rgba(244,175,89,0.18)',       fg: 'var(--amber)',  dot: 'var(--amber)' },   // amber ~6.9:1 ✓ (was --olive: 2.8:1 ✗)
    indigo:  { bg: 'rgba(45,78,166,0.26)',        fg: 'var(--fg-1)',   dot: 'var(--indigo-300)' }, // bone ~15:1 ✓ (was --indigo-500: 2.0:1 ✗)
  };
  const t = tones[tone] || tones.pending;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '4px 9px', borderRadius: 999,
      background: t.bg, color: t.fg,
      fontFamily: 'var(--font-body)', fontWeight: 600,
      fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase',
      lineHeight: 1, ...style,
    }}>
      {dot && <span style={{ width: 5, height: 5, borderRadius: 50, background: t.dot, display: 'inline-block' }} />}
      {children}
    </span>
  );
}

// ─── SEARCH SELECT (single or multi-select with search) ─────────────
function SearchSelect({ items, value, onChange, placeholder = 'Select…', multi = false }) {
  const [open, setOpen] = React.useState(false);
  const [q, setQ] = React.useState('');
  const [otherInput, setOtherInput] = React.useState('');
  const containerRef = React.useRef(null);

  // Close dropdown when clicking outside
  React.useEffect(() => {
    if (!open) return;
    function handleOutside(e) {
      if (containerRef.current && !containerRef.current.contains(e.target)) {
        setOpen(false);
        setQ('');
      }
    }
    document.addEventListener('mousedown', handleOutside);
    return () => document.removeEventListener('mousedown', handleOutside);
  }, [open]);

  const normalize = item =>
    typeof item === 'string' ? { key: item, label: item } : { key: item.key, label: item.label };
  const normalized = items.map(normalize);
  const filtered = normalized.filter(i => i.label.toLowerCase().includes(q.toLowerCase()));

  const isSelected = key =>
    multi ? (Array.isArray(value) && value.includes(key)) : value === key;

  // True when "Other" is the current / one of the current selections
  const otherSelected = multi
    ? (Array.isArray(value) && value.includes('Other'))
    : value === 'Other';

  // Commit the typed custom value, replacing "Other"
  function commitOther() {
    const trimmed = otherInput.trim();
    if (!trimmed) return; // nothing typed yet — leave "Other" in place
    if (multi) {
      const arr = Array.isArray(value) ? value : [];
      onChange([...arr.filter(k => k !== 'Other'), trimmed]);
    } else {
      onChange(trimmed);
    }
    setOtherInput('');
  }

  function handleSelect(key) {
    if (multi) {
      const arr = Array.isArray(value) ? value : [];
      onChange(arr.includes(key) ? arr.filter(k => k !== key) : [...arr, key]);
    } else {
      onChange(value === key ? '' : key);
      setOpen(false);
      setQ('');
    }
  }

  // All currently-selected items, including any custom values not in the list
  const knownKeys = new Set(normalized.map(i => i.key));
  const allSelected = multi
    ? (Array.isArray(value) ? value : []).map(k =>
        knownKeys.has(k) ? normalized.find(i => i.key === k) : { key: k, label: k }
      )
    : [];
  const selectedItems = multi ? allSelected : normalized.filter(i => isSelected(i.key));
  const displayText = multi
    ? selectedItems.map(i => i.label).join(', ')
    : (value && !knownKeys.has(value) ? value : (selectedItems[0]?.label || ''));

  return (
    <div ref={containerRef} style={{ position: 'relative' }}>
      <button
        onClick={() => { setOpen(o => !o); setQ(''); }}
        style={{
          width: '100%', padding: '11px 14px', boxSizing: 'border-box',
          background: 'var(--bg-page)',
          border: '1px solid var(--line-medium)',
          borderRadius: 'var(--r-xs)',
          color: selectedItems.length ? 'var(--fg-1)' : 'var(--fg-3)',
          fontFamily: 'var(--font-body)', fontSize: 14, outline: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
          textAlign: 'left',
        }}
      >
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {displayText || placeholder}
        </span>
        {React.cloneElement(Ico.chevron, { size: 14, style: {
          transform: open ? 'rotate(270deg)' : 'rotate(90deg)',
          transition: 'transform 0.18s', flexShrink: 0, color: 'var(--fg-3)',
        }})}
      </button>

      {open && (
        <div style={{
          position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 200,
          marginTop: 2,
          border: '1px solid var(--line-medium)',
          borderRadius: 'var(--r-xs)',
          background: 'var(--bg-page)',
          boxShadow: 'var(--shadow-3)',
          maxHeight: 240, display: 'flex', flexDirection: 'column',
          overflow: 'hidden',
        }}>
          <div style={{ padding: '8px 12px', borderBottom: '1px solid var(--line-soft)', flexShrink: 0 }}>
            <input
              value={q} onChange={e => setQ(e.target.value)}
              placeholder="Search…"
              style={{
                width: '100%', border: 0, background: 'transparent', outline: 0,
                color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 13, boxSizing: 'border-box',
              }}
            />
          </div>
          <div style={{ overflowY: 'auto', flex: 1 }}>
            {filtered.length === 0 ? (
              <div style={{ padding: '12px 14px', color: 'var(--fg-3)', fontSize: 13 }}>No matches</div>
            ) : filtered.map((item, i) => {
              const active = isSelected(item.key);
              return (
                <button key={item.key}
                  onMouseDown={e => e.preventDefault()}
                  onClick={() => handleSelect(item.key)}
                  style={{
                    width: '100%', padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10,
                    background: active ? 'var(--chrome-active-bg)' : 'transparent',
                    border: 0, borderTop: i === 0 ? 0 : '1px solid var(--line-soft)',
                    cursor: 'pointer', textAlign: 'left',
                    color: active ? 'var(--chrome-active-fg)' : 'var(--fg-1)',
                    fontFamily: 'var(--font-body)', fontSize: 13,
                  }}>
                  <div style={{
                    width: 16, height: 16, flexShrink: 0,
                    borderRadius: multi ? 3 : '50%',
                    background: active ? 'var(--chrome-active-fg)' : 'transparent',
                    border: '1.5px solid ' + (active ? 'var(--chrome-active-fg)' : 'var(--line-medium)'),
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {active && <span style={{ color: 'var(--bg-page)', fontSize: 9, fontWeight: 800, lineHeight: 1 }}>✓</span>}
                  </div>
                  {item.label}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {multi && selectedItems.length > 0 && (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginTop: 8 }}>
          {selectedItems.map(item => (
            <span key={item.key} style={{
              display: 'inline-flex', alignItems: 'center', gap: 4,
              padding: '3px 8px', borderRadius: 999, fontSize: 12,
              background: 'var(--chrome-active-bg)', color: 'var(--chrome-active-fg)',
              border: '1px solid var(--chrome-active-line)',
            }}>
              {item.label}
              <button onClick={e => { e.stopPropagation(); handleSelect(item.key); }} style={{
                background: 'none', border: 0, cursor: 'pointer', padding: 0,
                lineHeight: 1, color: 'inherit', fontSize: 15, display: 'flex', alignItems: 'center',
              }}>×</button>
            </span>
          ))}
        </div>
      )}

      {/* When "Other" is selected, show an inline text input to capture the custom value */}
      {otherSelected && (
        <input
          autoFocus
          value={otherInput}
          onChange={e => setOtherInput(e.target.value)}
          onBlur={commitOther}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commitOther(); } }}
          placeholder="Describe your custom option…"
          style={{
            marginTop: 8, width: '100%', boxSizing: 'border-box',
            padding: '9px 12px',
            background: 'var(--bg-page)',
            border: '1px solid var(--line-medium)',
            borderRadius: 'var(--r-xs)',
            color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 13,
            outline: 'none',
          }}
        />
      )}

      {/* Single-select: show the same input beneath the trigger when "Other" is chosen */}
      {!multi && value === 'Other' && (
        <input
          autoFocus
          value={otherInput}
          onChange={e => setOtherInput(e.target.value)}
          onBlur={commitOther}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commitOther(); } }}
          placeholder="Describe your custom option…"
          style={{
            marginTop: 8, width: '100%', boxSizing: 'border-box',
            padding: '9px 12px',
            background: 'var(--bg-page)',
            border: '1px solid var(--line-medium)',
            borderRadius: 'var(--r-xs)',
            color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 13,
            outline: 'none',
          }}
        />
      )}
    </div>
  );
}

// ── Confirm Modal ─────────────────────────────────────────────────────────────
function ConfirmModal({ state, onClose, invertedTheme }) {
  if (!state) return null;
  const { message, confirmLabel = 'Confirm', onConfirm, isDanger = true } = state;

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 300,
      background: 'rgba(0,0,0,0.45)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: '24px',
      animation: 'omaFadeIn 180ms var(--ease-out)',
    }} onClick={onClose}>
      <div data-theme={invertedTheme} onClick={e => e.stopPropagation()} style={{
        background: 'var(--bg-surface)',
        borderRadius: 'var(--r-xl)',
        border: '1px solid var(--line-medium)',
        boxShadow: 'var(--shadow-3)',
        padding: '24px 22px 20px',
        width: '100%', maxWidth: 300,
        animation: 'omaSheetUp 260ms var(--ease-candle)',
      }}>
        <div style={{
          color: 'var(--fg-1)', fontSize: 15, fontWeight: 600,
          fontFamily: 'var(--font-body)', lineHeight: 1.5,
          marginBottom: 20,
        }}>{message}</div>
        <div style={{ display: 'flex', gap: 8 }}>
          <Btn variant="secondary" size="md" fullWidth onClick={onClose}>Cancel</Btn>
          <Btn variant="primary" size="md" fullWidth onClick={() => { onConfirm(); onClose(); }}
            style={isDanger ? { background: 'var(--crimson-300)', borderColor: 'var(--crimson-300)' } : {}}>
            {confirmLabel}
          </Btn>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, {
  Ico, MoonGlyph, Flame, Btn, IconBtn, Badge, Card, TopBar, TabBar, ThemeToggle,
  BottomBar, Drawer, SearchSelect, ConfirmModal,
});

  </script>

  { key: 'last-quarter',    label: 'Last Quarter'     },
  { key: 'waning-crescent', label: 'Waning Crescent'  },
];
const WF_CATEGORIES  = ['Protection','Love','Prosperity','Clarity','Banishing','Healing','Divination','Grounding','Communication','Luck','Other'];
const WF_MAGIC_TYPES = ['Candle','Knot','Herbal','Crystal','Sigil','Moon','Ritual','Sachet','Bath','Fire','Other'];
const WF_SEASONS     = ['Spring','Summer','Autumn','Winter'];
const WF_TIMES       = ['Dawn','Morning','Afternoon','Evening','Midnight'];
const WF_DAYS        = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

const TIMING_TABS_WF = [
  { id: 'moon',   label: 'Moon',   icoKey: 'moonIcon' },
  { id: 'season', label: 'Season', icoKey: 'sun'      },
  { id: 'time',   label: 'Time',   icoKey: 'candle'   },
  { id: 'day',    label: 'Day',    icoKey: 'calendar' },
];

function Workings({ workings, onOpenWorking, onCompose, onToggleFavorite }) {
  const [query,      setQuery]      = React.useState('');
  const [filterOpen, setFilterOpen] = React.useState(false);
  const [timingTab,  setTimingTab]  = React.useState('moon');
  const [filters,    setFilters]    = React.useState({
    cat: [], type: [], tag: [], deity: [], author: [],
    phase: [], season: [], tod: [], dow: [], favorites: false,
  });

  // Dynamic items (user-created tags / deities / authors)
  const dynTags    = React.useMemo(() => [...new Set(workings.flatMap(w => w.tags    || []))].sort(), [workings]);
  const dynDeities = React.useMemo(() => [...new Set(workings.flatMap(w => w.deities || []))].sort(), [workings]);
  const dynAuthors = React.useMemo(() => [...new Set(workings.map(w => w.author).filter(Boolean))].sort(), [workings]);

  const totalActive = Object.values(filters).reduce((n, a) => Array.isArray(a) ? n + a.length : n + (a ? 1 : 0), 0);

  function setFilter(key, val) {
    setFilters(prev => ({ ...prev, [key]: val }));
  }
  function clearAll() {
    setFilters({ cat: [], type: [], tag: [], deity: [], author: [], phase: [], season: [], tod: [], dow: [], favorites: false });
  }

  // AND across groups, OR within each group
  const filtered = workings.filter(w => {
    if (filters.favorites      && !w.favorite)                                                return false;
    if (filters.cat.length    && !filters.cat.some(v    => (w.category  || []).includes(v))) return false;
    if (filters.type.length   && !filters.type.some(v   => (w.magicType || []).includes(v))) return false;
    if (filters.tag.length    && !filters.tag.some(v    => (w.tags      || []).includes(v))) return false;
    if (filters.deity.length  && !filters.deity.some(v  => (w.deities   || []).includes(v))) return false;
    if (filters.author.length && !filters.author.includes(w.author || ''))                   return false;
    if (filters.phase.length  && !filters.phase.includes(w.moonPhase))                        return false;
    if (filters.season.length && !filters.season.some(v => (w.season    || []).includes(v))) return false;
    if (filters.tod.length    && !filters.tod.some(v    => (w.tod       || []).includes(v))) return false;
    if (filters.dow.length    && !filters.dow.some(v    => (w.dow       || []).includes(v))) return false;
    if (query && !w.name.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  const sectionLabel = txt => (
    <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: '"New Kansas", var(--font-body)', fontWeight: 300, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 8 }}>
      {txt}

  return (
    <div style={{ padding: '12px 16px 22px', display: 'flex', flexDirection: 'column', gap: 14 }}>

        <div style={{
          flex: 1, display: 'flex', alignItems: 'center', gap: 10,
          background: 'var(--bg-surface)', border: '1px solid var(--line-soft)',
          borderRadius: 'var(--r-md)', padding: '0 12px', height: 40,

          <span style={{ color: 'var(--fg-3)' }}>{React.cloneElement(Ico.search, { size: 16 })}</span>
          <input
            value={query} onChange={e => setQuery(e.target.value)}
            placeholder="Search the Grimoire…"
            autoComplete="off"
            style={{ flex: 1, border: 0, background: 'transparent', outline: 0, color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 14 }}
          />
        </div>

        <button onClick={() => setFilterOpen(o => !o)} style={{
          width: 40, height: 40, borderRadius: 'var(--r-md)', cursor: 'pointer', flexShrink: 0,
          background: filterOpen || totalActive > 0 ? 'var(--chrome-active-bg)' : 'var(--bg-surface)',
          border: '1px solid ' + (filterOpen || totalActive > 0 ? 'var(--chrome-active-line)' : 'var(--line-soft)'),
          color: filterOpen || totalActive > 0 ? 'var(--chrome-active-fg)' : 'var(--fg-2)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative',
        }}>
          {React.cloneElement(Ico.filter, { size: 17 })}
          {totalActive > 0 && (
            <span style={{
              position: 'absolute', top: 5, right: 5,
              width: 14, height: 14, borderRadius: 50,
              background: 'var(--ember)', color: '#fff',
              fontSize: 8, fontFamily: 'var(--font-mono)', fontWeight: 700,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>{totalActive}</span>
          )}
        </button>
      </div>

      {/* ── Filter panel — in normal document flow so SearchSelect dropdowns aren't clipped ── */}
      {filterOpen && (
        <div style={{
          background: 'var(--bg-surface)', border: '1px solid var(--line-medium)',
          borderRadius: 'var(--r-lg)', padding: '16px',
          display: 'flex', flexDirection: 'column', gap: 16,
        }}>

          {/* Favorites */}
          <div>
            {sectionLabel('QUICK FILTER')}
            <button
              onClick={() => setFilters(prev => ({ ...prev, favorites: !prev.favorites }))}
              style={{

  <script type="text/babel">
// TheBook.jsx — journal entries

function TheBook({ entries, workings, onWrite, onOpenEntry }) {
  const [query,      setQuery]      = React.useState('');
  const [filterOpen, setFilterOpen] = React.useState(false);
  const [filters,    setFilters]    = React.useState({
    status: [], spell: [], type: [], cat: [],
  });
  const [dateFrom, setDateFrom] = React.useState('');
  const [dateTo,   setDateTo]   = React.useState('');

  const statusTone = { Pending: 'amber', Ongoing: 'pending', Active: 'pending', Completed: 'sealed' };

  // Derive option lists from live data
  const presentStatuses = React.useMemo(
    () => [...new Set(entries.filter(e => e.status).map(e => e.status))].sort(),
    [entries]
  );
  const presentSpells = React.useMemo(
    () => [...new Set(entries.filter(e => e.workingName).map(e => e.workingName))].sort(),
    [entries]
  );
  // magicType + category come from the linked workings
  const presentTypes = React.useMemo(() => {
    const ids = new Set(entries.map(e => e.workingId).filter(Boolean));
    return [...new Set((workings || []).filter(w => ids.has(w.id)).flatMap(w => w.magicType || []))].sort();
  }, [entries, workings]);
  const presentCats = React.useMemo(() => {
    const ids = new Set(entries.map(e => e.workingId).filter(Boolean));
    return [...new Set((workings || []).filter(w => ids.has(w.id)).flatMap(w => w.category || []))].sort();
  }, [entries, workings]);

  const totalActive = Object.values(filters).reduce((n, a) => n + a.length, 0) + ((dateFrom || dateTo) ? 1 : 0);

  // Moon cycle count since first entry (synodic months elapsed)
  const moonCycles = React.useMemo(() => {
    if (!entries || entries.length === 0) return 1;
    const dates = entries.map(e => new Date(e.date || e.createdAt || e.ts)).filter(d => !isNaN(d));
    if (dates.length === 0) return 1;
    const earliest = new Date(Math.min(...dates));
    const synodic = 29.530588853;
    const elapsed = (Date.now() - earliest.getTime()) / (1000 * 60 * 60 * 24);
    return Math.max(1, Math.floor(elapsed / synodic));
  }, [entries]);

  // Current moon phase (same formula used elsewhere in the app)
  const currentMoonPhase = React.useMemo(() => {
    const PHASES = ['new','waxing-crescent','first-quarter','waxing-gibbous','full','waning-gibbous','last-quarter','waning-crescent'];
    const known = new Date('2000-01-06T18:14:00Z');
    const synodic = 29.530588853;
    const diff = ((Date.now() - known.getTime()) / (1000 * 60 * 60 * 24) % synodic + synodic) % synodic;
    return PHASES[Math.floor((diff / synodic) * 8) % 8];
  }, []);

  function setFilter(key, val) { setFilters(prev => ({ ...prev, [key]: val })); }
  function clearAll() { setFilters({ status: [], spell: [], type: [], cat: [] }); setDateFrom(''); setDateTo(''); }

  function previewText(e) {
    if (e.notes && e.notes.length > 0) return e.notes[e.notes.length - 1].text;
    return e.body || '';
  }

  const filtered = React.useMemo(() => entries.filter(e => {
    if (filters.status.length && !filters.status.includes(e.status)) return false;
    if (filters.spell.length  && !filters.spell.includes(e.workingName)) return false;
    if (filters.type.length || filters.cat.length) {
      const w = (workings || []).find(w => w.id === e.workingId);
      if (filters.type.length && !filters.type.some(v => (w?.magicType || []).includes(v))) return false;
      if (filters.cat.length  && !filters.cat.some(v  => (w?.category  || []).includes(v))) return false;
    }
    if (dateFrom || dateTo) {
      const d = new Date(e.date || e.createdAt || e.ts);
      if (isNaN(d)) return false;
      const dayStr = d.toISOString().slice(0, 10);
      if (dateFrom && dayStr < dateFrom) return false;
      if (dateTo   && dayStr > dateTo)   return false;
    }
    if (query) {
      const q = query.toLowerCase();
      const text = previewText(e).toLowerCase();
      if (!e.title?.toLowerCase().includes(q) && !text.includes(q) && !e.workingName?.toLowerCase().includes(q)) return false;
    }
    return true;
  }), [entries, workings, filters, dateFrom, dateTo, query]);

  const sectionLabel = txt => (
    <div style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: '"New Kansas", var(--font-body)', fontWeight: 300, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 8 }}>
      {txt}
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>
      {/* ── Search + filter button row ── */}
      <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--line-soft)', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ display: 'flex', gap: 8 }}>
          <div style={{
            flex: 1, display: 'flex', alignItems: 'center', gap: 10,
            background: 'var(--bg-surface)', border: '1px solid var(--line-soft)',
            borderRadius: 'var(--r-md)', padding: '0 12px', height: 40,
          }}>
            <span style={{ color: 'var(--fg-3)' }}>{React.cloneElement(Ico.search, { size: 16 })}</span>
            <input value={query} onChange={ev => setQuery(ev.target.value)}
              placeholder="Search the Journal…" autoComplete="off"
              style={{ flex: 1, border: 0, background: 'transparent', outline: 0, color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 14 }}
            />
          </div>
          <button onClick={() => setFilterOpen(o => !o)} style={{
            width: 40, height: 40, borderRadius: 'var(--r-md)', cursor: 'pointer', flexShrink: 0,
            background: filterOpen || totalActive > 0 ? 'var(--chrome-active-bg)' : 'var(--bg-surface)',
            border: '1px solid ' + (filterOpen || totalActive > 0 ? 'var(--chrome-active-line)' : 'var(--line-soft)'),
            color: filterOpen || totalActive > 0 ? 'var(--chrome-active-fg)' : 'var(--fg-2)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative',
          }}>
            {React.cloneElement(Ico.filter, { size: 17 })}
            {totalActive > 0 && (
              <span style={{
                position: 'absolute', top: 5, right: 5,
                width: 14, height: 14, borderRadius: 50,
                background: 'var(--ember)', color: '#fff',
                fontSize: 8, fontFamily: 'var(--font-mono)', fontWeight: 700,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>{totalActive}</span>
            )}
          </button>
        </div>

        {/* ── Filter panel ── */}
        {filterOpen && (
          <div style={{
            background: 'var(--bg-surface)', border: '1px solid var(--line-medium)',
            borderRadius: 'var(--r-lg)', padding: '16px',
            display: 'flex', flexDirection: 'column', gap: 16,
          }}>
            {presentStatuses.length > 0 && (
              <div>
                {sectionLabel('STATUS')}
                <SearchSelect items={['Active','Pending','Ongoing','Completed'].filter(s => presentStatuses.includes(s))}
                  value={filters.status} onChange={v => setFilter('status', v)} multi placeholder="Any status…" />
              </div>
            )}
            {presentSpells.length > 0 && (
              <div>
                {sectionLabel('SPELL')}
                <SearchSelect items={presentSpells}
                  value={filters.spell} onChange={v => setFilter('spell', v)} multi placeholder="Any spell…" />
              </div>
            )}
            {presentTypes.length > 0 && (
              <div>
                {sectionLabel('MAGIC TYPE')}
                <SearchSelect items={presentTypes}
                  value={filters.type} onChange={v => setFilter('type', v)} multi placeholder="Any magic type…" />
              </div>
            )}
            {presentCats.length > 0 && (
              <div>
                {sectionLabel('SPELL CATEGORY')}
                <SearchSelect items={presentCats}
                  value={filters.cat} onChange={v => setFilter('cat', v)} multi placeholder="Any category…" />
              </div>
            )}
            <div>
              {sectionLabel('DATE RANGE')}
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)}
                  max={dateTo || undefined}
                  style={{
                    flex: 1, background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
                    borderRadius: 'var(--r-xs)', padding: '8px 10px',
                    color: dateFrom ? 'var(--fg-1)' : 'var(--fg-3)',
                    fontFamily: 'var(--font-body)', fontSize: 13, outline: 'none',
                    colorScheme: 'dark',
                  }} />
                <span style={{ color: 'var(--fg-3)', fontSize: 12, flexShrink: 0 }}>to</span>
                <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)}
                  min={dateFrom || undefined}
                  style={{
                    flex: 1, background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
                    borderRadius: 'var(--r-xs)', padding: '8px 10px',
                    color: dateTo ? 'var(--fg-1)' : 'var(--fg-3)',
                    fontFamily: 'var(--font-body)', fontSize: 13, outline: 'none',
                    colorScheme: 'dark',
                  }} />
              </div>
            </div>
            <div style={{
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              paddingTop: 8, borderTop: '1px solid var(--line-soft)',
            }}>
              <button onClick={clearAll} style={{
                background: 'none', border: 0, cursor: 'pointer', padding: '4px 0',
                color: totalActive > 0 ? 'var(--ember)' : 'var(--fg-3)',
                fontFamily: 'var(--font-body)', fontSize: 12,
              }}>
                {totalActive > 0 ? `Clear all (${totalActive})` : 'Clear all'}
              </button>
              <Btn variant="primary" size="sm" onClick={() => setFilterOpen(false)}>Done</Btn>
            </div>
          </div>
        )}

        {/* Active filter summary */}
        {totalActive > 0 && !filterOpen && (
          <div style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)' }}>
            {filtered.length} {filtered.length === 1 ? 'entry' : 'entries'} · {totalActive} {totalActive === 1 ? 'filter' : 'filters'} active
          </div>
        )}
      </div>

      {/* Introduction card */}
      <div style={{ padding: '14px 16px 0' }}>
        <div style={{
          padding: '20px 20px 22px',
          borderRadius: 'var(--r-xl)',
          background: 'radial-gradient(circle at 80% 0%, rgba(243,83,33,0.10) 0%, transparent 60%), var(--bg-surface)',
          border: '1px solid var(--line-soft)',
          position: 'relative', overflow: 'hidden',
          marginBottom: 16,
        }}>
          <div style={{
            position: 'absolute', top: -8, right: -8,
            pointerEvents: 'none', opacity: 0.10,
          }}>
            <MoonGlyph phase={currentMoonPhase} size={160} color="rgba(244,175,89,1)" />
          </div>
          <div style={{
            fontFamily: '"Ohno Blazeface 24", var(--font-display)', fontStyle: 'normal', fontWeight: 400,
            textTransform: 'uppercase', letterSpacing: '0.02em',
            fontSize: 26, lineHeight: 1.05, color: 'var(--fg-1)', maxWidth: 280,
          }}>Your Book of Shadows</div>
          <div style={{ color: 'var(--fg-2)', fontSize: 13, marginTop: 10, lineHeight: 1.55, maxWidth: 320 }}>
            {entries.length} {entries.length === 1 ? 'entry' : 'entries'} recorded
            {entries.filter(e => e.status === 'Completed').length > 0
              ? ` · ${entries.filter(e => e.status === 'Completed').length} completed`
              : ''}.
          </div>
          {onWrite && (
            <div style={{ marginTop: 14 }}>
              <Btn variant="primary" size="sm" icon={Ico.penTool} onClick={onWrite}>
                Write an Entry
              </Btn>
            </div>
          )}
        </div>
      </div>

      {/* Entries list */}
      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '48px 24px', color: 'var(--fg-3)' }}>
          <div style={{ fontSize: 32, marginBottom: 12 }}>✦</div>
          <div style={{ fontSize: 16, fontWeight: 600, color: 'var(--fg-2)', marginBottom: 6 }}>
            {entries.length === 0 ? 'The journal is empty' : 'No entries match'}
          </div>
          <div style={{ fontSize: 13, marginBottom: 16 }}>
            {entries.length === 0 ? 'Start recording your workings and observations.' : 'Try a different search or filter.'}
          </div>
          {entries.length === 0 && onWrite && (
            <Btn variant="primary" size="md" icon={Ico.penTool} onClick={onWrite}>Write an Entry</Btn>
          )}
        </div>
      ) : (
        <div style={{ padding: '0 16px 22px' }}>
          {filtered.map((e, idx) => (
            <button key={e.id} onClick={() => onOpenEntry && onOpenEntry(e.id)}
              style={{
                width: '100%', background: 'none', border: 0, cursor: onOpenEntry ? 'pointer' : 'default',
                textAlign: 'left', padding: 0,
              }}>
              <div style={{ display: 'flex', gap: 14, paddingBottom: 16 }}>
                {/* Date column */}
                <div style={{ flex: '0 0 36px', display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 4 }}>
                  <div style={{
                    fontFamily: '"Ohno Blazeface 24", var(--font-display)', fontStyle: 'normal', fontWeight: 400,
                    textTransform: 'uppercase', fontSize: 22, color: 'var(--amber)', lineHeight: 1,
                  }}>{e.romanDay}</div>
                  <div style={{ color: 'var(--fg-3)', fontSize: 9, fontFamily: 'var(--font-mono)', letterSpacing: '0.1em', marginTop: 4 }}>
                    {e.month}
                  </div>
                  {idx < filtered.length - 1 && (
                    <div style={{ flex: 1, width: 1, background: 'var(--line-soft)', marginTop: 10 }} />
                  )}
                </div>
                {/* Content */}
                <div style={{ flex: 1, paddingBottom: 8 }}>
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 6, flexWrap: 'wrap' }}>
                    {e.status && <Badge tone={statusTone[e.status] || 'pending'} dot={false}>{e.status}</Badge>}
                    <span style={{ color: 'var(--fg-3)', fontSize: 10, fontFamily: 'var(--font-mono)' }}>{e.time}</span>
                  </div>
                  <div style={{
                    fontFamily: '"Ohno Blazeface 18", var(--font-display)', fontStyle: 'normal', fontWeight: 400,
                    textTransform: 'uppercase', letterSpacing: '0.02em',
                    fontSize: 18, lineHeight: 1.1, color: 'var(--fg-1)',
                  }}>{e.title}</div>
                  <div style={{ color: 'var(--fg-2)', fontSize: 13, lineHeight: 1.55, marginTop: 6, textWrap: 'pretty',
                    overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical',
                  }}>
                    {previewText(e)}
                  </div>
                  {e.notes && e.notes.length > 1 && (
                    <div style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)', marginTop: 6 }}>
                      {e.notes.length} notes
                    </div>
                  )}
                  {e.workingName && (
                    <div style={{ color: 'var(--fg-3)', fontSize: 11, fontFamily: 'var(--font-mono)', marginTop: 6, letterSpacing: '0.04em' }}>
                      — {e.workingName}
                    </div>
                  )}
                  {e.result && (
                    <div style={{
                      marginTop: 8, padding: '8px 10px',
                      borderRadius: 'var(--r-xs)', background: 'rgba(0,194,138,0.08)',
                      border: '1px solid rgba(0,194,138,0.20)',
                      color: 'var(--success)', fontSize: 12, lineHeight: 1.5,
                    }}>
                      <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.06em', marginRight: 6 }}>RESULT</span>
                      {e.result}
                    </div>
                  )}
                </div>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

window.TheBook = TheBook;

  </script>

  <!-- ── Cabinet.jsx ── -->
  <script type="text/babel">
// Cabinet.jsx — ingredient / supply inventory

const RITUAL_COLORS = [
  { name: 'White',   hex: '#F5F5F0' },
  { name: 'Black',   hex: '#1C1C1C' },
  { name: 'Red',     hex: '#C0271D' },
  { name: 'Green',   hex: '#2D7A3A' },
  { name: 'Yellow',  hex: '#D4A017' },
  { name: 'Blue',    hex: '#1E4FA0' },
  { name: 'Purple',  hex: '#6B3FA0' },
  { name: 'Orange',  hex: '#D96B0A' },
  { name: 'Pink',    hex: '#D4618A' },
  { name: 'Brown',   hex: '#7A4A2A' },
  { name: 'Silver',  hex: '#A0A8B0' },
  { name: 'Gold',    hex: '#C8A430' },
];

const CAB_TYPES = [
  { id: 'herb',    label: 'Herb',     emoji: '🌿' },
  { id: 'crystal', label: 'Crystal',  emoji: '💎' },
  { id: 'candle',  label: 'Candle',   emoji: '🕯️' },
  { id: 'incense', label: 'Incense',  emoji: '🌫️' },
  { id: 'cord',    label: 'Cord',     emoji: '🪢' },
  { id: 'oil',     label: 'Oil',      emoji: '🫙' },
  { id: 'paper',   label: 'Paper',    emoji: '📄' },
  { id: 'other',   label: 'Other',    emoji: '✨' },
];

// Module-level custom types store — updated by App whenever profile changes
let _customCabTypes = [];
window._setCustomCabTypes = function(types) { _customCabTypes = types || []; };
function getAllCabTypes() {
  const base = CAB_TYPES.filter(t => t.id !== 'other');
  const other = CAB_TYPES.find(t => t.id === 'other');
  return [...base, ..._customCabTypes, other];
}
function typeEmoji(typeId) {
  return getAllCabTypes().find(t => t.id === typeId)?.emoji || '✨';
}
function typeLabel(typeId) {
  return getAllCabTypes().find(t => t.id === typeId)?.label || typeId || 'Other';
}

// ── Cabinet type single-select with emoji icons and custom "Other" flow ────────
function CabinetTypeSelect({ value, onChange, allTypes, onAddCustomType }) {
  const [open, setOpen]             = React.useState(false);
  const [q, setQ]                   = React.useState('');
  const [otherMode, setOtherMode]   = React.useState(false);
  const [otherLabel, setOtherLabel] = React.useState('');
  const containerRef = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    function h(e) {
      if (containerRef.current && !containerRef.current.contains(e.target)) {
        setOpen(false); setQ('');
      }
    }
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const filtered = allTypes.filter(t =>
    !q || t.label.toLowerCase().includes(q.toLowerCase())
  );

  function select(typeId) {
    if (typeId === 'other') { setOtherMode(true); setOpen(false); setQ(''); return; }
    onChange([typeId]);
    setOpen(false); setQ('');
  }

  function commitOther() {
    const label = otherLabel.trim();
    if (!label) { setOtherMode(false); setOtherLabel(''); return; }
    const id = 'custom_' + Date.now();
    onAddCustomType({ id, label, emoji: '✨' });
    onChange([id]);
    setOtherMode(false); setOtherLabel('');
  }

  const selected = allTypes.find(x => x.id === value[0]);
  const triggerText = selected ? `${selected.emoji} ${selected.label}` : '';

  const fieldBase = {
    background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
    borderRadius: 'var(--r-xs)', padding: '10px 12px',
    color: 'var(--fg-1)', fontFamily: 'var(--font-body)',
    fontSize: 13, outline: 'none', width: '100%', boxSizing: 'border-box',
  };

  return (
    <div ref={containerRef} style={{ position: 'relative' }}>
      {/* Trigger */}
      <button
        onClick={() => { setOpen(o => !o); setQ(''); }}
        style={{
          width: '100%', padding: '11px 14px', boxSizing: 'border-box',
          background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
          borderRadius: 'var(--r-xs)',
          color: value.length ? 'var(--fg-1)' : 'var(--fg-3)',
          fontFamily: 'var(--font-body)', fontSize: 14, outline: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
          textAlign: 'left',
        }}
      >
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {triggerText || 'Select type…'}
        </span>
        {React.cloneElement(Ico.chevron, { size: 14, style: {
          transform: open ? 'rotate(270deg)' : 'rotate(90deg)',
          transition: 'transform 0.18s', flexShrink: 0, color: 'var(--fg-3)',
        }})}
      </button>

      {/* Dropdown */}
      {open && (
        <div style={{
          position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 200,
          marginTop: 2, border: '1px solid var(--line-medium)',
          borderRadius: 'var(--r-xs)', background: 'var(--bg-page)',
          boxShadow: 'var(--shadow-3)', maxHeight: 260,
          display: 'flex', flexDirection: 'column', overflow: 'hidden',
        }}>
          <div style={{ padding: '8px 12px', borderBottom: '1px solid var(--line-soft)', flexShrink: 0 }}>
            <input value={q} onChange={e => setQ(e.target.value)}
              placeholder="Search…"
              style={{ width: '100%', border: 0, background: 'transparent', outline: 0,
                color: 'var(--fg-1)', fontFamily: 'var(--font-body)', fontSize: 13 }} />
          </div>
          <div style={{ overflowY: 'auto', flex: 1 }}>
            {filtered.length === 0
              ? <div style={{ padding: '12px 14px', color: 'var(--fg-3)', fontSize: 13 }}>No matches</div>
              : filtered.map((t, i) => {
                const active = value[0] === t.id;
                return (
                  <button key={t.id}
                    onMouseDown={e => e.preventDefault()}
                    onClick={() => select(t.id)}
                    style={{
                      width: '100%', padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10,
                      background: active ? 'var(--chrome-active-bg)' : 'transparent',
                      border: 0, borderTop: i === 0 ? 0 : '1px solid var(--line-soft)',
                      cursor: 'pointer', textAlign: 'left',
                      color: active ? 'var(--chrome-active-fg)' : 'var(--fg-1)',
                      fontFamily: 'var(--font-body)', fontSize: 13,
                    }}>
                    <span style={{ fontSize: 18, flexShrink: 0 }}>{t.emoji}</span>
                    <span>{t.label}</span>
                  </button>
                );
              })
            }
          </div>
        </div>
      )}

      {/* "Other" custom type form */}
      {otherMode && (
        <div style={{
          marginTop: 10, padding: '14px', borderRadius: 'var(--r-xs)',
          background: 'var(--bg-surface)', border: '1px solid var(--line-medium)',
          display: 'flex', flexDirection: 'column', gap: 10,
        }}>
          <div style={{ fontSize: 11, color: 'var(--fg-3)', fontFamily: 'var(--font-mono)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>
            New Supply Type
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <span style={{ fontSize: 20, flexShrink: 0, width: 32, textAlign: 'center', lineHeight: 1 }}>✨</span>
            <input
              autoFocus
              value={otherLabel}
              onChange={e => setOtherLabel(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commitOther(); } }}
              placeholder="Type name (e.g. Selenite Wand)"
              style={{ ...fieldBase, flex: 1 }}
            />
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn variant="secondary" size="sm" onClick={() => { setOtherMode(false); setOtherLabel(''); }}>
              Cancel
            </Btn>
            <Btn variant="primary" size="sm" onClick={commitOther}>Add Type</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Cabinet item form ─────────────────────────────────────────────────────────
function CabinetForm({ item, onSave, onDelete, submitRef, allCabTypes, onAddCustomType }) {
  const [name,      setName]      = React.useState('');
  const [types,     setTypes]     = React.useState(['herb']);
  const [color,     setColor]     = React.useState('');
  const [colorMode, setColorMode] = React.useState('preset'); // 'preset' | 'custom'
  const [inv,       setInv]       = React.useState('');
  const [note,      setNote]      = React.useState('');

  React.useEffect(() => {
    setName(item?.name || '');
    // Migrate: item.types (array) or fall back to [item.type]
    setTypes(item?.types || (item?.type ? [item.type] : ['herb']));
    const c = item?.color || '';
    const isPreset = RITUAL_COLORS.some(rc => rc.name === c);
    setColor(c);
    setColorMode(c && !isPreset ? 'custom' : 'preset');
    setInv(item?.inv != null ? String(item.inv) : '');
    setNote(item?.note || '');
  }, []);

  const field = {
    background: 'var(--bg-page)', border: '1px solid var(--line-medium)',
    borderRadius: 'var(--r-xs)', padding: '11px 14px',
    color: 'var(--fg-1)', fontFamily: 'var(--font-body)',
    fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box',
  };

  function handleSave() {
    if (!name.trim()) return;
    onSave({
      id: item?.id || Date.now().toString(),
      name: name.trim(),
      types,
      type: types[0] || 'other', // backward-compat primary
      color: color.trim() || null,
      inv: inv !== '' ? parseInt(inv) : null,
      note: note.trim(),
    });
  }

  if (submitRef) submitRef.current = handleSave;

  return (
    <div style={{ padding: '14px 18px 22px', display: 'flex', flexDirection: 'column', gap: 16 }}>

        {/* Type multiselect */}
        <div>
          <span className="oma-eyebrow" style={{ fontSize: 10, display: 'block', marginBottom: 8 }}>Type</span>
          <CabinetTypeSelect
            value={types}
            onChange={setTypes}
            allTypes={allCabTypes}
            onAddCustomType={onAddCustomType}
          />
        </div>

        {/* Name */}
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="oma-eyebrow" style={{ fontSize: 10 }}>Name</span>
          <input value={name} onChange={e => setName(e.target.value)} autoComplete="off"
            placeholder={`e.g. ${types[0] === 'herb' ? 'Mugwort, Bay Laurel…' : types[0] === 'crystal' ? 'Rose Quartz, Pyrite…' : types[0] === 'candle' ? 'White Pillar, Black Taper…' : 'Name this item…'}`}
            style={{ ...field }} />
        </label>

        {/* Color swatches — candle and cord only */}
        {(types.includes('candle') || types.includes('cord')) && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <span className="oma-eyebrow" style={{ fontSize: 10 }}>Color (optional)</span>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {RITUAL_COLORS.map(rc => {
                const sel = colorMode === 'preset' && color === rc.name;
                return (
                  <button key={rc.name} title={rc.name} onClick={() => { setColor(rc.name); setColorMode('preset'); }} style={{
                    width: 32, height: 32, borderRadius: 50, cursor: 'pointer', flexShrink: 0,
                    background: rc.hex,
                    border: sel ? '2.5px solid var(--fg-1)' : '2px solid var(--line-medium)',
                    boxShadow: sel ? '0 0 0 2px var(--bg-surface), 0 0 0 4px var(--fg-1)' : 'none',
                    outline: 0, transition: 'box-shadow 120ms',
                    position: 'relative',
                  }}>
                    {sel && (
                      <span style={{
                        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                        color: rc.hex === '#F5F5F0' ? '#333' : '#fff', fontSize: 13, fontWeight: 700,
                      }}>✓</span>
                    )}
                  </button>
                );
              })}
              {/* Custom option */}
              <button title="Custom color" onClick={() => { setColorMode('custom'); setColor(''); }} style={{
                width: 32, height: 32, borderRadius: 50, cursor: 'pointer', flexShrink: 0,
                background: 'var(--bg-page)',
                border: colorMode === 'custom' ? '2px solid var(--fg-1)' : '1.5px dashed var(--line-medium)',
                outline: 0, fontSize: 15,
              }}>✏️</button>
            </div>
            {/* Selected preset name or custom input */}
            {colorMode === 'preset' && color && (
              <div style={{ color: 'var(--fg-2)', fontSize: 12 }}>{color}</div>
            )}
            {colorMode === 'custom' && (
              <input value={color} onChange={e => setColor(e.target.value)} autoComplete="off"
                placeholder="Custom color name…" style={{ ...field }} />
            )}
            {(colorMode === 'preset' && color) || colorMode === 'custom' ? (
              <button onClick={() => { setColor(''); setColorMode('preset'); }} style={{
                background: 'none', border: 0, cursor: 'pointer', textAlign: 'left',
                color: 'var(--fg-3)', fontSize: 11, padding: 0,
              }}>Clear color</button>
            ) : null}
          </div>
        )}

        {/* Inventory */}
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="oma-eyebrow" style={{ fontSize: 10 }}>Quantity on hand (optional)</span>
          <input type="number" min="0" value={inv} onChange={e => setInv(e.target.value)}
            placeholder="Leave blank if not tracking" style={{ ...field }} />
        </label>

        {/* Note */}
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="oma-eyebrow" style={{ fontSize: 10 }}>Note (optional)</span>
          <input value={note} onChange={e => setNote(e.target.value)} autoComplete="off"
            placeholder="e.g. dried, fresh, color, size…" style={{ ...field }} />
        </label>

        {/* Delete — edit only */}
        {item && (
          <Btn variant="ghost" size="sm" fullWidth onClick={() => {
            window.showConfirm(`Remove "${item.name}" from the cabinet?`, () => onDelete(item.id), 'Remove');
          }} style={{ color: 'var(--crimson-300)', fontSize: 12 }}>
            Remove from cabinet
          </Btn>
        )}
    </div>
  );
}

// ── Cabinet main view ───────────────────────────────────────────────────────
function Cabinet({ cabinet, onAdd, onEditItem, allCabTypes }) {
  const [search,     setSearch]    = React.useState('');
  const [typeFilter, setTypeFilter] = React.useState([]);
  const [filterOpen, setFilterOpen] = React.useState(false);
  const filterRef = React.useRef(null);

  const field = {
    background: 'var(--bg-surface)', border: '1px solid var(--line-soft)',
    borderRadius: 'var(--r-pill)', padding: '9px 16px',
    color: 'var(--fg-1)', fontFamily: 'var(--font-body)',
    fontSize: 14, outline: 'none', width: '100%', boxSizing: 'border-box',
  };

  // Close filter on click outside
  React.useEffect(() => {
    if (!filterOpen) return;
    function handleDown(e) {
      if (filterRef.current && !filterRef.current.contains(e.target)) setFilterOpen(false);
    }
    document.addEventListener('mousedown', handleDown);
    return () => document.removeEventListener('mousedown', handleDown);
  }, [filterOpen]);

  // Derive present types across all items (items may have multiple types)
  const presentTypes = [...new Set(cabinet.flatMap(c => c.types || (c.type ? [c.type] : ['other'])))];
  const typeItems = presentTypes.map(t => ({ key: t, label: typeEmoji(t) + ' ' + typeLabel(t) }));

  const filtered = cabinet.filter(c => {
    const matchSearch = !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.note?.toLowerCase().includes(search.toLowerCase());
    const matchFilter = typeFilter.length === 0 || typeFilter.includes(c.type);
    return matchSearch && matchFilter;
  });

  // Group by all types — an item with multiple types appears in each group
  const grouped = {};
  filtered.forEach(c => {
    const itemTypes = c.types || (c.type ? [c.type] : ['other']);
    itemTypes.forEach(typeId => {
      if (!grouped[typeId]) grouped[typeId] = [];
      grouped[typeId].push(c);
    });
  });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>
      {/* Search + filter */}
      <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--line-soft)' }}>
        <div ref={filterRef} style={{ position: 'relative' }}>
          <div style={{ display: 'flex', gap: 8 }}>
            {/* Search */}
            <input value={search} onChange={e => setSearch(e.target.value)} autoComplete="off"
              placeholder="Search stores…" style={{ ...field, flex: 1 }} />
            {/* Filter button */}
            {typeItems.length > 0 && (
              <button onClick={() => setFilterOpen(o => !o)} style={{
                width: 40, height: 40, borderRadius: 'var(--r-md)', cursor: 'pointer', flexShrink: 0,
                background: filterOpen || typeFilter.length > 0 ? 'var(--chrome-active-bg)' : 'var(--bg-surface)',
