<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Dialog</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body {
    color: var(--fg-1); padding: 30px; box-sizing: border-box; font-family: var(--font-body);
    background: radial-gradient(ellipse at center, rgba(45,78,166,0.06) 0%, var(--bg-page) 70%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .dialog {
    width: 460px; background: var(--bg-surface);
    border-radius: var(--r-xl); border: 1px solid var(--line-soft);
    box-shadow: var(--shadow-3); overflow: hidden;
  }
  .head, .foot {
    padding: 18px 22px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .foot { border-bottom: 0; border-top: 1px solid var(--line-soft); justify-content: flex-end; gap: 8px; }
  .title { font-family: "Ohno Blazeface 24", var(--font-display); font-style: normal; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; font-size: 20px; color: var(--fg-1); }
  .close { color: var(--fg-2); font-size: 18px; cursor: pointer; }
  .body { padding: 20px 22px; color: var(--fg-2); font-size: 14px; line-height: 1.55; }
  .body strong { color: var(--fg-1); font-weight: 600; }
  .btn {
    font-family: var(--font-body); font-weight: 600; font-size: 13px; letter-spacing: 0.04em;
    border: 0; cursor: pointer; line-height: 1; border-radius: var(--r-sm);
    padding: 9px 16px;
  }
  .btn-secondary { background: var(--action-secondary-bg); color: var(--action-secondary-fg); border: 1px solid var(--line-soft); }
  .btn-danger { background: var(--action-danger-bg); color: var(--action-danger-fg); }
</style>
</head>
<body>
  <div class="dialog">
    <div class="head">
      <div class="title">Break This Binding?</div>
      <div class="close">✕</div>
    </div>
    <div class="body">
      Breaking <strong>Salt for the Threshold</strong> will remove its seal and unlink its
      VII cast entries from the book. This cannot be undone.
    </div>
    <div class="foot">
      <button class="btn btn-secondary">Keep It</button>
      <button class="btn btn-danger">Break the Binding</button>
    </div>
  </div>
</body>
</html>
