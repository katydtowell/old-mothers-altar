<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    min-height: 240px;
  }
  .panel {
    padding: 22px 26px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 12px;
    justify-content: space-between;
  }
  .dark  { background: var(--ink-100); }
  .dark .label, .dark .caption { color: var(--slate-300); }
  .light { background: var(--bone); }
  .light .label, .light .caption { color: var(--slate-700); }
  .light .label { color: var(--slate-500); }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .logo-stage { flex: 1; display: flex; align-items: center; justify-content: center; }
  .logo-stage img { width: 78%; max-width: 280px; display: block; }
  .caption { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="panel dark">
    <span class="label">DARK MODE</span>
    <div class="logo-stage"><img src="../assets/logo-dark.svg" alt="Old Mother's Altar — dark" /></div>
    <span class="caption">assets/logo-dark.svg · bone + green</span>
  </div>
  <div class="panel light">
    <span class="label">LIGHT MODE</span>
    <div class="logo-stage"><img src="../assets/logo-light.svg" alt="Old Mother's Altar — light" /></div>
    <span class="caption">assets/logo-light.svg · indigo + green</span>
  </div>
</body>
</html>
