<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Hero motif</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); height: 100%; }
  body {
    color: var(--fg-1); box-sizing: border-box; font-family: var(--font-body);
    padding: 0; min-height: 280px; position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 70%, rgba(243,83,33,0.18) 0%, transparent 38%),
      radial-gradient(circle at 80% 30%, rgba(45,78,166,0.20) 0%, transparent 42%);
    pointer-events: none;
  }
  .stage { position: relative; z-index: 1; padding: 26px 30px 24px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; }
  .roman {
    font-family: "Ohno Blazeface 72", var(--font-display); font-style: normal; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; font-size: 120px; line-height: 0.9;
    color: var(--bone); letter-spacing: -0.04em; opacity: 0.92;
  }
  .roman small { display:block; font-family: var(--font-body); font-style: normal; font-weight: 600; font-size: 10px; letter-spacing: 0.22em; color: var(--fg-3); margin-bottom: 8px; }
  .right { text-align: right; }
  .h2 {
    font-family: "Ohno Blazeface 36", var(--font-display); font-style: normal; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; font-size: 30px; line-height: 1.0;
    color: var(--bone); margin: 0 0 6px;
  }
  .sub { color: var(--fg-2); font-size: 14px; max-width: 260px; margin-left: auto; }
  .candle {
    position: absolute; right: 36px; top: 28px;
    width: 8px; height: 26px; background: var(--bone); border-radius: 2px;
    box-shadow: 0 0 0 1px var(--line-medium);
  }
  .flame {
    position: absolute; right: 33px; top: 14px; width: 14px; height: 18px;
    background: radial-gradient(ellipse 7px 9px at 50% 70%, var(--saffron) 0%, var(--ember) 60%, transparent 80%);
    filter: blur(0.5px);
    animation: flicker 2.4s var(--ease-candle) infinite;
  }
  @keyframes flicker {
    0%,100% { transform: translateY(0) scale(1); opacity: 0.92; }
    40%     { transform: translateY(-1px) scale(1.05); opacity: 1; }
    70%     { transform: translateY(1px) scale(0.97); opacity: 0.85; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="candle"></div>
  <div class="flame"></div>
  <div class="stage">
    <div class="roman"><small>CHAPTER</small>XVII</div>
    <div class="right">
      <div class="h2">The Waning Gibbous</div>
      <div class="sub">Three workings sealed this moon. The book remembers.</div>
    </div>
  </div>
</body>
</html>
