<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Light / Dark Modes</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 260px; }
  .pane {
    background: var(--bg-page); color: var(--fg-1);
    padding: 20px 22px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 14px;
    font-family: var(--font-body);
  }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); }
  .h3 {
    font-family: "Ohno Blazeface 24", var(--font-display);
    font-style: normal; font-weight: 400;
    font-size: 22px; line-height: 1.0;
    text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--fg-1);
  }
  .card {
    background: var(--bg-surface); border: 1px solid var(--line-soft);
    border-radius: var(--r-lg); padding: 14px 16px;
    box-shadow: var(--shadow-1);
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .btn {
    font-family: var(--font-body); font-weight: 600; font-size: 13px;
    letter-spacing: 0.04em; line-height: 1; border: 0; cursor: pointer;
    padding: 9px 14px; border-radius: var(--r-sm);
  }
  .btn-primary { background: var(--action-primary-bg); color: var(--action-primary-fg); }
  .btn-secondary {
    background: var(--action-secondary-bg); color: var(--action-secondary-fg);
    border: 1px solid var(--line-soft);
  }
  .swatches { display: flex; gap: 8px; }
  .sw { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line-soft); }
</style>
</head>
<body>
  <!-- DARK -->
  <div class="pane">
    <span class="eyebrow">Dark — default · altar</span>
    <div class="card">
      <div class="h3">Light the Candle</div>
      <div style="color: var(--fg-2); font-size: 12px; margin-top: 6px;">Bone text on near-black ink. The room is the altar.</div>
    </div>
    <div class="row">
      <button class="btn btn-primary">Seal the Working</button>
      <button class="btn btn-secondary">Cancel</button>
    </div>
    <div class="swatches">
      <span class="sw" style="background: var(--bg-page);"></span>
      <span class="sw" style="background: var(--bg-surface);"></span>
      <span class="sw" style="background: var(--fg-1);"></span>
      <span class="sw" style="background: var(--indigo-500);"></span>
      <span class="sw" style="background: var(--ember);"></span>
    </div>
  </div>

  <!-- LIGHT -->
  <div class="pane" data-theme="light">
    <span class="eyebrow">Light — vellum · the printed page</span>
    <div class="card">
      <div class="h3">Light the Candle</div>
      <div style="color: var(--fg-2); font-size: 12px; margin-top: 6px;">Ink on parchment. For printed entries and exports.</div>
    </div>
    <div class="row">
      <button class="btn btn-primary">Seal the Working</button>
      <button class="btn btn-secondary">Cancel</button>
    </div>
    <div class="swatches">
      <span class="sw" style="background: var(--bg-page);"></span>
      <span class="sw" style="background: var(--bg-surface);"></span>
      <span class="sw" style="background: var(--fg-1);"></span>
      <span class="sw" style="background: var(--indigo-500);"></span>
      <span class="sw" style="background: var(--ember);"></span>
    </div>
  </div>
</body>
</html>
