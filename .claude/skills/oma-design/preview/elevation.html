<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Shadows &amp; Glow</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 28px 28px; box-sizing: border-box; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .cell { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box {
    width: 100%; aspect-ratio: 1.3 / 1; background: var(--ink-200); border-radius: var(--r-lg);
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-2); font-size: 12px;
  }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: center; }
  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 18px; }
</style>
</head>
<body>
  <div class="label-top">ELEVATION — functional, not decorative</div>
  <div class="row">
    <div class="cell"><div class="box" style="box-shadow: var(--shadow-1);">rest</div><span class="meta">--shadow-1 · cards</span></div>
    <div class="cell"><div class="box" style="box-shadow: var(--shadow-2);">hover</div><span class="meta">--shadow-2 · hover lift</span></div>
    <div class="cell"><div class="box" style="box-shadow: var(--shadow-3);">modal</div><span class="meta">--shadow-3 · dialogs</span></div>
    <div class="cell"><div class="box" style="box-shadow: var(--glow-indigo);">focus</div><span class="meta">--glow-indigo · focus</span></div>
    <div class="cell"><div class="box" style="box-shadow: var(--glow-ember);">active cast</div><span class="meta">--glow-ember · rare</span></div>
  </div>
</body>
</html>
