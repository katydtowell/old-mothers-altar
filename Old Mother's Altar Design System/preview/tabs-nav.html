<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Tabs &amp; Side Nav Item</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 22px 24px; box-sizing: border-box; font-family: var(--font-body); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); margin-bottom: 18px; }
  .tab {
    padding: 10px 16px;
    font-family: var(--font-body); font-weight: 600; font-size: 13px;
    color: var(--fg-3); cursor: pointer; position: relative;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--fg-1); border-bottom-color: var(--amber); }

  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }

  .nav { display: flex; flex-direction: column; gap: 2px; width: 240px; }
  .navitem {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: var(--r-md);
    color: var(--fg-2); font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  .navitem .ico { width: 18px; height: 18px; border-radius: 4px; background: currentColor; opacity: 0.6; }
  .navitem.active { color: var(--fg-1); background: rgba(161,189,198,0.10); }
  .navitem.active .ico { opacity: 1; color: var(--amber); }
  .navitem:hover:not(.active) { background: rgba(161,189,198,0.05); }
</style>
</head>
<body>
  <div class="label-top">TABS</div>
  <div class="tabs">
    <div class="tab">Altar</div>
    <div class="tab active">Workings</div>
    <div class="tab">Moons</div>
    <div class="tab">Ingredients</div>
    <div class="tab">The Book</div>
  </div>

  <div class="label-top">SIDE NAV ITEM</div>
  <div class="nav">
    <div class="navitem active"><span class="ico"></span>Altar</div>
    <div class="navitem"><span class="ico"></span>Workings</div>
    <div class="navitem"><span class="ico"></span>The Book</div>
    <div class="navitem"><span class="ico"></span>Ingredients</div>
  </div>
</body>
</html>
