<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Color · Ink & Slate</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body {
    font-family: var(--font-body);
    color: var(--fg-1);
    padding: 20px 24px;
    box-sizing: border-box;
  }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .swatch {
    aspect-ratio: 1.5 / 1;
    border-radius: 8px;
    border: 1px solid var(--line-soft);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    font-family: var(--font-body);
  }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  .hex  { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; }
  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="label-top">INK · SLATE — surfaces & text (warm sepia)</div>
  <div class="row">
    <div class="swatch" style="background: var(--ink-100); color: var(--slate-300);">
      <span class="name">ink-100</span><span class="hex">#14110D</span>
    </div>
    <div class="swatch" style="background: var(--ink-200); color: var(--slate-300);">
      <span class="name">ink-200</span><span class="hex">#1F1A14</span>
    </div>
    <div class="swatch" style="background: var(--ink-300); color: var(--slate-200);">
      <span class="name">ink-300</span><span class="hex">#2E2620</span>
    </div>
    <div class="swatch" style="background: var(--slate-500); color: var(--bone);">
      <span class="name">slate-500</span><span class="hex">#7A6850</span>
    </div>
    <div class="swatch" style="background: var(--slate-300); color: var(--ink-100);">
      <span class="name">slate-300</span><span class="hex">#BFAA84</span>
    </div>
    <div class="swatch" style="background: var(--slate-200); color: var(--ink-100);">
      <span class="name">slate-200</span><span class="hex">#EDE4D2</span>
    </div>
  </div>
</body>
</html>
