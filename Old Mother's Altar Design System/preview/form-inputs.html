<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Form Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 22px 24px; box-sizing: border-box; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
  .input, .ta, .sel {
    font-family: var(--font-body); font-size: 14px; color: var(--fg-1);
    background: var(--bg-surface);
    border: 1px solid var(--line-medium);
    border-radius: var(--r-xs);
    padding: 10px 12px;
    outline: none;
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .input::placeholder { color: var(--fg-3); }
  .input:focus, .ta:focus, .sel:focus {
    border-color: var(--indigo-300);
    box-shadow: 0 0 0 2px rgba(45,78,166,0.30);
  }
  .input.err { border-color: var(--crimson-300); }
  .err-msg { color: var(--crimson-300); font-size: 12px; }

  .check {
    display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fg-1);
    user-select: none;
  }
  .check-box {
    width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--slate-500);
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
  }
  .check.on .check-box { background: var(--indigo-500); border-color: var(--indigo-500); }
  .check.on .check-box::after { content: ""; width: 6px; height: 10px; border: solid var(--bone); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }

  .toggle { width: 36px; height: 20px; background: var(--ink-300); border-radius: 999px; position: relative; transition: background var(--dur-base); }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--slate-300); border-radius: 50%; transition: transform var(--dur-base) var(--ease-out), background var(--dur-base); }
  .toggle.on { background: var(--indigo-500); }
  .toggle.on::after { transform: translateX(16px); background: var(--bone); }

  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="label-top">FORM ELEMENTS</div>
  <div class="grid">
    <div class="field">
      <label class="lbl">Working name</label>
      <input class="input" value="Salt for the threshold" />
    </div>
    <div class="field">
      <label class="lbl">Moon</label>
      <select class="sel"><option>Waning gibbous</option></select>
    </div>
    <div class="field">
      <label class="lbl">Notes</label>
      <textarea class="ta" rows="2">She left a sprig of rosemary on the sill.</textarea>
    </div>
    <div class="field" style="gap: 12px;">
      <span class="check on"><span class="check-box"></span>Bind to the book</span>
      <span class="check"><span class="check-box"></span>Repeat next moon</span>
      <span style="display:inline-flex;gap:10px;align-items:center;font-size:14px;"><span class="toggle on"></span>Private working</span>
    </div>
    <div class="field">
      <label class="lbl">Ingredient (error state)</label>
      <input class="input err" value="" placeholder="Required" />
      <span class="err-msg">The book needs at least one ingredient.</span>
    </div>
  </div>
</body>
</html>
