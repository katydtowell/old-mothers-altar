<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Color · Tarot Accents</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { font-family: var(--font-body); color: var(--fg-1); padding: 20px 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .swatch {
    aspect-ratio: 1 / 1.1; border-radius: 8px; border: 1px solid var(--line-soft);
    padding: 9px 10px; display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box;
  }
  .name { font-size: 10px; font-weight: 600; }
  .hex  { font-family: var(--font-mono); font-size: 9px; opacity: 0.75; }
  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="label-top">TAROT ACCENTS — Palladini Aquarian 1970, used sparingly</div>
  <div class="row">
    <div class="swatch" style="background: var(--ember); color: var(--ink-100);"><span class="name">ember</span><span class="hex">#F35321</span></div>
    <div class="swatch" style="background: var(--vermillion); color: var(--bone);"><span class="name">vermillion</span><span class="hex">#C34530</span></div>
    <div class="swatch" style="background: var(--saffron); color: var(--ink-100);"><span class="name">saffron</span><span class="hex">#F59823</span></div>
    <div class="swatch" style="background: var(--amber); color: var(--ink-100);"><span class="name">amber</span><span class="hex">#F4AF59</span></div>
    <div class="swatch" style="background: var(--gold); color: var(--ink-100);"><span class="name">gold</span><span class="hex">#FFCE00</span></div>
    <div class="swatch" style="background: var(--moss); color: var(--ink-100);"><span class="name">moss</span><span class="hex">#96A560</span></div>
    <div class="swatch" style="background: var(--olive); color: var(--bone);"><span class="name">olive</span><span class="hex">#976F34</span></div>
    <div class="swatch" style="background: var(--plum); color: var(--bone);"><span class="name">plum</span><span class="hex">#764883</span></div>
  </div>
  <div class="row" style="margin-top:8px;">
    <div class="swatch" style="background: var(--bone); color: var(--ink-100); grid-column: span 2;"><span class="name">bone — parchment / vellum</span><span class="hex">#FDFEEB</span></div>
  </div>
</body>
</html>
