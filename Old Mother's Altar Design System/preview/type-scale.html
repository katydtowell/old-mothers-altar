<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 22px 28px; box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; font-family: var(--font-body); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: baseline; }
  .meta { color: var(--fg-3); font-size: 11px; letter-spacing: 0.08em; font-family: var(--font-mono); width: 110px; }
  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="label-top">SCALE — semantic text classes</div>
  <table>
    <tr><td class="meta">.oma-display</td><td><span class="oma-display" style="font-size:34px;">Light the candle</span></td></tr>
    <tr><td class="meta">.oma-h1</td><td><span class="oma-h1" style="font-size:26px;">Begin a working</span></td></tr>
    <tr><td class="meta">.oma-h2</td><td><span class="oma-h2" style="font-size:22px;">A waning moon</span></td></tr>
    <tr><td class="meta">.oma-h3</td><td><span class="oma-h3" style="font-size:18px;">Last cast — XIII days ago</span></td></tr>
    <tr><td class="meta">.oma-p</td><td><span class="oma-p" style="font-size:14px;">The book holds your secrets. It does not share them.</span></td></tr>
    <tr><td class="meta">.oma-small</td><td><span class="oma-small">A short, secondary note.</span></td></tr>
    <tr><td class="meta">.oma-eyebrow</td><td><span class="oma-eyebrow">SEALED WORKINGS</span></td></tr>
    <tr><td class="meta">.oma-mono</td><td><span class="oma-mono">2026-05-13 · 21:47</span></td></tr>
  </table>
</body>
</html>
