<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 22px 28px; box-sizing: border-box; font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 110px; }
  .bar { height: 12px; background: var(--slate-300); border-radius: 2px; }
  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="label-top">SPACING — 4px grid</div>
  <div class="row"><span class="meta">--s-1 · 4</span><div class="bar" style="width:4px;"></div></div>
  <div class="row"><span class="meta">--s-2 · 8</span><div class="bar" style="width:8px;"></div></div>
  <div class="row"><span class="meta">--s-3 · 12</span><div class="bar" style="width:12px;"></div></div>
  <div class="row"><span class="meta">--s-4 · 16</span><div class="bar" style="width:16px;"></div></div>
  <div class="row"><span class="meta">--s-5 · 20</span><div class="bar" style="width:20px;"></div></div>
  <div class="row"><span class="meta">--s-6 · 24</span><div class="bar" style="width:24px;"></div></div>
  <div class="row"><span class="meta">--s-7 · 32</span><div class="bar" style="width:32px;"></div></div>
  <div class="row"><span class="meta">--s-8 · 40</span><div class="bar" style="width:40px;"></div></div>
  <div class="row"><span class="meta">--s-9 · 56</span><div class="bar" style="width:56px;"></div></div>
  <div class="row"><span class="meta">--s-10 · 72</span><div class="bar" style="width:72px;"></div></div>
  <div class="row"><span class="meta">--s-11 · 96</span><div class="bar" style="width:96px;"></div></div>
</body>
</html>
