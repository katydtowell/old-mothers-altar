<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 26px 28px; box-sizing: border-box; font-family: var(--font-body); }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .meta-col { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); width: 90px; }

  .btn {
    font-family: var(--font-body); font-weight: 600; letter-spacing: 0.04em;
    border: 0; cursor: pointer; line-height: 1; border-radius: var(--r-sm);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .btn:active { transform: scale(0.99); }
  .btn-lg { padding: 14px 20px; font-size: 15px; }
  .btn-md { padding: 10px 16px; font-size: 14px; }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: var(--r-xs); }

  .btn-primary   { background: var(--action-primary-bg); color: var(--action-primary-fg); }
  .btn-primary:hover { background: var(--action-primary-hover); }
  .btn-secondary { background: var(--action-secondary-bg); color: var(--action-secondary-fg); border: 1px solid var(--line-soft); }
  .btn-secondary:hover { background: var(--action-secondary-hover); }
  .btn-ghost     { background: transparent; color: var(--action-ghost-fg); }
  .btn-ghost:hover { background: var(--action-secondary-bg); }
  .btn-danger    { background: var(--action-danger-bg); color: var(--action-danger-fg); }
  .btn-disabled  { background: rgba(161,189,198,0.05); color: var(--fg-3); cursor: not-allowed; }

  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="label-top">BUTTONS — primary, secondary, ghost, danger</div>
  <div class="row">
    <span class="meta-col">LG · 48</span>
    <button class="btn btn-lg btn-primary">Seal the Working</button>
    <button class="btn btn-lg btn-secondary">Save Draft</button>
    <button class="btn btn-lg btn-ghost">Cancel</button>
    <button class="btn btn-lg btn-danger">Break the Binding</button>
  </div>
  <div class="row">
    <span class="meta-col">MD · 36</span>
    <button class="btn btn-md btn-primary">Begin a Working</button>
    <button class="btn btn-md btn-secondary">Add Ingredient</button>
    <button class="btn btn-md btn-ghost">Dismiss</button>
    <button class="btn btn-md btn-disabled">Locked</button>
  </div>
  <div class="row">
    <span class="meta-col">SM · 28</span>
    <button class="btn btn-sm btn-primary">Cast Now</button>
    <button class="btn btn-sm btn-secondary">Note</button>
    <button class="btn btn-sm btn-ghost">More</button>
  </div>
</body>
</html>
