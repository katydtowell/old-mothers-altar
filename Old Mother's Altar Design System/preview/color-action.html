<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Color · Action</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { font-family: var(--font-body); color: var(--fg-1); padding: 20px 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .swatch {
    aspect-ratio: 1.5 / 1; border-radius: 8px; border: 1px solid var(--line-soft);
    padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box;
  }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  .hex  { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; }
  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="label-top">INDIGO · CRIMSON — actions &amp; bindings</div>
  <div class="row">
    <div class="swatch" style="background: var(--indigo-300); color: var(--bone);">
      <span class="name">indigo-300</span><span class="hex">#4F71C7</span>
    </div>
    <div class="swatch" style="background: var(--indigo-500); color: var(--bone);">
      <span class="name">indigo-500</span><span class="hex">#2D4EA6</span>
    </div>
    <div class="swatch" style="background: var(--indigo-700); color: var(--bone);">
      <span class="name">indigo-700</span><span class="hex">#1F3878</span>
    </div>
    <div class="swatch" style="background: var(--crimson-300); color: var(--ink-100);">
      <span class="name">crimson-300</span><span class="hex">#E84A6B</span>
    </div>
    <div class="swatch" style="background: var(--crimson-500); color: var(--bone);">
      <span class="name">crimson-500</span><span class="hex">#D41840</span>
    </div>
    <div class="swatch" style="background: var(--crimson-700); color: var(--bone);">
      <span class="name">crimson-700</span><span class="hex">#8C0E2A</span>
    </div>
  </div>
</body>
</html>
