<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Radius</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 24px 28px; box-sizing: border-box; font-family: var(--font-body); }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 70px; height: 70px; background: var(--ink-300); border: 1px solid var(--line-soft); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .label-top { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 18px; }
</style>
</head>
<body>
  <div class="label-top">RADII</div>
  <div class="row">
    <div class="cell"><div class="box" style="border-radius: var(--r-xs);"></div><span class="meta">--r-xs · 4 · inputs</span></div>
    <div class="cell"><div class="box" style="border-radius: var(--r-sm);"></div><span class="meta">--r-sm · 6 · buttons</span></div>
    <div class="cell"><div class="box" style="border-radius: var(--r-md);"></div><span class="meta">--r-md · 8 · menus</span></div>
    <div class="cell"><div class="box" style="border-radius: var(--r-lg);"></div><span class="meta">--r-lg · 10 · cards</span></div>
    <div class="cell"><div class="box" style="border-radius: var(--r-xl);"></div><span class="meta">--r-xl · 16 · dialogs</span></div>
    <div class="cell"><div class="box" style="border-radius: var(--r-2xl);"></div><span class="meta">--r-2xl · 24 · sheets</span></div>
    <div class="cell"><div class="box" style="border-radius: var(--r-pill);"></div><span class="meta">--r-pill · tags</span></div>
  </div>
</body>
</html>
