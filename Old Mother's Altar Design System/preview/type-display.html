<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMA — Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { color: var(--fg-1); padding: 22px 28px; box-sizing: border-box; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; align-items: baseline; gap: 18px; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; min-width: 170px; }
  .spec { color: var(--fg-1); font-style: normal; font-weight: 400; }
  .label-top { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="label-top">DISPLAY — Ohno Blazeface, roman optical sizes</div>
  <div class="stack">
    <div class="row">
      <span class="meta">72pt · chapter</span>
      <span class="spec" style="font-family:'Ohno Blazeface 72';  text-transform: uppercase; letter-spacing: 0.02em;font-size:60px; line-height:0.9; letter-spacing:-0.02em;">The Altar</span>
    </div>
    <div class="row">
      <span class="meta">48pt · hero</span>
      <span class="spec" style="font-family:'Ohno Blazeface 48';  text-transform: uppercase; letter-spacing: 0.02em;font-size:38px; line-height:0.95;">Light the Candle</span>
    </div>
    <div class="row">
      <span class="meta">36pt · section</span>
      <span class="spec" style="font-family:'Ohno Blazeface 36';  text-transform: uppercase; letter-spacing: 0.02em;font-size:28px;">The Waning Gibbous</span>
    </div>
    <div class="row">
      <span class="meta">24pt · card</span>
      <span class="spec" style="font-family:'Ohno Blazeface 24';  text-transform: uppercase; letter-spacing: 0.02em;font-size:20px;">A Working for Sleep</span>
    </div>
    <div class="row">
      <span class="meta">18pt · row</span>
      <span class="spec" style="font-family:'Ohno Blazeface 18';  text-transform: uppercase; letter-spacing: 0.02em;font-size:15px;">Rosemary, on a String</span>
    </div>
  </div>
</body>
</html>
