<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Altar — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #07090A;
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--fg-1);
  }
  body {
    display: flex; justify-content: center; align-items: center;
    padding: 40px 20px; box-sizing: border-box;
    background:
      radial-gradient(circle at 50% 30%, rgba(45,78,166,0.10) 0%, transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(243,83,33,0.06) 0%, transparent 50%),
      #07090A;
  }
  /* On mobile, let the app fill the screen — no centering padding or fixed bg needed */
  @media (max-width: 599px) {
    html, body {
      height: 100%; overflow: hidden;
    }
    body {
      padding: 0;
      background: none;
      display: block;
    }
    #root {
      width: 100%; height: 100%;
    }
    .hint { display: none; }
  }
  @keyframes omaFadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes omaSheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  /* candle flame breath */
  .oma-flame { animation: omaCandle 2.4s var(--ease-candle) infinite; transform-origin: center bottom; filter: blur(0.2px); }
  @keyframes omaCandle {
    0%, 100% { transform: scaleY(1)    scaleX(1)    translateX(0); opacity: 0.95; }
    35%      { transform: scaleY(1.05) scaleX(0.95) translateX(0.5px); opacity: 1; }
    65%      { transform: scaleY(0.97) scaleX(1.03) translateX(-0.5px); opacity: 0.85; }
  }
  /* hide scrollbars inside the frame for cleanliness */
  ::-webkit-scrollbar { width: 0; height: 0; }
  /* page hint */
  .hint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.45); font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.12em; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="hint">THE ALTAR · UI KIT · TAP THE TABS</div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="illustrations.jsx"></script>
  <script type="text/babel" src="Altar.jsx"></script>
  <script type="text/babel" src="Workings.jsx"></script>
  <script type="text/babel" src="WorkingDetail.jsx"></script>
  <script type="text/babel" src="TheBook.jsx"></script>
  <script type="text/babel" src="NewWorking.jsx"></script>
  <script type="text/babel" src="Cabinet.jsx"></script>
  <script type="text/babel" src="Profile.jsx"></script>
  <script type="text/babel" src="NewEntry.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
  <script type="text/babel" src="Splash.jsx"></script>
  <script type="text/babel" src="Login.jsx"></script>

  <script type="text/babel">
    function Root() {
      const [theme, setTheme] = React.useState('dark');
      // 'splash' → 'app' on first launch (login is skipped)
      // 'app' → 'login' on logout (then 'login' → 'app' on sign-in)
      const [screen, setScreen] = React.useState('splash');

      // Use matchMedia instead of window.innerWidth + resize so the JS breakpoint
      // stays in perfect sync with CSS media queries — including DevTools device emulation.
      const [isMobile, setIsMobile] = React.useState(
        () => window.matchMedia('(max-width: 599px)').matches
      );
      React.useEffect(() => {
        const mq = window.matchMedia('(max-width: 599px)');
        function handler(e) { setIsMobile(e.matches); }
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);

      // Logout shows the login screen instead of splash
      window.OMA_ON_LOGOUT = () => setScreen('login');

      const isDesktop = !isMobile;

      const content = (
        <>
          {screen === 'splash' && (
            <Splash onDone={() => setScreen('app')} />
          )}
          {screen === 'login' && (
            <Login onSignIn={() => setScreen('app')} />
          )}
          {screen === 'app' && (
            <App theme={theme} setTheme={setTheme} />
          )}
        </>
      );

      if (isDesktop) {
        return (
          <IOSDevice width={402} height={874} dark={theme === 'dark'}>
            {content}
          </IOSDevice>
        );
      }

      // On mobile: fill the full screen without the device frame
      return (
        <div data-theme={theme} style={{
          width: '100vw', height: '100dvh',
          background: 'var(--bg-page)',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden',
          position: 'fixed', inset: 0,
        }}>
          {content}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
